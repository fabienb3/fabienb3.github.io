   fond bien après la campagne — complet au niveau 5 × (nombre d'étoiles),
   115 aujourd'hui avec 4 constellations, 500 visé à terme avec la
   bibliothèque complète. */
const SKY_LEVELS_PER_STAR = 5;

/* ============================================================
   LevelManager — génération des niveaux
   ------------------------------------------------------------
   Rôle    : fabrique chaque niveau à partir de son NUMÉRO seul.
   Expose  : build(n), config(n), TOTAL (150, fin de campagne),
             tierOf(n), isMilestone(n).
   Dépend  : PieceManager, Solver (validation à la génération).
   Piège   : la génération est DÉTERMINISTE — build(n) doit
             toujours redonner le même puzzle, sinon la progression
             sauvegardée (indexée par numéro) ne correspond plus à
             rien. Modifier l'ordre des appels au générateur
             aléatoire casse cette garantie. Vérifié par
             determinisme_test.js.
   ============================================================ */
const LevelManager = {
  TOTAL: 150,

  /** Générateur pseudo-aléatoire à graine. */
  rng(seed){
    let a = (seed * 2654435761) >>> 0;
    return function(){
      a += 0x6D2B79F5; a >>>= 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  },

  /** La zone reste-t-elle d'un seul tenant ? */
  connected(set){
    const keys = [...set];
    if (!keys.length) return false;
    const seen = new Set([keys[0]]), queue = [keys[0]];
    while (queue.length){
      const p = queue.pop().split(",");
      const c = +p[0], r = +p[1];
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>{
        const k = (c+d[0])+","+(r+d[1]);
        if (set.has(k) && !seen.has(k)){ seen.add(k); queue.push(k); }
      });
    }
    return seen.size === set.size;
  },

  /* ---------------- Familles de silhouettes ----------------
     Chacune rend un ensemble de cases. La symétrie est le premier levier
     de qualité : une forme symétrique a l'air dessinée, une soustraction
     au hasard a l'air accidentelle. */
  shapes: {
    /** Rectangle plein. */
    rect(cols, rows){
      const s = new Set();
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) s.add(c+","+r);
      return s;
    },

    /** Rectangle grignoté sur les bords. */
    notched(cols, rows, rand, k){
      const s = LevelManager.shapes.rect(cols, rows);
      k = k === undefined ? 2 : k;
      for (let i = 0; i < k; i++){
        const bord = [...s].filter(key=>{
          const p = key.split(","), c = +p[0], r = +p[1];
          return c === 0 || r === 0 || c === cols-1 || r === rows-1;
        });
        if (!bord.length) break;
        const kk = bord[Math.floor(rand() * bord.length)];
        s.delete(kk);
        if (!LevelManager.connected(s)) s.add(kk);
      }
      return s;
    },

    /** Croix : les quatre coins retirés, symétrie parfaite. */
    cross(cols, rows, rand){
      const s = LevelManager.shapes.rect(cols, rows);
      const a = 1 + Math.floor(rand() * Math.max(1, Math.floor((cols-1)/2)));
      const b = 1 + Math.floor(rand() * Math.max(1, Math.floor((rows-1)/2)));
      for (let r = 0; r < b; r++) for (let c = 0; c < a; c++){
        s.delete(c+","+r);
        s.delete((cols-1-c)+","+r);
        s.delete(c+","+(rows-1-r));
        s.delete((cols-1-c)+","+(rows-1-r));
      }
      return s;
    },

    /** Losange : cases proches du centre en distance de Manhattan. */
    diamond(cols, rows, rand){
      const s = new Set();
      const cx = (cols-1)/2, cy = (rows-1)/2;
      const seuil = (cx + cy) * (.74 + rand() * .20);
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
        if (Math.abs(c-cx) + Math.abs(r-cy) <= seuil) s.add(c+","+r);
      return s;
    },

    /** Cadre : un trou au milieu. Les pièces doivent contourner. */
    frame(cols, rows, rand){
      const s = LevelManager.shapes.rect(cols, rows);
      if (cols < 4 || rows < 4) return s;
      const w = 1 + Math.floor(rand() * (cols - 3));
      const h = 1 + Math.floor(rand() * (rows - 3));
      const x = 1 + Math.floor(rand() * (cols - 1 - w));
      const y = 1 + Math.floor(rand() * (rows - 1 - h));
      for (let r = y; r < y+h; r++) for (let c = x; c < x+w; c++) s.delete(c+","+r);
      return s;
    },

    /** Escalier : un coin taillé en marches. */
    stair(cols, rows, rand){
      const s = LevelManager.shapes.rect(cols, rows);
      const prof = 1 + Math.floor(rand() * Math.max(1, Math.min(cols, rows) - 2));
      const coin = Math.floor(rand() * 4);
      for (let i = 0; i < prof; i++) for (let j = 0; j < prof - i; j++){
        let c = i, r = j;
        if (coin === 1){ c = cols-1-i; }
        if (coin === 2){ c = cols-1-i; r = rows-1-j; }
        if (coin === 3){ r = rows-1-j; }
        s.delete(c+","+r);
      }
      return s;
    },

    /** Dôme symétrique : chaque colonne est un segment continu qui se
        rétracte en s'éloignant du centre. Connexe par construction. */
    mirror(cols, rows, rand){
      const s = new Set();
      const half = Math.ceil(cols/2);
      let haut = 0, bas = rows - 1;
      for (let c = half - 1; c >= 0; c--){
        for (let r = haut; r <= bas; r++){ s.add(c+","+r); s.add((cols-1-c)+","+r); }
        if (bas - haut > 1 && rand() < .55) haut++;
        if (bas - haut > 1 && rand() < .55) bas--;
      }
      return s;
    },

    /** Peigne : dents retirées sur une rangée extrême. */
    bars(cols, rows, rand){
      const s = LevelManager.shapes.rect(cols, rows);
      const bas = rand() < .5;
      const prof = 1 + Math.floor(rand() * Math.max(1, Math.floor(rows/3)));
      for (let c = 0; c < cols; c += 2)
        for (let i = 0; i < prof; i++) s.delete(c+","+(bas ? rows-1-i : i));
      return s;
    }
  },

  /** Fait pivoter et retourne une silhouette au hasard : chaque forme de
      base se décline ainsi en huit variantes, dont des grilles couchées. */
  orient(set, rand){
    let out = set;
    const tours = Math.floor(rand() * 4);
    for (let i = 0; i < tours; i++){
      const next = new Set();
      out.forEach(k => { const p = k.split(","); next.add((-(+p[1]))+","+(+p[0])); });
      out = next;
    }
    if (rand() < .5){
      const next = new Set();
      out.forEach(k => { const p = k.split(","); next.add((-(+p[0]))+","+p[1]); });
      out = next;
    }
    return out;
  },

  /** Valide une silhouette et la recadre sur sa boîte englobante, pour
      qu'aucune rangée vide ne vienne rétrécir le plateau à l'écran. */
  finish(set, minCells){
    if (!set || set.size < minCells) return null;
    if (!LevelManager.connected(set)) return null;
    const pts = [...set].map(k => k.split(",").map(Number));
    const minC = Math.min(...pts.map(p=>p[0])), minR = Math.min(...pts.map(p=>p[1]));
    const maxC = Math.max(...pts.map(p=>p[0])), maxR = Math.max(...pts.map(p=>p[1]));
    return {
      target: new Set(pts.map(p => (p[0]-minC)+","+(p[1]-minR))),
      cols: maxC - minC + 1,
      rows: maxR - minR + 1
    };
  },

  /* ---------------- Facettes triangulaires ----------------
     Ce module ne touche jamais aux silhouettes (les huit familles de
     formes ci-dessus, la découpe en cases entières, la courbe de
     difficulté) — tout ça reste exactement ce qui a déjà été validé
     sur les 150 niveaux. Une fois les pièces déjà formées en cases
     entières, une case à la frontière entre deux pièces peut se
     scinder en diagonale : une moitié reste dans sa pièce d'origine,
     l'autre est donnée à la pièce voisine. La cible et le nombre de
     cases ne changent pas — seule la silhouette finale des pièces
     gagne une facette, à l'endroit choisi. Vérifié séparément, avant
     d'être intégré ici : 150 niveaux réels, 3000 tentatives poussées
     à l'épuisement, zéro échec de surface, de connexion ou de
     chevauchement. */
  isConnectedCells(cells){
    if (!cells.length) return false;
    const seen = new Set([0]), queue = [0];
    while (queue.length){
      const i = queue.pop();
      for (let j = 0; j < cells.length; j++){
        if (seen.has(j)) continue;
        if (LevelManager.cellsAdjacent(cells[i], cells[j])){ seen.add(j); queue.push(j); }
      }
    }
    return seen.size === cells.length;
  },
  /** Deux cases (entières ou triangulaires) partagent-elles une arête
      complète ? Lève une erreur plutôt que de répondre faux en silence
      si les deux cases occupent la même position sans être un couple
      de triangles complémentaires — une configuration qui ne peut
      jamais provenir d'une forme valide. */
  cellsAdjacent(c1, c2){
    if (c1.c === c2.c && c1.r === c2.r){
      if (!c1.t || !c2.t || PieceManager.COMPLEMENT[c1.t] !== c2.t){
        throw new Error("cases incompatibles à la même position (" + c1.c + "," + c1.r + ")");
      }
      return true;
    }
    const dc = c2.c - c1.c, dr = c2.r - c1.r;
    const DIRS = { "1,0":["E","W"], "-1,0":["W","E"], "0,1":["S","N"], "0,-1":["N","S"] };
    const k = dc+","+dr;
    if (!DIRS[k]) return false;
    const [need1, need2] = DIRS[k];
    return PieceManager.edgesOf(c1).includes(need1) && PieceManager.edgesOf(c2).includes(need2);
  },
  /** Tente UNE découpe triangulaire à une frontière aléatoire entre
      deux groupes distincts (tableaux de cases). Renvoie true si
      appliquée (groups modifié sur place), false sinon. */
  tryTriangleCut(groups, rand){
    const TOUCHING = { E:["TR","BR"], W:["TL","BL"], N:["TL","TR"], S:["BR","BL"] };
    const DIR_OF = { "1,0":"E", "-1,0":"W", "0,1":"S", "0,-1":"N" };
    const owner = new Map();
    groups.forEach((g, gi) => g.forEach(cell => { if (!cell.t) owner.set(PieceManager.keyOf(cell), gi); }));

    const frontieres = [];
    groups.forEach((g, gi) => g.forEach(cellA => {
      if (cellA.t) return;
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dc,dr])=>{
        const kB = (cellA.c+dc)+","+(cellA.r+dr);
        const gj = owner.get(kB);
        if (gj !== undefined && gj !== gi){
          const cellB = groups[gj].find(c => !c.t && PieceManager.keyOf(c) === kB);
          if (cellB) frontieres.push({ gi, gj, cellA, dir: DIR_OF[dc+","+dr] });
        }
      });
    }));
    if (!frontieres.length) return false;

    const shuffle = arr => { const a = arr.slice();
      for (let i = a.length-1; i > 0; i--){ const j = Math.floor(rand()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
      return a; };

    for (const f of shuffle(frontieres)){
      /* Une donation ne doit jamais faire déborder la pièce receveuse
         hors de l'emprise qu'elle occupe déjà — sinon une pièce peut
         grandir dans la réserve au point de grignoter la place que le
         plateau reçoit à l'écran. Mesuré sur les 150 niveaux : un seul
         en souffrait avant cette garde, sa case la plus petite tombait
         à 22px au lieu des 27px habituels. */
      const bC = groups[f.gj].map(c=>c.c), bR = groups[f.gj].map(c=>c.r);
      const deborde = f.cellA.c < Math.min(...bC) || f.cellA.c > Math.max(...bC) ||
                       f.cellA.r < Math.min(...bR) || f.cellA.r > Math.max(...bR);
      if (deborde) continue;
      for (const donne of shuffle(TOUCHING[f.dir].slice())){
        const garde = PieceManager.COMPLEMENT[donne];
        const nouveauA = groups[f.gi].map(c => c === f.cellA ? { c:c.c, r:c.r, t:garde } : c);
        const nouveauB = groups[f.gj].concat([{ c:f.cellA.c, r:f.cellA.r, t:donne }]);
        if (LevelManager.isConnectedCells(nouveauA) && LevelManager.isConnectedCells(nouveauB)){
          groups[f.gi] = nouveauA;
          groups[f.gj] = nouveauB;
          return true;
        }
      }
    }
    return false;
  },

  /* ---------------- Progression ----------------
     Les bandes sont exprimées en fraction du parcours : la courbe reste
     valable quel que soit le nombre total de niveaux. */
  bands: [
    { upto:.08, grids:[[3,4],[4,4]],       fams:["rect","notched"] },
    { upto:.22, grids:[[4,4],[4,5]],       fams:["notched","cross"] },
    { upto:.40, grids:[[4,5],[5,5]],       fams:["notched","cross","diamond","mirror"] },
    { upto:.60, grids:[[5,5],[5,6]],       fams:["notched","mirror","stair","diamond"] },
    { upto:.80, grids:[[5,6],[6,6]],       fams:["notched","mirror","stair","frame","bars"] },
    { upto:2,   grids:[[6,6],[6,7],[7,7]], fams:["mirror","stair","frame","bars","cross","notched"] }
  ],

  tierRanges(){
    const T = this.TOTAL;
    const a = Math.max(1, Math.round(T * .30)), b = Math.max(a+1, Math.round(T * .70));
    return [["t_easy", 1, a], ["t_med", a+1, b], ["t_hard", b+1, T]];
  },

  tierOf(n){
    const r = this.tierRanges().find(x => n <= x[2]);
    return r ? r[0] : "t_hard";
  },

  /** Même étiquette de palier que la campagne, mais dérivée directement
      d'une fraction de progression — utile au mode Flux, qui n'a pas de
      "niveau n" ni de total fixe sur lequel asseoir tierOf(n). */
  tierFromP(p){
    if (p <= .30) return "t_easy";
    if (p <= .70) return "t_med";
    return "t_hard";
  },

  /** Un niveau "jalon" : tous les 10 jusqu'à 100, puis tous les 50
      au-delà. Une règle plutôt qu'une liste écrite à la main — elle
      continue de faire sens quel que soit le niveau atteint, sans
      jamais avoir besoin d'être complétée à la main plus tard. */
  isMilestone(n){ return n > 0 && (n <= 100 ? n % 10 === 0 : n % 50 === 0); },

  /* Trois contraintes nouvelles, introduites à des paliers distincts et
     jamais toutes d'un coup. Elles répondent au constat de l'audit :
     jusqu'ici la difficulté venait du VOLUME (14 cases au niveau 1,
     49 au niveau 145) et non de la réflexion — le solveur mesurait le
     même effort au niveau 145 qu'au niveau 1. Agrandir la grille était
     exclu : mesuré auparavant, la case tombait à 15 px, injouable au
     doigt. La difficulté vient donc de RÈGLES, pas de la taille.

     Chaque règle apparaît seule, avec de la marge avant la suivante,
     pour que le joueur ait le temps de la comprendre. */
  /* Fin de la PHASE DE VARIÉTÉ. Au-delà, le parcours devient un
     polyomino pur : plus de facettes triangulaires, plus de cases
     interdites, d'ancrages ni de pièces figées. Ce n'est pas un
     appauvrissement, c'est ce qui LIBÈRE la difficulté.

     Mesuré, et contraire à l'intuition : chacune de ces mécaniques
     RÉDUIT l'effort réel, parce qu'elle contraint la grille et guide
     la recherche. Sur le niveau 145, à grille et pièces identiques :
     10 nœuds avec les facettes, 3112 sans. Un facteur 300. Le plafond
     de difficulté ne venait pas de la taille de l'écran comme on le
     croyait — il venait de ces mécaniques d'aide. */
  FIN_VARIETE: .60,
  contraintes(p){
    if (p >= this.FIN_VARIETE) return { figees: 0 };
    /* Les CASES INTERDITES et les ANCRAGES DE COULEUR ont été retirés.

       Mesuré au niveau 70, à grille et pièces identiques : 12 nœuds
       sans case interdite, 8 avec — elles rendaient le jeu plus facile,
       pas plus dur, puisqu'un trou réduit le nombre de façons de
       remplir. Leur seul apport était visuel.

       Les ancrages étaient pires : sur 61 pièces ancrées entre les
       niveaux 25 et 90, 30 n'avaient plus qu'UN SEUL emplacement
       possible. Une fois sur deux, l'ancrage plaçait littéralement la
       pièce — un indice gratuit déguisé en contrainte. Fabien l'a
       remarqué en jouant avant que la mesure ne le confirme.

       Il ne reste donc que les pièces figées, qui n'ont pas ce défaut :
       elles retirent la résolution à l'aveugle sans désigner de
       réponse. */
    return { figees: p < .42 ? 0 : Math.min(3, 1 + Math.floor((p - .42) * 8.0)) };
  },
  /* Facettes triangulaires : elles montent, culminent au milieu du
     parcours, puis s'effacent complètement. La courbe précédente les
     faisait croître avec la difficulté — exactement à l'envers de ce
     qu'il fallait. */
  facettesPour(p){
    if (p >= this.FIN_VARIETE) return 0;
    const q = p / this.FIN_VARIETE;                 // 0 → 1 sur la phase de variété
    return Math.max(0, Math.round(5 * Math.sin(Math.PI * q)));
  },
  config(n){
    const p = (n - 1) / Math.max(1, this.TOTAL - 1);
    const band = this.bands.find(b => p <= b.upto) || this.bands[this.bands.length - 1];
    /* Plafond ramené de 10 à 8. Mesuré : à 10 pièces sur 7x7 et sans
       facettes, AUCUN candidat sur 50 n'a de solution unique — la fin
       de campagne était structurellement incompatible avec l'exigence
       d'une réponse unique. Le point optimal est à 8 pièces : c'est
       là qu'on atteint 3112 nœuds. */
    const pieces = Math.max(3, Math.min(8, 3 + Math.round(p * 6)));
    return Object.assign({ band, pieces, p }, this.contraintes(p));
  },

  /** Progression du mode Flux : une fraction qui grimpe vite au début puis
      se rapproche d'un plafond sans jamais tout à fait l'atteindre — la
      difficulté continue de monter indéfiniment, mais de moins en moins
      vite, plutôt que de s'arrêter net à un palier ou de grimper sans fin
      jusqu'à l'absurde. Le tableau `bands` a été conçu dès le départ avec
      de la marge au-delà de la campagne (upto:2) : cette marge sert ici. */
  /** Progression au-delà des %t niveaux de la campagne : une fraction
      qui grimpe vite au début puis se rapproche d'un plafond sans jamais
      tout à fait l'atteindre — la difficulté continue de monter
      indéfiniment, mais de moins en moins vite, plutôt que de s'arrêter
      net à un palier ou de grimper sans fin jusqu'à l'absurde. Le
      tableau `bands` a été conçu dès le départ avec de la marge au-delà
      de la campagne (upto:2) : cette marge sert ici. `au` compte les
      niveaux depuis la fin de la campagne (niveau %t+1 => au=1). */
  configEndless(au){
    const p = 1.8 * (1 - Math.exp(-au / 14));
    const band = this.bands.find(b => p <= b.upto) || this.bands[this.bands.length - 1];
    /* Le plafond de pièces descend de 16 à 9. Mesuré sur une grille
       6x6 : à 16 pièces de 3 cases, plus de 300 arrangements remplissent
       le motif — n'importe lequel marche, le joueur ressent de la
       longueur, pas de la difficulté. À 8 pièces de 4,5 cases, il n'en
       reste que 2, et les cases sont même PLUS GRANDES à l'écran
       (36 px contre 29). Agrandir la grille donnait le même gain
       d'exigence mais faisait tomber la case à 15 px : injouable au
       doigt. C'est donc le nombre de morceaux qu'il fallait réduire,
       pas la grille qu'il fallait étendre. */
    const pieces = Math.max(3, Math.min(8, 3 + Math.round(p * 4)));
    return Object.assign({ band, pieces, p }, this.contraintes(p));
  },

  /* ---------------- Fabrication ----------------
     Cette étape ne connaît pas "niveau n" : elle prend une configuration
     de difficulté (band, pieces, p) et une source aléatoire déjà armée,
     et rend un puzzle. C'est le même cœur, que la configuration vienne
     des %t niveaux de la campagne ou de la suite au-delà. */
  craft(cfg, rand){
    const pick = arr => arr[Math.floor(rand() * arr.length)];

    /* 1 — silhouette. On essaie la famille tirée, puis les autres, puis le
       rectangle en dernier recours : la fabrication n'échoue jamais. */
    /* Plus on avance, plus on tire vers la grande grille de la bande :
       sans ce biais, un tirage malheureux creusait la courbe. */
    const grids = cfg.band.grids;
    const grille = rand() < .35 + cfg.p * .50 ? grids[grids.length - 1] : pick(grids);
    const cols0 = grille[0], rows0 = grille[1];
    const encoches = 2 + Math.floor(cfg.p * 4);   /* de 2 à 6 selon l'avancement */
    /* La cible occupe au moins 62 % de sa grille : sans cette borne, une
       croix ou un losange creusait un trou net dans la courbe. */
    const minCells = Math.max(6, cfg.pieces * 2, Math.ceil(cols0 * rows0 * .62));
    const essais = [pick(cfg.band.fams)].concat(cfg.band.fams, ["notched", "rect"]);
    let forme = null;
    for (let i = 0; i < essais.length; i++){
      const f = LevelManager.shapes[essais[i]];
      if (!f) continue;
      forme = LevelManager.finish(
        LevelManager.orient(f(cols0, rows0, rand, encoches), rand), minCells);
      if (forme) break;
    }
    if (!forme) forme = LevelManager.finish(LevelManager.shapes.rect(cols0, rows0), 1);

    const cols = forme.cols, rows = forme.rows;
    let target = forme.target;

    /* 2 — découpe de la cible en pièces connexes. */
    const remaining = new Set(target);
    const avg  = target.size / cfg.pieces;
    const minS = Math.max(1, Math.floor(avg * .65));
    /* Jamais plus d'un tiers de la cible dans une pièce : garantit ≥ 3 pièces. */
    const maxS = Math.max(minS + 1, Math.min(Math.ceil(avg * 1.45), Math.ceil(target.size / 3)));
    const groups = [];

    while (remaining.size){
      const left = Math.max(1, cfg.pieces - groups.length);
      let want = minS + Math.floor(rand() * (maxS - minS + 1));
      want = Math.max(1, Math.min(want, maxS, remaining.size - (left - 1) * minS, remaining.size));
      const start = pick([...remaining]);
      remaining.delete(start);
      const group = [start];
      while (group.length < want){
        const nb = new Set();
        group.forEach(k=>{
          const q = k.split(","), c = +q[0], r = +q[1];
          [[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>{
            const key = (c+d[0])+","+(r+d[1]);
            if (remaining.has(key)) nb.add(key);
          });
        });
        if (!nb.size) break;
        const next = pick([...nb]);
        remaining.delete(next); group.push(next);
      }
      groups.push(group);
    }

    /* 3 — équilibrage : miettes et pièces en trop rejoignent une voisine. */
    const adjacent = (a, b) => a.some(k1 => {
      const p1 = k1.split(","), c1 = +p1[0], r1 = +p1[1];
      return b.some(k2 => {
        const p2 = k2.split(","), c2 = +p2[0], r2 = +p2[1];
        return Math.abs(c1-c2) + Math.abs(r1-r2) === 1;
      });
    });
    let guard = 80;
    while (guard-- > 0 && groups.length > 1){
      let i = 0;
      for (let j = 1; j < groups.length; j++) if (groups[j].length < groups[i].length) i = j;
      const tooSmall = groups[i].length < minS;
      const tooMany  = groups.length > cfg.pieces;
      if (!tooSmall && !tooMany) break;
      if (groups.length <= 3 && !tooMany) break;   /* jamais moins de 3 pièces */
      let host = -1;
      for (let j = 0; j < groups.length; j++){
        if (j === i || !adjacent(groups[i], groups[j])) continue;
        if (host < 0 || groups[j].length < groups[host].length) host = j;
      }
      if (host < 0) break;
      if (!tooSmall && groups[i].length + groups[host].length > maxS + 3) break;
      groups[host] = groups[host].concat(groups[i]);
      groups.splice(i, 1);
    }

    /* 4 — des facettes triangulaires, à quelques frontières entre
       pièces : de plus en plus nombreuses à mesure qu'on avance, comme
       les encoches. Toujours après l'équilibrage — jamais avant, pour
       ne jamais perturber la répartition des tailles de pièces déjà
       calibrée sur les 150 niveaux. */
    let cellGroups = groups.map(g => g.map(k => {
      const q = k.split(","); return { c:+q[0], r:+q[1] };
    }));
    const facettes = LevelManager.facettesPour(cfg.p);
    for (let i = 0; i < facettes; i++) LevelManager.tryTriangleCut(cellGroups, rand);

    /* 5 — mise en forme des pièces + mémorisation de la solution. */
    const pieces = cellGroups.map((abs, i) => {
      const cells = PieceManager.normalize(abs);
      const solution = { c: Math.min(...abs.map(p=>p.c)), r: Math.min(...abs.map(p=>p.r)) };
      /* Rotation de départ imposée : le joueur doit orienter la pièce. */
      let base = cells, turns = Math.floor(rand() * 4);
      for (let t = 0; t < turns; t++) base = PieceManager.rotate(base);
      return {
        id: i, base: cells, cells: base, rot: turns,
        ci: i, color: COLORS[i % COLORS.length],
        placed: false, pos: null, solution
      };
    });

    /* 5 bis — PIÈCES FIGÉES. Elles ne pivotent pas : elles arrivent
       déjà dans l'orientation de la solution et le joueur doit les
       poser telles quelles. Elles retirent la résolution à l'aveugle
       « je tourne jusqu'à ce que ça rentre ». On n'en fige jamais
       toutes : il en reste toujours au moins deux à orienter. */
    if (cfg.figees > 0){
      const figeables = pieces.map(p=>p.id);
      const combien = Math.min(cfg.figees, Math.max(0, pieces.length - 2));
      for (let i = 0; i < combien; i++){
        const id = figeables.splice(Math.floor(rand() * figeables.length), 1)[0];
        const p = pieces[id];
        p.fige = true;
        p.cells = p.base;   // orientation de la solution, non modifiable
        p.rot = 0;
      }
    }


    /* La cible doit refléter les découpes triangulaires : une case
       coupée n'existe plus comme "c,r" entière, mais comme ses deux
       moitiés "c,r,TL"/"c,r,BR" (ou l'autre diagonale) — sans cette
       reconstruction, aucun triangle ne pourrait jamais se poser, la
       cible ne les reconnaîtrait pas. */
    target = new Set();
    cellGroups.forEach(g => g.forEach(c => target.add(PieceManager.keyOf(c))));

    /* L'aire réelle (une case entière compte pour 1, un triangle pour
       une demi) — jamais changée par une découpe, contrairement au
       nombre d'entrées dans `target`, qui grandit quand une case se
       scinde en deux. C'est cette aire, pas ce compte, qui doit nourrir
       le temps de référence : une case coupée en deux ne rend pas le
       niveau plus grand. */
    const aire = cellGroups.reduce((s, g) => s + g.reduce((s2, c) => s2 + (c.t ? 0.5 : 1), 0), 0);

    /* Le nombre de pièces domine largement la difficulté réelle (mesurée
       par le solveur : chaque pièce de plus est une décision combinatoire
       en soi), la surface de la cible pèse beaucoup moins. Poids choisis
       par recherche sur les 150 niveaux — corrélation avec la difficulté
       réelle : 0,85 contre 0,83 pour l'ancien dosage, à durée totale
       quasi inchangée. Convertir cette mesure en secondes exactes pour un
       joueur humain resterait approximatif sans de vraies données de jeu. */
    const parTime = Math.round(9 * pieces.length + 0.5 * aire);
    return { cols, rows, target, pieces, parTime };
  },

  /** Point d'entrée unique : niveau fixe et déterministe par son numéro,
      qu'il fasse partie des %t niveaux de la campagne ou de la suite
      générée au-delà — la campagne ne s'arrête jamais, elle continue
      avec le même moteur, juste une progression qui ne redémarre plus
      de zéro. Même n => toujours le même puzzle, sur tous les appareils,
      ce qui permet de reprendre une partie exactement là où elle en était. */
  /** Fabrique un candidat pour le niveau n. `variante` change le tirage
      sans changer la difficulté visée : c'est ce qui permet d'en
      essayer plusieurs et de garder le meilleur. Déterministe. */
  candidat(n, variante){
    const cfg = n <= LevelManager.TOTAL
      ? LevelManager.config(n)
      : LevelManager.configEndless(n - LevelManager.TOTAL + 10.35);
    const rand = LevelManager.rng(n * 7919 + 13 + variante * 104729);
    const lvl = LevelManager.craft(cfg, rand);
    lvl.n = n;
    lvl.tier = n <= LevelManager.TOTAL ? LevelManager.tierOf(n) : "t_hard";
    return lvl;
  },
  buildBrut(n){
    const cfg = n <= LevelManager.TOTAL
      ? LevelManager.config(n)
      /* +10.35 : sans ce décalage, la difficulté retombait presque à
         zéro juste après le niveau %t, alors que la campagne finissait
         sur ses niveaux les plus costauds. Ce chiffre place le tout
         premier niveau généré au-delà au même point de la courbe que
         celui juste avant lui — la progression continue, elle ne
         redémarre pas. */
      : LevelManager.configEndless(n - LevelManager.TOTAL + 10.35);
    const rand = LevelManager.rng(n * 7919 + 13);
    const lvl = LevelManager.craft(cfg, rand);
    lvl.n = n;
    lvl.tier = n <= LevelManager.TOTAL ? LevelManager.tierOf(n) : "t_hard";
    return lvl;
  },

  /** Choix du niveau réellement servi au joueur.

      Mesuré pendant l'audit : 81 des 150 niveaux de campagne
      acceptaient PLUSIEURS solutions — jusqu'à 6. Un puzzle où
      n'importe quel arrangement passe procure moins de satisfaction
      qu'un puzzle où il n'y a qu'une réponse : le joueur ne sait pas
      s'il a trouvé « la » solution ou juste « une » solution.

      On fabrique donc plusieurs candidats (le générateur coûte 1,3 ms)
      et on garde de préférence celui qui a une solution UNIQUE et qui
      demande le plus d'effort au solveur. Tout reste déterministe : le
      niveau 87 est le même puzzle sur tous les appareils.

      Repli garanti : si aucun candidat n'a de solution unique, on rend
      le premier — la fabrication n'échoue jamais. */
  /* TABLE DES MODES — trois lignes de 150 nombres, séparées par « | ».

     Chaque nombre est l'indice de la variante de tirage à utiliser pour
     ce niveau dans ce mode. Elle a été déterminée par une recherche
     faite HORS DU JEU : pour chaque niveau, une soixantaine de tirages
     ont été fabriqués et mesurés au solveur, et l'on a retenu, pour
     chaque mode, celui dont l'effort colle à sa cible — 30 %, 65 % et
     100 % de ce qui est réellement atteignable à ce niveau.

     Pourquoi une table plutôt qu'une recherche en direct : trouver un
     niveau vraiment exigeant coûte plusieurs secondes, ce qui aurait
     figé l'écran au lancement de chaque partie. La génération étant
     déterministe, il suffit de mémoriser QUEL tirage prendre : le jeu
     en fabrique alors un seul, en 1,3 ms.

     Résultat mesuré sur les 50 derniers niveaux de campagne, contre
     10 nœuds auparavant : mode 1 → 268, mode 2 → 765, mode 3 → 1077.

     Les trois modes se rejoignent sur la première moitié du parcours :
     tant que la grille est petite, le maximum atteignable est faible et
     il n'y a pas de marge pour les séparer. C'est voulu — tout le monde
     découvre le jeu de la même façon. */
  /* Mode courant, tenu ici plutôt que lu dans la sauvegarde : la
     fabrique de niveaux n'a pas à connaître le système de sauvegarde.
     SaveManager le pousse au chargement, UIManager à chaque
     changement. */
  modeCourant: 2,

  _variantes: null,
  varianteDe(n, mode){
    if (!this._variantes){
      this._variantes = this.TABLE_MODES.split("|").map(l => l.split(",").map(Number));
    }
    const ligne = this._variantes[(mode || 2) - 1] || this._variantes[1];
    return ligne[n - 1];
  },

  build(n){
    /* Campagne : la variante est déjà connue, aucun calcul. */
    if (n <= LevelManager.TOTAL){
      const v = LevelManager.varianteDe(n, LevelManager.modeCourant);
      return v === undefined ? LevelManager.buildBrut(n)
           : (v === 0 ? LevelManager.buildBrut(n) : LevelManager.candidat(n, v));
    }
    /* Au-delà de la campagne, les niveaux sont infinis : impossible de
       tout précalculer. On fait une recherche courte, avec un plafond
       d'exploration bas pour rester imperceptible, en visant le même
       esprit que le mode choisi. */
    const mode = LevelManager.modeCourant || 2;
    /* Nombre d'essais FIXE, et non un budget de temps.

       J'avais d'abord borné cette recherche dans le temps, pour qu'un
       téléphone lent reste aussi réactif qu'un rapide. C'était une
       erreur : le résultat dépendait alors de la charge de l'appareil,
       donc le même niveau pouvait donner deux puzzles différents. Or
       la génération doit rester déterministe — sans quoi il suffirait
       de recharger la page jusqu'à tomber sur un tirage plus facile.
       Un plafond d'exploration bas suffit à tenir le temps de calcul,
       sans jamais sacrifier la reproductibilité. */
    const ESSAIS = mode === 1 ? 3 : (mode === 2 ? 4 : 5);
    let meilleur = null, meilleurScore = -1, premier = null;
    for (let v = 0; v < ESSAIS; v++){
      const lv = v === 0 ? LevelManager.buildBrut(n) : LevelManager.candidat(n, v);
      if (v === 0) premier = lv;
      let a;
      try { a = Solver.analyze(lv, { maxNodes: 1800 }); } catch(e){ continue; }
      if (a.solutions !== 1) continue;
      const score = a.nodes || 0;
      if (score > meilleurScore){ meilleurScore = score; meilleur = lv; }
    }
    return meilleur || premier;
  }
};

/* ------------------------------------------------------------------
   Solver — mesure la difficulté réelle d'un niveau

   Recherche exacte avec heuristique MRV (Minimum Remaining Values) :
   à chaque étape, on choisit la pièce qui a le MOINS de placements
   valides restants, et on énumère cette liste. Le nombre de nœuds
   explorés avant d'avoir trouvé toutes les solutions (jusqu'à un
   plafond) est la meilleure mesure objective de la difficulté
   combinatoire d'un niveau — l'effort qu'un solveur parfait doit
   fournir, indépendant du nombre de cases ou de pièces, qui ne sont
   que des indicateurs grossiers.

   Le solveur classe les niveaux les uns par rapport aux autres de
   façon fiable. Il ne prétend PAS convertir cet effort en secondes
   pour un joueur humain : cette conversion précise demande de vraies
   données de jeu (télémétrie), qui n'existent pas encore.
   ------------------------------------------------------------------ */
/* ============================================================
   Solver — résolution et analyse de difficulté
   ------------------------------------------------------------
   Rôle    : vérifie qu'un niveau est résoluble et mesure sa
             difficulté réelle (nœuds explorés, ramifications).
   Expose  : analyze(level, options), placements(level).
   Dépend  : PieceManager.
   Piège   : utilisé À LA GÉNÉRATION, jamais pendant une partie —
             son coût n'a donc pas d'impact sur la fluidité du jeu.
   ============================================================ */
const Solver = {
  /** Tous les placements valides de chaque pièce dans la cible, toutes
      rotations distinctes confondues (une pièce symétrique n'en a que 1 ou 2). */
  placements(level){
    return level.pieces.map(piece=>{
      const rots = [], seen = new Set();
      let shape = piece.base;
      /* Une pièce figée n'a qu'une orientation possible : le solveur
         doit le savoir, sinon il mesurerait une difficulté qui ne
         correspond pas au jeu réel. */
      const nbRot = piece.fige ? 1 : 4;
      for (let r = 0; r < nbRot; r++){
        const key = JSON.stringify(shape);
        if (!seen.has(key)){ seen.add(key); rots.push(shape); }
        shape = PieceManager.rotate(shape);
      }
      const opts = [];
      rots.forEach(cells=>{
        const size = PieceManager.size(cells);
        for (let or = 0; or <= level.rows - size.h; or++){
          for (let oc = 0; oc <= level.cols - size.w; oc++){
            const keys = cells.map(c => PieceManager.keyOf(c.t ? {c:oc+c.c, r:or+c.r, t:c.t} : {c:oc+c.c, r:or+c.r}));
            if (keys.every(k => level.target.has(k))) opts.push({ keys });
          }
        }
      });
      return opts;
    });
  },

  /** Recherche complète, plafonnée en nœuds et en solutions. */
  analyze(level, opts){
    opts = opts || {};
    const nodeBudget   = opts.nodeBudget   || 60000;
    const solutionCap  = opts.solutionCap  || 40;
    const perPiece = Solver.placements(level);
    const occupied = new Set();
    let nodes = 0, solutions = 0, nodesCapped = false, firstBranch = -1;
    const clock = typeof performance !== "undefined" ? performance : Date;
    const t0 = clock.now();

    /* Précondition statique : si le total des cases des pièces ne
       correspond pas au nombre de cases de la cible, aucun arrangement
       ne peut jamais la couvrir exactement — inutile de chercher.
       Sur un niveau produit par LevelManager cette égalité tient
       toujours ; elle protège le solveur contre une entrée malformée. */
    const totalCells = level.pieces.reduce((a, p) => a + p.base.length, 0);
    if (totalCells !== level.target.size){
      return { nodes: 0, solutions: 0, nodesCapped: false, firstBranch: -1, ms: 0 };
    }

    function step(remaining){
      nodes++;
      if (nodes > nodeBudget){ nodesCapped = true; return true; }
      if (!remaining.length){
        if (occupied.size === level.target.size){ solutions++; return solutions >= solutionCap; }
        return false;
      }

      /* Placements encore valides pour chaque pièce restante. */
      const byPiece = remaining.map(pid =>
        perPiece[pid].filter(pl => pl.keys.every(k => !occupied.has(k))));

      /* Pour chaque case encore vide, combien de placements (toutes
         pièces confondues) peuvent encore la couvrir ? Une case à zéro
         est une IMPASSE IMMÉDIATE — même si chaque pièce, prise seule,
         semble encore avoir plein d'options. C'est cette détection qui
         manquait : sans elle, le solveur ne réalise l'impasse que bien
         plus tard, en butant pièce par pièce sur des cases invisibles. */
      const cover = new Map();
      byPiece.forEach(list => list.forEach(pl => pl.keys.forEach(k=>{
        if (!occupied.has(k)) cover.set(k, (cover.get(k) || 0) + 1);
      })));
      for (const k of level.target){
        if (!occupied.has(k) && !cover.has(k)) return false;
      }

      /* On branche sur la contrainte la plus serrée, case ou pièce,
         quel que soit son camp — c'est la vraie règle DLX, plus large
         qu'un MRV limité aux seules pièces. */
      let bestCount = Infinity, byCell = false, pieceIdx = -1, cellKey = null;
      remaining.forEach((pid, i) => {
        if (byPiece[i].length < bestCount){ bestCount = byPiece[i].length; pieceIdx = i; byCell = false; }
      });
      cover.forEach((c, k) => {
        if (c < bestCount){ bestCount = c; cellKey = k; byCell = true; }
      });
      if (firstBranch < 0) firstBranch = bestCount;
      if (!bestCount) return false;

      if (!byCell){
        const list = byPiece[pieceIdx];
        const rest = remaining.slice(0, pieceIdx).concat(remaining.slice(pieceIdx + 1));
        for (let i = 0; i < list.length; i++){
          list[i].keys.forEach(k => occupied.add(k));
          const stop = step(rest);
          list[i].keys.forEach(k => occupied.delete(k));
          if (stop) return true;
        }
        return false;
      }
      for (let i = 0; i < remaining.length; i++){
        const rest = remaining.slice(0, i).concat(remaining.slice(i + 1));
        for (const pl of byPiece[i]){
          if (!pl.keys.includes(cellKey)) continue;
          pl.keys.forEach(k => occupied.add(k));
          const stop = step(rest);
          pl.keys.forEach(k => occupied.delete(k));
          if (stop) return true;
        }
      }
      return false;
    }

    step(level.pieces.map(p => p.id));
    return { nodes, solutions, nodesCapped, firstBranch, ms: clock.now() - t0 };
  }
};

    this.tone(1400, .12, .09, "triangle");
    this.tone(2100, .10, .06, "sine");
    setTimeout(()=>{
      const ctx = this.ensure(); if (!ctx) return;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(640, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + .9);
      g.gain.setValueAtTime(0, ctx.currentTime);
      g.gain.linearRampToValueAtTime(.11, ctx.currentTime + .08);
      g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + 1.1);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 1.15);
      [1, 2].forEach(i => setTimeout(()=> this.tone(1760 + i*220, .18, .05, "sine"), 950 + i*90));
    }, 900);
  },
  /* Un bruit de fond, généré une seule fois puis bouclé — base commune
     de la pluie et du vent. Web Audio n'a pas de générateur de bruit
     natif : on remplit un tampon de valeurs aléatoires soi-même.
     `brun` filtre le blanc en un bruit plus grave et plus doux (chaque
     valeur dérive légèrement de la précédente plutôt que de sauter
     au hasard) — le blanc convient à la pluie, le brun au vent. */
  _bruitBuffer(ctx, brun){
    const duree = 2, n = Math.floor(ctx.sampleRate * duree);
    const buf = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = buf.getChannelData(0);
    let dernier = 0;
    for (let i = 0; i < n; i++){
      const blanc = Math.random() * 2 - 1;
      if (brun){ dernier = (dernier + 0.02 * blanc) / 1.02; d[i] = dernier * 3.5; }
      else d[i] = blanc;
    }
    return buf;
  },
  /** Trois ambiances au choix — demandé par Fabien : « je verrais bien
      des sons apaisants, des bruits de la nature ». Toutes synthétisées
      avec la même API Web Audio déjà utilisée pour chaque son du jeu —
      aucun fichier téléchargé, aucune dépendance ajoutée. Le fichier
      reste unique, exactement comme avant.

      `startMusic()`/`stopMusic()` restent les seuls points d'entrée,
      inchangés pour qui les appelle (resume(), suspend(), le bouton des
      réglages) : ils aiguillent simplement vers l'ambiance choisie. */
  /* Compteur de génération des ambiances. Il DOIT être initialisé ici.

     Signalé par Fabien : aucune musique au démarrage sous Chrome, mais
     un aller-retour sur le bouton Musique la déclenchait. La cause
     n'était pas la politique de lecture automatique du navigateur — le
     déblocage au premier appui fonctionnait — mais ce compteur laissé
     sans valeur de départ. `++undefined` vaut NaN, et NaN n'est égal à
     rien, pas même à lui-même : le test « la génération est-elle
     toujours la bonne ? » posé après le décodage échouait donc
     TOUJOURS, et l'ambiance s'annulait elle-même. Basculer le bouton
     appelait stopMusic(), qui donnait enfin une vraie valeur au
     compteur — d'où le déblocage apparent.

     Ne concernait que les ambiances à son réel (ruisseau, forêt), les
     seules à décoder de façon asynchrone. La mélodie, synthétisée,
     n'a jamais été touchée : c'est pourquoi le défaut est passé
     inaperçu jusqu'ici. */
  _genAmbiance: 0,
  startMusic(){
    if (this.musicTimer || this._ambianceActive || !SaveManager.data.music) return;
    const type = SaveManager.data.ambiance || "melodie";
    if (type === "aucune") return;   // silence choisi : rien à lancer
    if (type === "foret") this._startForet();
    else if (type === "vent") this._startVent();
    else if (type === "ruisseau") this._startRuisseau();
    else this._startMelodie();
  },
  /** Décode le ruisseau une seule fois puis garde le résultat en cache
      — décoder un MP3 a un coût, inutile de le refaire à chaque fois
      que le joueur bascule cette ambiance. */
  _decoderRuisseau(ctx){
    if (this._bufferRuisseau) return Promise.resolve(this._bufferRuisseau);
    if (this._decodageEnCours) return this._decodageEnCours;
    const bin = atob(SON_RUISSEAU_B64);
    const octets = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) octets[i] = bin.charCodeAt(i);
    this._decodageEnCours = ctx.decodeAudioData(octets.buffer.slice(0)).then(buf=>{
      this._bufferRuisseau = buf; this._decodageEnCours = null; return buf;
    }).catch(()=>{ this._decodageEnCours = null; return null; });
    return this._decodageEnCours;
  },
  _startRuisseau(){
    const ctx = this.ensure(); if (!ctx) return;
    this._ambianceActive = true;      // posé tout de suite : un second appel pendant le décodage ne doit pas relancer
    /* Le décodage est asynchrone — un arrêt/redémarrage rapide pendant
       ce délai (ex. suspend() suivi de resume() presque aussitôt)
       pourrait faire démarrer DEUX sources pour un seul stopMusic().
       Un compteur de génération, incrémenté à chaque arrêt, protège
       contre ça : si l'arrêt a eu lieu pendant le décodage, la
       génération capturée ici ne correspond plus à celle courante, et
       on abandonne plutôt que de démarrer une source orpheline. */
    const generation = ++this._genAmbiance;
    this._decoderRuisseau(ctx).then(buf=>{
      if (!buf || generation !== this._genAmbiance ||
          SaveManager.data.ambiance !== "ruisseau" || !SaveManager.data.music){
        return;
      }
      const src = ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      const g = ctx.createGain();
      /* Le fichier source est déjà à un niveau naturel et modéré
         (mesuré autour de -30 dB) — pas un signal plein cadran comme
         les oscillateurs synthétisés, qui eux ont besoin d'une forte
         atténuation. 0.6 le ramène à une présence de fond comparable
         aux autres ambiances, sans risquer d'écrêter les pointes. */
      g.gain.value = 0.6;
      src.connect(g); g.connect(ctx.destination);
      src.start();
      this._ambianceActive = true;
      this._ambianceNodes = [src];
    });
  },
  _startMelodie(){
    const scale = [261.6, 293.7, 329.6, 392.0, 440.0, 523.3];
    this.musicTimer = setInterval(()=>{
      if (!SaveManager.data.music) return;
      const ctx = this.ensure(); if (!ctx) return;
      const f = scale[(this.step * 3 + Math.floor(Math.random()*3)) % scale.length];
      const o = ctx.createOscillator(), g = ctx.createGain();
      /* La note était jouée une octave plus bas, en sinusoïde pure :
         130 à 262 Hz, sans aucune harmonique. Un haut-parleur de
         téléphone ne restitue presque rien sous 400 Hz, et une sinusoïde
         n'a rien d'autre que sa fondamentale pour se faire entendre —
         d'où une musique inaudible même à plein volume. Remontée d'une
         octave et jouée en triangle, elle garde le même caractère doux
         mais possède des harmoniques que le petit haut-parleur restitue.
         Le niveau passe de 0,035 à 0,075 : toujours en dessous des sons
         de jeu (0,07 à 0,12), donc une présence de fond, jamais une
         musique qui s'impose. */
      o.type = "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0, ctx.currentTime);
      g.gain.linearRampToValueAtTime(0.075, ctx.currentTime + 0.5);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 2.4);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 2.5);
      this.step++;
    }, 1900);
  },
  /** Décode la forêt une seule fois, même principe que le ruisseau. */
  _decoderForet(ctx){
    if (this._bufferForet) return Promise.resolve(this._bufferForet);
    if (this._decodageForetEnCours) return this._decodageForetEnCours;
    const bin = atob(SON_FORET_B64);
    const octets = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) octets[i] = bin.charCodeAt(i);
    this._decodageForetEnCours = ctx.decodeAudioData(octets.buffer.slice(0)).then(buf=>{
      this._bufferForet = buf; this._decodageForetEnCours = null; return buf;
    }).catch(()=>{ this._decodageForetEnCours = null; return null; });
    return this._decodageForetEnCours;
  },
  /** Forêt : mixage de deux sons réels (LaSonothèque.fr, CC0) — la
      forêt (oiseaux, vent) par-dessus le ruisseau, comme demandé par
      Fabien pour remplacer la pluie synthétisée. Remplace _startPluie().

      Les deux boucles ont des durées différentes (18 s pour le
      ruisseau, 20 s pour la forêt) et jouent indépendamment l'une de
      l'autre — volontairement laissé ainsi plutôt qu'aligné : deux
      boucles de longueurs premières entre elles ne retombent en phase
      qu'au bout de leur PPCM (ici 180 s), ce qui évite la sensation
      d'un motif qui se répète à l'identique toutes les 18-20 secondes.

      La forêt est en retrait (0.42) par rapport au ruisseau (0.6) :
      les oiseaux, par leurs fréquences plus hautes et leur caractère
      transitoire, restent audibles même moins forts — l'eau forme le
      lit sonore, les oiseaux l'habillent, pas l'inverse. */
  _startForet(){
    const ctx = this.ensure(); if (!ctx) return;
    this._ambianceActive = true;
    const generation = ++this._genAmbiance;
    Promise.all([this._decoderRuisseau(ctx), this._decoderForet(ctx)]).then(([bufRuisseau, bufForet])=>{
      if (generation !== this._genAmbiance || SaveManager.data.ambiance !== "foret" || !SaveManager.data.music){
        return;
      }
      const noeuds = [];
      if (bufRuisseau){
        const src = ctx.createBufferSource();
        src.buffer = bufRuisseau; src.loop = true;
        const g = ctx.createGain(); g.gain.value = 0.6;
        src.connect(g); g.connect(ctx.destination);
        src.start();
        noeuds.push(src);
      }
      if (bufForet){
        const src2 = ctx.createBufferSource();
        src2.buffer = bufForet; src2.loop = true;
        const g2 = ctx.createGain(); g2.gain.value = 0.42;
        src2.connect(g2); g2.connect(ctx.destination);
        src2.start();
        noeuds.push(src2);
      }
      this._ambianceNodes = noeuds;
    });
  },
  /** Vent : du bruit brun (plus grave, plus doux que le blanc) filtré
      passe-bas, dont la fréquence de coupure est modulée très lentement
      par un oscillateur (LFO) — c'est ce mouvement lent qui donne
      l'impression de rafales plutôt qu'un souffle figé. */
  _startVent(){
    const ctx = this.ensure(); if (!ctx) return;
    const src = ctx.createBufferSource();
    src.buffer = this._bruitBuffer(ctx, true); src.loop = true;
    const filtre = ctx.createBiquadFilter(); filtre.type = "lowpass"; filtre.frequency.value = 500;
    const g = ctx.createGain(); g.gain.value = 0.06;
    src.connect(filtre); filtre.connect(g); g.connect(ctx.destination);
    const lfo = ctx.createOscillator(); lfo.type = "sine"; lfo.frequency.value = 0.07;
    const lfoGain = ctx.createGain(); lfoGain.gain.value = 340;
    lfo.connect(lfoGain); lfoGain.connect(filtre.frequency);
    src.start(); lfo.start();
    this._ambianceNodes = [src, lfo];
    this._ambianceActive = true;
  },
  stopMusic(){
    clearInterval(this.musicTimer); this.musicTimer = null;
    this._genAmbiance = (this._genAmbiance || 0) + 1;
    (this._ambianceNodes || []).forEach(n=>{ try{ n.stop(); }catch(e){} });
    this._ambianceNodes = [];
    this._ambianceActive = false;
  },

  /* Rien, jusqu'ici, n'arrêtait le son quand le téléphone quittait
     l'application : la musique continuait indéfiniment en arrière-plan.
     suspend() coupe immédiatement toute sortie audio, y compris la
     fin d'une note déjà lancée — pas seulement les prochaines. */
  suspend(){
    this.stopMusic();
    if (this.ctx && this.ctx.state === "running") this.ctx.suspend();
  },
  /* Au retour, on ne relance que ce que les réglages du joueur autorisent
     encore : si la musique a été coupée pendant l'absence, elle le reste. */
  resume(){
    if (document.hidden) return;
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
    if (SaveManager.data.music) this.startMusic();
  }
};
function buzz(ms){ if (SaveManager.data.vibrate && navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} }

/* ============================================================
   MonetizationManager — publicité et achat
   ------------------------------------------------------------
   Rôle    : interstitiels, indice récompensé, mur du niveau 150,
             achat unique de déblocage, consentement publicitaire.
   Expose  : sansPub(), refreshBanner(), demarrer(), maybeInterstitial(),
             rewardedHint(), acheter(), restaurer(), showWall(), prefsPub().
   Dépend  : SaveManager, UIManager, et les plugins Capacitor AdMob et
             NativePurchases (absents dans un simple navigateur).
   BRANCHEMENT RÉEL (30 sept. 2026). Avant, tout était simulé. Deux
   plugins, vérifiés à la source avant d'écrire une ligne :
     - @capacitor-community/admob (v8)  : publicités + consentement UMP
     - @capgo/native-purchases (8.8.1)  : achat unique, Play Billing 9
   Le jeu est UN SEUL fichier HTML sans bundler : les plugins ne sont
   pas importés, on les atteint par window.Capacitor.Plugins, là où le
   pont natif les enregistre.
   Règles tenues partout ci-dessous :
     1. Rien de factice n'est jamais montré. Sans plugin (navigateur),
        pas de pub, pas de bouton d'achat : le jeu reste jouable.
     2. On ne débloque QUE sur un achat confirmé ou retrouvé chez Google,
        jamais sur un simple clic. On ne RETIRE jamais un déblocage
        automatiquement (hors ligne, une requête vide ne prouve rien).
     3. Une publicité ne bloque jamais le jeu : chaque attente a un
        plafond, chaque échec dit sa raison.
   ============================================================ */

  plugin(noms){
    const cap = (typeof window !== "undefined") ? window.Capacitor : null;
    const pl = cap && cap.Plugins;
    if (!pl) return null;
    for (const n of noms) if (pl[n]) return pl[n];
    return null;

  pub(){   return this.plugin(["AdMob"]); },
  achat(){ return this.plugin(["NativePurchases", "CapgoNativePurchases"]); },

const MonetizationManager = {
  INTERSTITIAL_EVERY: 3,      // une pub toutes les 3 victoires...

  FIRST_AD_LEVEL: 10,         // aucune coupure pendant la découverte du jeu

  DELAI_SECURITE_MS: 90000,   // plafond absolu : une pub ne bloque jamais le jeu

  etat: {},                   // pour le diagnostic visible
  pubInit: false, interPret: false, recoPret: false,
  interPromesse: null, recoPromesse: null, achatEnCours: false,

  /** Un joueur qui a payé ne doit plus voir de publicité : l'achat
      unique débloque la suite après le niveau 150 ET retire toute la
      publicité. Proposer un retrait de pub séparé, moins cher, aurait
      fait concurrence à cet achat sans raison de payer le plus gros. */
  sansPub(){ return SaveManager.data.allUnlocked; },

  note(cle, valeur){ this.etat[cle] = valeur; this.majDiag(); },

  /** Diagnostic visible, qui disparaît tout seul quand tout va bien :
      en version publiée et tout branché, la ligne reste vide. Sinon elle
      dit CE QUI MANQUE, pour ne pas le chercher derrière un bouton. */
  majDiag(){
    const el = document.getElementById("diag-monet");
    if (!el) return;
    const pb = [];
    if (!Natif.pub()) pb.push("kit pub absent");
    else if (this.etat.consent === false) pb.push("consentement non obtenu (message RGPD AdMob ?)");
    if (!Natif.achat()) pb.push("achat absent");
    /* 2 oct. : le module App de Capacitor n'avait JAMAIS été installé. Sans lui,
       ni le bouton retour Android ni la pause d'arrière-plan ne sont branchés,
       et le code les sautait EN SILENCE (« tout est branché » s'affichait). */
    if (window.Capacitor && !(window.Capacitor.Plugins && window.Capacitor.Plugins.App)) pb.push("module retour Android absent");
    if (this.etat.erreur) pb.push(this.etat.erreur);
    /* Version publiée : AUCUNE ligne technique devant les joueurs, même en
       cas de souci (c'est une note de développeur, pas une information pour
       eux). Le diagnostic reste complet dans la version de test. */
    if (!PUB_TEST){ el.textContent = ""; el.style.display = "none"; return; }
    let texte = (PUB_TEST || pb.length)
      ? "Pub " + (PUB_TEST ? "TEST" : "réelle") + " · " + (pb.length ? pb.join(" · ") : "tout est branché")
      : "";
    /* Version de TEST seulement : la dernière décision d'annonce entre
       niveaux, pour savoir pourquoi elle s'est (ou non) affichée. */
    if (PUB_TEST && this.etat.inter) texte += " · Entre niveaux : " + this.etat.inter;
