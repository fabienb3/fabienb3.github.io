         abandonne sans rien lancer, plutôt que de le propulser dans un
         niveau qu'il n'a plus demandé. */
      if (!document.getElementById("s-sky").classList.contains("on")){
        this.transition = false;
        this.layout();
        return;
      }
      const k = Math.min(1, (now - t0) / DUREE);
      const e = k * k * (3 - 2 * k);                    // départ et arrivée adoucis
      this.view.scale = depart.scale + (cible - depart.scale) * e;
      /* L'étoile visée reste plantée au centre pendant toute la
         plongée : c'est ce qui donne l'impression d'aller VERS elle,
         et non de zoomer au hasard puis de changer d'écran. */
      this.view.ox = this.W/2 - p.x * this.view.scale;
      this.view.oy = this.H/2 - p.y * this.view.scale;
      this.draw(now);
      /* Voile qui blanchit sur la fin, pour masquer la coupure. */
      /* Le voile n'entre qu'en toute fin (78 %) : sur une descente
         longue, blanchir tôt masquerait justement ce qu'on a ralenti
         pour donner à voir. */
      if (e > .78){
        const voile = (e - .78) / .22;
        this.ctx.save();
        this.ctx.globalAlpha = voile * voile;
        this.ctx.fillStyle = p.color || "#EAFFF7";
        this.ctx.fillRect(0, 0, this.W, this.H);
        this.ctx.restore();
      }
      if (k < 1){ requestAnimationFrame(pas); return; }
      this.transition = false;
      GameManager.cameFrom = "s-sky";
      GameManager.start(niveau);
    };
    requestAnimationFrame(pas);
  },

  tapAt(x, y){
    let hit = null, best = 30;
    this.points.forEach(p=>{
      const sp = this.toScreen(p);
      const d = Math.hypot(sp.x - x, sp.y - y);
      if (d < best){ best = d; hit = p; }
    });
    if (!hit || !hit.lit){ this.selected = null; this.draw(performance.now()); return; }
    if (this.selected === hit){ this.plongerVers(hit); return; }
    this.selected = hit;
    this.draw(performance.now());
  },

  show(){
    this.selected = null;
    this.pointers.clear(); this.pinch = null; this.downInfo = null;
    /* La position de vue est recalculée par layout(), plus bas — centrée
       sur la dernière étoile obtenue, pas remise à zéro ici. */
    const lit = this.litCount();
    const complet = this.estComplet();
    /* Le téléchargement est lié à l'ACHAT du jeu, pas à la complétude
       du Ciel. Première idée : le réserver au ciel complet — mais la
       complétude arrive au niveau 900, donc quasiment personne ne
       l'aurait jamais vu. Idée de Fabien, meilleure : en faire une
       contrepartie de l'achat, quelque chose que l'acheteur emporte
       et imprime. Il exporte le ciel dans son état RÉEL du moment :
       un ciel partiel reste le sien, et une belle affiche. */
    const bSave = document.getElementById("sky-save-row");
    /* Avant : masquee pour qui n'avait pas achete -- aucune decouverte
       possible, aucune raison d'acheter POUR CETTE RAISON precise.
       Decision de Fabien (26 sept.) : visible des la premiere etoile,
       achete ou non ; grisee sinon, et le clic explique pourquoi. */
    if (bSave){
      bSave.style.display = lit > 0 ? "flex" : "none";
      bSave.classList.toggle("locked", !SaveManager.data.allUnlocked);
    }
    document.getElementById("sky-count").textContent = complet ? T("sky_complete")
      : lit ? T("sky_count").replace("%s", lit) : "";
    const hint = document.getElementById("sky-hint");
    /* Signalé par Fabien : « la phrase en bas ne veut rien dire ici ».
       Le Ciel piochait dans les phrases d'ambiance écrites pour l'écran
       de jeu (« Un puzzle résolu ne demande rien de plus »), sans aucun
       rapport avec l'exploration d'un ciel. Remplacé par une vraie
       aide, propre à cet écran : ce que le joueur peut y faire. */
    hint.textContent = T("sky_hint");
    UIManager.show("s-sky");
    this.layout();
    this.t0 = performance.now();
    if (!lit){
      UIManager.message(T("sky_empty"));
      return;
    }
    this.celebrerConstellationsCompletes();
    const frame = now => {
      this.draw(now);
      if (now - this.t0 < 1600 && document.getElementById("s-sky").classList.contains("on"))
        requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
};

/* ------------------------------------------------------------------
   Aperçu animé de l'accueil — l'élément signature.

   Signalé par Fabien : l'image montrait des rectangles à coins
   arrondis uniformes (rr(...,9)) — l'ancien système, abandonné depuis
   la reconstruction du moteur de géométrie pour des coins vifs. Et
   aucune trace de triangle, alors que Branoxy en est un depuis le
   début. Reconstruit avec les VRAIES fonctions du moteur
   (Renderer.outline, Renderer.roundedLoop) plutôt qu'une imitation.

   Deuxième correction : les trois seuls endroits où une pièce se
   dessine dans le jeu passent tous sharp:true — vifs PARTOUT. Ma
   première version gardait un arrondi de 9 sur le contour extérieur,
   jamais vérifié dans le code avant d'être appliqué ici.

   Troisième correction : Renderer.piece() elle-même dessine le trait
   de contour et le dégradé — appelée directement plutôt qu'imitée,
   pour un rendu identique au vrai plateau, pixel pour pixel.

   Quatrième évolution, demandée par Fabien : un assemblage plus
   complexe, l'effet d'un niveau difficile. Plutôt qu'inventer une
   composition à la main — avec le risque déjà rencontré d'une pièce
   en anneau qui ne pave pas correctement —, on utilise le VRAI niveau
   150, le dernier de la campagne : dix pièces, six d'entre elles avec
   des triangles, un pavage exact sans trou ni chevauchement puisque
   c'est le générateur du jeu lui-même qui l'a produit et validé.
   L'accueil montre donc la vraie complexité d'un niveau difficile —
   pas une promesse plus belle que la réalité.
   ------------------------------------------------------------------ */
function heroAnim(){
  const cv = document.getElementById("hero"), ctx = cv.getContext("2d");
  const CYCLE = 6670, TRANSIT = 640, EXIT = 820, HOLD = 5600;

  const L = LevelManager.build(150);
  const N = L.cols;                            // 7 : la grille est carrée
  const CELL = 160 / N, OX = (200 - CELL * N) / 2, OY = OX;
  const centreGrille = N / 2;

  /* Le cadre du puzzle, visible dès le départ — signalé par Fabien :
     sans lui, l'assemblage démarre sur fond noir et rien n'indique la
     forme visée pendant les premières secondes, le temps que les
     premières pièces arrivent. Calculé sur la VRAIE cible complète
     (toutes les cases de toutes les pièces réunies), via
     Renderer.outline() — pas un carré supposé : si un futur niveau
     réutilisé ici avait des encoches, le cadre suivrait sa vraie
     silhouette plutôt que de mentir sur sa forme.

     Signalé par Fabien avec une capture du vrai plateau : la vraie
     zone cible vide n'est pas un simple contour en pointillés — fond
     #1E2E3D, coins arrondis (le même rayon que Renderer.draw()),
     quadrillage intérieur case par case, lueur ambiante bleutée. Repris
     ici à l'identique plutôt qu'un style inventé qui aurait encore
     différé du vrai jeu. */
  const celluleCible = L.pieces.flatMap(p => p.base.map(c =>
    ({ c: p.solution.c + c.c, r: p.solution.r + c.r, t: c.t })));
  const cadre = Renderer.outline(celluleCible);
  const R_CADRE = Math.min(CELL * 0.24, 10);
  const cheminCadre = new Path2D();
  cadre.forEach(loop=>{
    const pts = loop.map(v => [OX + v[0]*CELL, OY + v[1]*CELL]);
    Renderer.roundedLoop(cheminCadre, pts, R_CADRE, null);
  });
  /* Quadrillage : la vraie logique du plateau (Renderer.draw(), la
     fonction "touche"), pas une approximation.

     Signalé par Fabien : ma première version ignorait TOUTE case
     touchée par un triangle (if (c.t) return), alors que six des dix
     pièces du niveau 150 en contiennent — le quadrillage s'arrêtait
     net à leurs frontières, fusionnant plusieurs cases en une seule
     forme visuelle au lieu du quadrillage régulier du vrai plateau.
     PieceManager.edgesOf() sait exactement quelles arêtes une demi-case
     triangulaire possède réellement (un triangle TL n'a que N et W,
     par exemple) — en la réutilisant, une arête ne se trace que si les
     DEUX cases de part et d'autre la possèdent vraiment, triangle ou
     pas. */
  const toucheBord = (q, d) => PieceManager.edgesOf(q).includes(d);
  const cheminGrille = new Path2D();
  celluleCible.forEach(q=>{
    const x = OX + q.c*CELL, y = OY + q.r*CELL;
    if (toucheBord(q, "E") && celluleCible.some(z => z.c===q.c+1 && z.r===q.r && toucheBord(z, "W"))){
      cheminGrille.moveTo(x+CELL, y); cheminGrille.lineTo(x+CELL, y+CELL);
    }
    if (toucheBord(q, "S") && celluleCible.some(z => z.c===q.c && z.r===q.r+1 && toucheBord(z, "N"))){
      cheminGrille.moveTo(x, y+CELL); cheminGrille.lineTo(x+CELL, y+CELL);
    }
  });

  const parts = L.pieces.map(p=>{
    /* p.base, pas p.cells : p.cells est la pièce dans son orientation
       de DÉPART, tournée au hasard pour que le joueur doive la remettre
       en place — p.base est sa vraie forme résolue. Combiner p.cells
       avec p.solution produisait une géométrie incohérente (7×8 au lieu
       de 7×7 pour le niveau 150), débordant largement du cadre carré —
       vérifié : le vrai plateau de jeu, qui utilise p.base au bon
       endroit, n'a jamais été concerné par ce défaut. */
    const cs = p.base.map(c=>c.c), rs = p.base.map(c=>c.r);
    const cx = p.solution.c + (Math.min(...cs) + Math.max(...cs) + 1) / 2;
    const cy = p.solution.r + (Math.min(...rs) + Math.max(...rs) + 1) / 2;
    const dx = cx - centreGrille, dy = cy - centreGrille;
    const dist = Math.hypot(dx, dy) || 1;
    const echelle = 230 / dist;
    return {
      cells: p.base.map(c => ({ c: p.solution.c + c.c, r: p.solution.r + c.r, t: c.t })),
      c: p.color, fx: dx * echelle, fy: dy * echelle, dist,
    };
  });
  /* Entrée du bord vers le centre : les pièces les plus excentrées
     arrivent d'abord, les plus proches du cœur de la grille ferment
     la marche — une convergence qui se lit, pas un ordre arbitraire.
     Signalé par Fabien avec une capture prise pile pendant cette
     fenêtre : le cadre s'affichait seul près de 16 % du cycle (le
     délai avant la première pièce, puis la pause après la sortie de
     la dernière). Resserré à environ 6 % — un temps de pause bref
     reste voulu, mais jamais assez long pour qu'une capture prise au
     hasard tombe dessus aussi facilement. */
  [...parts].sort((a, b) => b.dist - a.dist).forEach((p, i) => p.at = 150 + i * 260);

  let rings = [], cycle = -1, size = 0;

  /* Bords fondus — vu sur capture de Fabien (25 sept.) : les pièces
     arrivent de l'extérieur du canevas et apparaissaient coupées net
     par une ligne droite invisible, en plein milieu de l'écran ; le
     halo formait aussi un carré discernable. Un fondu de 16 unités sur
     200, appliqué en dernier sur les quatre bords : le puzzle assemblé
     (20 à 180) n'est jamais touché, seuls les bords s'effacent. */
  const FONDU = 16;
  const fondus = [[0,0,FONDU,0, 0,0,FONDU,200], [200,0,200-FONDU,0, 200-FONDU,0,FONDU,200],
                  [0,0,0,FONDU, 0,0,200,FONDU], [0,200,0,200-FONDU, 0,200-FONDU,200,FONDU]]
    .map(([x0,y0,x1,y1, rx,ry,rw,rh])=>{
      const g = ctx.createLinearGradient(x0, y0, x1, y1);
      g.addColorStop(0, "rgba(0,0,0,1)"); g.addColorStop(1, "rgba(0,0,0,0)");
      return { g, r:[rx,ry,rw,rh] };
    });

  function fit(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const w = cv.clientWidth || 240;
    if (Math.abs(w - size) < 1) return;
    size = w; cv.width = w * dpr; cv.height = w * dpr;
    ctx.setTransform(dpr * w / 200, 0, 0, dpr * w / 200, 0, 0);
  }

  function frame(now){
    requestAnimationFrame(frame);
    if (!document.getElementById("s-home").classList.contains("on")) return;
    fit();
    const t = now % CYCLE, turn = Math.floor(now / CYCLE);
    if (turn !== cycle){ cycle = turn; rings = []; }
    ctx.clearRect(0, 0, 200, 200);

    /* Le cadre, toujours visible — dessiné en tout premier, derrière la
       lumière et les pièces. Même traitement que la vraie zone cible
       vide de Renderer.draw() : fond plein, lueur ambiante bleutée,
       quadrillage intérieur — pas un simple contour inventé. */
    ctx.fillStyle = "#1E2E3D";
    ctx.fill(cheminCadre);
    ctx.save();
    ctx.clip(cheminCadre);
    ctx.globalCompositeOperation = "lighter";
    Renderer.blob(ctx, OX + N*CELL/2, OY + N*CELL/2, N*CELL*.68, "#6FA8C4", .40);
    ctx.restore();
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,.08)";
    ctx.lineWidth = 1;
    ctx.stroke(cheminGrille);
    ctx.restore();

    const live = parts.map(p=>{
      let k = 1, a = 1;
      const centre = { x: OX + CELL * (Math.max(...p.cells.map(c=>c.c)) + Math.min(...p.cells.map(c=>c.c)) + 1) / 2,
                        y: OY + CELL * (Math.max(...p.cells.map(c=>c.r)) + Math.min(...p.cells.map(c=>c.r)) + 1) / 2 };
      if (t < p.at) { k = 0; a = 0; }
      else if (t < p.at + TRANSIT){
        const u = (t - p.at) / TRANSIT;
        k = 1 - Math.pow(1 - u, 3); a = Math.min(1, u * 2.4);
      } else if (t > HOLD){
        const u = Math.min(1, (t - HOLD) / EXIT);
        k = 1 - u * u; a = 1 - u * u;
        if (u >= 1) a = 0;
      } else if (!p.done){
        p.done = true;
        rings.push({ t: now, x: centre.x, y: centre.y, c: p.c });
      }
      if (t < p.at) p.done = false;
      return { p, a, ox: p.fx * (1 - k), oy: p.fy * (1 - k) };
    });

    /* Couche lumineuse. */
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    live.forEach(l=>{
      if (l.a <= 0) return;
      const xs = l.p.cells.map(c=>c.c), ys = l.p.cells.map(c=>c.r);
      const w = (Math.max(...xs) - Math.min(...xs) + 1) * CELL, h = (Math.max(...ys) - Math.min(...ys) + 1) * CELL;
      const mx = OX + (Math.max(...xs)+Math.min(...xs)+1)/2*CELL + l.ox, my = OY + (Math.max(...ys)+Math.min(...ys)+1)/2*CELL + l.oy;
      Renderer.blob(ctx, mx, my, Math.max(w, h) * .8, l.p.c, .32 * l.a);
    });
    rings = rings.filter(r => now - r.t < 900);
    rings.forEach(r=>{
      const u = (now - r.t) / 900, e = 1 - Math.pow(1 - u, 2.4);
      Renderer.ring(ctx, r.x, r.y, 150 * e, 13, r.c, .55 * (1 - u) * (1 - u));
    });
    ctx.restore();

    /* Les pièces par-dessus — en appelant littéralement Renderer.piece(),
       la fonction qui dessine une vraie pièce en jeu, pas une imitation.
       Elle lit son contexte de dessin via this.ctx : le temps de
       l'appel, on le fait pointer vers le canevas du hero, puis on le
       restaure. */
    live.forEach(l=>{
      if (l.a <= 0) return;
      const p = l.p, ox = l.ox, oy = l.oy;
      const xs = p.cells.map(c=>c.c), ys = p.cells.map(c=>c.r);
      const x0 = OX + Math.min(...xs)*CELL + ox, y0 = OY + Math.min(...ys)*CELL + oy;
      const cellsLocales = p.cells.map(c => ({ c: c.c - Math.min(...xs), r: c.r - Math.min(...ys), t: c.t }));
      const vraiCtx = Renderer.ctx;
      Renderer.ctx = ctx;
      Renderer.piece(cellsLocales, x0, y0, CELL, p.c, { sharp:true, lift:true, alpha:l.a });
      Renderer.ctx = vraiCtx;
    });

    ctx.save();
    ctx.globalCompositeOperation = "destination-out";
    fondus.forEach(f=>{ ctx.fillStyle = f.g; ctx.fillRect(...f.r); });
    ctx.restore();
  }
  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------------
   Boucle principale : chronomètre + rendu
   ------------------------------------------------------------------ */
let lastSec = -1, lastFrame = 0;
function loop(now){
  /* Filet de sécurité INDÉPENDANT des événements du système : quand l'appli
     est en arrière-plan, plus aucune image n'est dessinée ; au retour, la
     première image arrive avec un écart énorme. Constaté le 1er oct. : le
     chronomètre avait continué à courir pendant l'absence — visibilitychange
     ne s'était pas déclenché dans la WebView. Un trou de plus de 3 s met le
     jeu en pause en EXCLUANT l'absence : le joueur reprend à la seconde où
     il était parti, et c'est lui qui relance. */
  if (lastFrame && now - lastFrame > 3000 && GameManager.running && !GameManager.paused && !GameManager.gele && GameManager.level){
    GameManager.pause();
    GameManager.pausedAt = lastFrame;
  }
  lastFrame = now;
  if (GameManager.running && !GameManager.paused && !GameManager.gele && GameManager.level){
    GameManager.elapsed = now - GameManager.t0;
    const s = Math.floor(GameManager.elapsed / 1000);
    if (s !== lastSec){
      lastSec = s;
      document.getElementById("g-time").textContent = fmt(s);
      UIManager.majLigneJeu();          // le palier de diamants suit le temps réel
    }
    /* Annuler s'atténue quand il n'y a rien à annuler : son état se lit
       avant d'appuyer, au lieu de ne se découvrir qu'après un appui sans
       effet. Il reste cliquable — un appui explique alors pourquoi. */
    const rien = GameManager.history.length === 0;
    if (rien !== GameManager.undoEmpty){
      GameManager.undoEmpty = rien;
      document.getElementById("b-undo").classList.toggle("off", rien);
    }
  }
  /* Joueur bloqué depuis 45 s : le bouton Indice s'allume doucement.
     C'est le moment où la publicité récompensée convertit le mieux, et
     l'appel reste discret — aucune fenêtre ne s'impose au joueur. */
  if (GameManager.running && !GameManager.paused && !GameManager.gele && GameManager.level){
    const bloque = now - GameManager.lastProgress > 45000
                && GameManager.level.pieces.some(p => !p.placed);
    if (bloque !== GameManager.nudging){
      GameManager.nudging = bloque;
      document.getElementById("b-hint").classList.toggle("nudge", bloque);
    }
  }

  /* Hors de l'ecran de jeu, rien a redessiner : batterie preservee. */
  if (document.getElementById("s-game").classList.contains("on")) Renderer.draw();
  requestAnimationFrame(loop);
}

/* ------------------------------------------------------------------
   Démarrage
   ------------------------------------------------------------------ */
(async function boot(){
  await SaveManager.load();
  I18N.apply();
  Renderer.init();
  InputManager.init();
  SkyManager.init();
  UIManager.syncSwitches(); UIManager.syncTheme(); UIManager.syncAmbiance(); UIManager.syncMode(); UIManager.syncMoteur();
  UIManager.buildLevels();
  UIManager.syncPlayProgress();
  MonetizationManager.demarrer();
  MonetizationManager.lastAd = performance.now();   /* 2 min de répit au lancement */
  heroAnim();

  /* Téléphone verrouillé, appli mise en arrière-plan, onglet quitté :
     dans tous ces cas le son doit s'arrêter net, pas continuer à jouer
     sans que le joueur puisse plus l'entendre venir de nulle part. */
  document.addEventListener("visibilitychange", ()=>{
    if (document.hidden){ Audio_.suspend(); UIManager.cancelAutoNext(); }
    else Audio_.resume();
  });
  window.addEventListener("pagehide", ()=> Audio_.suspend());

  /* Retour d'arrière-plan : sur certains Android, la WebView revient
     BLANCHE (le fond natif, pas le fond sombre du jeu) jusqu'au premier
     toucher. Constaté sur l'écran Paramètres, 1er oct. On force un
     repeint à chaque retour : une transformation posée puis retirée
     oblige le moteur à redessiner toute la couche. Inoffensif ailleurs. */
  const repeindre = ()=>{
    const app = document.getElementById("app");
    if (!app) return;
    app.style.transform = "translateZ(0)";
    requestAnimationFrame(()=> requestAnimationFrame(()=>{
      app.style.transform = "";
      if (document.getElementById("s-game").classList.contains("on")) Renderer.layout();
    }));
  };
  document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) repeindre(); });
  window.addEventListener("pageshow", repeindre);
  window.addEventListener("focus", repeindre);
  if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App){
    window.Capacitor.Plugins.App.addListener("appStateChange", st=>{
      if (!st) return;
      if (st.isActive) repeindre(); else GameManager.pause();
    });
  }

  /* Bouton retour Android : n'existe pas dans un onglet de navigateur
     (Chrome gère "retour" tout seul). Dans une application empaquetée,
     sans ceci, ce bouton fermerait l'appli d'un coup au lieu de revenir
     à l'écran précédent du jeu. Ne se branche que si Capacitor est
     réellement présent — inoffensif et silencieux partout ailleurs. */
  if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App){
    window.Capacitor.Plugins.App.addListener("backButton", androidBack);
  }

  const on = (id, fn) => document.getElementById(id).addEventListener("click", fn);
  /* Les interrupteurs sont des <div> porteurs de role="switch" : sans
     ceci, ils seraient atteignables au clavier mais impossibles à
     actionner autrement qu'au doigt. Espace et Entrée les basculent,
     comme n'importe quelle case à cocher. */
  document.querySelectorAll('.switch[role="switch"]').forEach(sw=>{
    sw.addEventListener("keydown", e=>{
      if (e.key === " " || e.key === "Enter"){ e.preventDefault(); sw.click(); }
    });
  });
  const startAudio = ()=>{ Audio_.ensure(); Audio_.startMusic(); };
  document.addEventListener("pointerdown", startAudio, { once:true });

  document.querySelectorAll(".nav-home").forEach(b => b.onclick = ()=>{ UIManager.syncPlayProgress(); UIManager.show("s-home"); });
  document.querySelectorAll(".nav-levels").forEach(b => b.onclick = ()=>{
    /* Quitter un niveau EN COURS (pas déjà gagné) mérite une confirmation
       visible : rien n'était perdu techniquement — chaque niveau gagné
       est déjà enregistré au moment même de la victoire — mais partir
       sans le moindre signe ne rassure personne. */
    if (GameManager.running){
      SaveManager.save();
      UIManager.toast(T("quit_saved"));
      GameManager.running = false;
      setTimeout(goToOrigin, 650);
      return;
    }
    GameManager.running = false; goToOrigin();
  });

  on("b-play", ()=>{ GameManager.cameFrom = "s-home"; GameManager.start(Math.max(1, SaveManager.data.unlocked)); });
  on("b-levels", ()=>{ UIManager.buildLevels(); UIManager.show("s-levels"); });
  on("b-shop",   ()=> { if (BOUTIQUE_OUVERTE) UIManager.show("s-shop"); });
  on("b-restore", ()=> MonetizationManager.restaurer(false));
  on("b-adpriv",  ()=> MonetizationManager.prefsPub());
  on("b-sky",    ()=> SkyManager.show());
  on("b-settings", ()=> UIManager.show("s-settings"));

  on("b-undo",    ()=>{ if (!GameManager.undo()) UIManager.toast(T("undo_empty")); });
  on("b-restart", ()=> GameManager.start(GameManager.level.n));
  on("b-hint",    ()=>{
    document.getElementById("b-hint").classList.remove("nudge");
    GameManager.nudging = false;
    MonetizationManager.rewardedHint(()=> GameManager.giveHint());
  });

  on("g-time",   ()=> GameManager.pause());
  on("b-resume", ()=> GameManager.resume());
  /* Un seul point d'entree pour les 4 boutons : sans achat, on explique
     pourquoi au lieu de tenter un export qui echouerait de toute facon
     (et qu'on ne veut plus jamais laisser echouer en silence). */
  const exporterCiel = (...args)=>{
    if (!SaveManager.data.allUnlocked){ UIManager.message(T("sky_locked_msg")); return; }
    SkyManager.exporter(...args);
  };
  on("b-sky-a4", ()=> exporterCiel("A4"));
  on("b-sky-a3", ()=> exporterCiel("A3"));
  on("b-sky-eco", ()=> exporterCiel("A4", true));
  on("b-sky-pro", ()=> exporterCiel("A3", false, true));
  /* Auto-pause quand l'app passe en arrière-plan (appel, verrouillage,
     changement d'app) — jamais de reprise automatique au retour : le
     joueur doit rouvrir volontairement le jeu, pas relancer le temps
     avant d'être prêt. document.hidden est la mesure fiable ; blur/focus
     se déclenchent aussi sur des interactions bénignes (clavier, alerte
     système) et auraient mis en pause bien trop souvent. */
  document.addEventListener("visibilitychange", ()=>{
    if (document.hidden) GameManager.pause();
  });

  on("msg-ok",   ()=> document.getElementById("ov-msg").classList.remove("on"));

  const toggle = (id, key, after) => on(id, ()=>{
    SaveManager.data[key] = !SaveManager.data[key];
    SaveManager.save(); UIManager.syncSwitches(); UIManager.syncTheme(); UIManager.syncAmbiance(); UIManager.syncMode(); UIManager.syncMoteur(); if (after) after();
  });
  toggle("sw-sound", "sound");
  toggle("sw-vibe",  "vibrate", ()=> buzz(20));
  /* Changer le mode du Ciel doit se voir tout de suite si on y est —
     sinon le joueur croit que l'interrupteur ne fait rien. */
  toggle("sw-ciel",  "cielReel", ()=>{
    if (document.getElementById("s-sky").classList.contains("on")) SkyManager.layout(false);
  });

  on("b-theme", ()=> UIManager.cycleTheme());
  /* NOTER L'APPLICATION : voie officielle Google, la fiche Play Store,
     plutôt que l'API In-App Review. Cette dernière affiche la fenêtre
     native SANS quitter le jeu, mais elle exige un plugin Capacitor
     enregistré au moment de la fabrication — un changement de chaîne
     de fabrication (robot GitHub), pas seulement du fichier HTML.

     Vérifié dans le code source de Capacitor avant d'écrire cette ligne :
     Bridge.launchIntent() intercepte TOUTE adresse qui ne pointe pas vers
     le serveur local de l'application et la relance via une intention
     Android (ACTION_VIEW), automatiquement, sans plugin. Un simple lien
     https:// suffit donc — inutile d'utiliser un lien market:// avec un
     repli séparé, ce que je pensais au départ avant de vérifier. Android
     choisit lui-même l'application Play Store si elle est installée,
     sinon un navigateur. Fonctionne aussi tel quel pendant les tests
     dans un simple navigateur, avant tout empaquetage. */
  on("b-note", ()=>{
    location.href = "https://play.google.com/store/apps/details?id=com.brainoxystudio.branoxy";
  });
  /* Diagnostic discret : un appui long (600 ms) sur le numéro de
     version déclenche le même export qu'avant, sans bouton visible.
     Un simple clic ne fait rien — aucun testeur ne le découvre par
     accident en explorant les Paramètres. */
  (()=>{
    const v = document.getElementById("p-version");
    if (!v) return;
    let t = null;
    const armer = ()=>{ t = setTimeout(()=> UIManager.exporterStats(), 600); };
    const desarmer = ()=>{ clearTimeout(t); };
    v.addEventListener("pointerdown", armer);
    v.addEventListener("pointerup", desarmer);
    v.addEventListener("pointerleave", desarmer);
  })();
  on("b-mode", ()=> UIManager.cycleMode());
  on("b-ambiance", ()=> UIManager.cycleAmbiance());
  on("b-lang", ()=>{
    /* Le bouton faisait basculer entre DEUX langues. Avec six, il
       parcourt la liste : un appui, la langue suivante. */
    const dispo = Object.keys(I18N.dict);
    const i = dispo.indexOf(I18N.lang);
    I18N.lang = SaveManager.data.lang = dispo[(i + 1) % dispo.length];
    SaveManager.save(); I18N.apply(); UIManager.syncLang();
    UIManager.buildLevels(); UIManager.syncPlayProgress(); MonetizationManager.refreshBanner();
  });
  on("b-reset", ()=>{
    /* Action irréversible : elle se demandait autrefois sans rien
       demander, et le message « Progression réinitialisée » arrivait
       APRÈS coup — un appui malencontreux effaçait tout, sans recours.
       Deux garde-fous : on demande avant, et on garde une copie
       restaurable, enregistrée elle aussi pour survivre à un
       redémarrage. */
    const niveau = Math.max(1, SaveManager.data.unlocked);
    const pts = fmtScore(SaveManager.data.score);
    UIManager.confirm(
      T("reset_warn").replace("%n", niveau).replace("%p", pts),
      T("reset_do"),
      ()=>{
        /* Audit : hintsEnCours et skyDone étaient oubliés ici. Un niveau
           où le joueur avait pris un indice sans finir gardait sa marque
           APRÈS une remise à zéro complète : il le rejouait proprement,
           sans le moindre indice, et récoltait quand même 0 étoile et
           0 point — sans rien avoir fait de mal. Reproduit à l'identique
           avant correction. skyDone était oublié de la même façon : les
           constellations recomplétées n'étaient plus jamais fêtées.
           Les deux sont désormais effacés ET inclus dans la copie de
           secours, pour que la restauration soit complète elle aussi. */
        const copie = JSON.stringify({
          unlocked: SaveManager.data.unlocked, stars: SaveManager.data.stars,
          best: SaveManager.data.best, wins: SaveManager.data.wins, score: SaveManager.data.score,
          hintsEnCours: SaveManager.data.hintsEnCours, skyDone: SaveManager.data.skyDone,
          pts: SaveManager.data.pts
        });
        try{ Persist.set(SaveManager.KEY + ":backup", copie); }catch(e){}
        SaveManager.data.unlocked = 1; SaveManager.data.stars = {}; SaveManager.data.best = {};
        SaveManager.data.wins = 0; SaveManager.data.score = 0;
        SaveManager.data.hintsEnCours = {}; SaveManager.data.skyDone = {};
        SaveManager.data.pts = {};
        SaveManager.save(); UIManager.buildLevels(); UIManager.syncPlayProgress();
        /* Deuxième temps : la remise à zéro a eu lieu, et une
           restauration reste possible. Ce n'est plus une question —
           le bouton principal ne doit donc plus proposer d'annuler. */
        UIManager.confirm(T("reset_ok"), T("reset_undo"), ()=>{
          Object.assign(SaveManager.data, JSON.parse(copie));
          SaveManager.save(); UIManager.buildLevels(); UIManager.syncPlayProgress();
          UIManager.message(T("reset_restored"));
        }, T("reset_done_title"), T("understood"));
      },
      T("reset_title"));   // question en titre, conséquence en dessous
  });

  requestAnimationFrame(loop);
})();
</script>
