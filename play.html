      Pourquoi une seconde métrique alors qu'on a déjà l'euclidienne :
      l'euclidienne arrondit les coins, donc des marches calculées
      dessus donnent des courbes de niveau — une carte topographique.
      Vérifié en rendant l'image, pas supposé.

      Sur une forme à angles droits, la distance de Tchebychev garde les
      marches PARALLÈLES aux côtés et les fait se rejoindre en onglet à
      45°. C'est exactement la géométrie d'une taille en degrés.

      Calcul exact en deux balayages (chanfrein à 8 voisins, tous de
      coût 1), donc linéaire — même classe de coût que l'euclidienne. */
  _chebychev(masque, w, h){
    const INF = 1e9, d = new Float32Array(w*h);
    for (let i = 0; i < w*h; i++) d[i] = masque[i] ? INF : 0;
    for (let y = 0; y < h; y++){
      for (let x = 0; x < w; x++){
        const i = y*w + x;
        if (d[i] === 0) continue;
        let m = INF;
        if (y > 0){
          if (x > 0)     m = Math.min(m, d[i-w-1]);
                         m = Math.min(m, d[i-w]);
          if (x < w-1)   m = Math.min(m, d[i-w+1]);
        }
        if (x > 0)       m = Math.min(m, d[i-1]);
        if (m + 1 < d[i]) d[i] = m + 1;
      }
    }
    for (let y = h-1; y >= 0; y--){
      for (let x = w-1; x >= 0; x--){
        const i = y*w + x;
        if (d[i] === 0) continue;
        let m = INF;
        if (y < h-1){
          if (x < w-1)   m = Math.min(m, d[i+w+1]);
                         m = Math.min(m, d[i+w]);
          if (x > 0)     m = Math.min(m, d[i+w-1]);
        }
        if (x < w-1)     m = Math.min(m, d[i+1]);
        if (m + 1 < d[i]) d[i] = m + 1;
      }
    }
    return d;
  },

  /** Champ de distance d'une pièce, mis en cache à part : le moteur
      WebGL2 s'en sert comme carte de relief. Le calcul exact reste sur
      le processeur — c'est un travail de balayage, mal adapté au GPU —
      tandis que l'éclairage, lui, part sur la carte graphique. */
  champs: new Map(),
  champ(cells, cell, sharp){
    const k = Math.round(cell) + "|" + cells.map(c => c.c+","+c.r+(c.t||"")).join(";");
    if (this.champs.has(k)) return this.champs.get(k);
    let r = null;
    try{
      const s = PieceManager.size(cells), M = 2;
      const w = Math.ceil(s.w * cell) + M*2, h = Math.ceil(s.h * cell) + M*2;
      if (w >= 4 && h >= 4 && w*h <= 1.2e6){
        const cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        const c2 = cv.getContext("2d", { willReadFrequently: true });
        if (c2){
          c2.fillStyle = "#fff";
          c2.fill(Renderer.shape(cells, M, M, cell, null, sharp));
          const px = c2.getImageData(0, 0, w, h).data;
          const masque = new Uint8Array(w*h);
          for (let i = 0; i < w*h; i++) masque[i] = px[i*4+3] > 127 ? 1 : 0;
          r = { dist: this._distance(masque, w, h),
                cheb: this._chebychev(masque, w, h),
                masque, w, h, M };
        }
      }
    }catch(e){ r = null; }
    if (this.champs.size >= this.MAX) this.champs.delete(this.champs.keys().next().value);
    this.champs.set(k, r);
    return r;
  },

  /** Fabrique l'image d'une pièce taillée. Renvoie null si quoi que ce
      soit échoue : l'appelant retombe alors sur l'ancien dégradé, et le
      jeu reste jouable. */
  fabriquer(cells, cell, color, sharp){
    try{
      const s = PieceManager.size(cells);
      const M = 2;                                   // marge d'anticrénelage
      const w = Math.ceil(s.w * cell) + M*2, h = Math.ceil(s.h * cell) + M*2;
      if (w < 4 || h < 4 || w*h > 1.2e6) return null;

      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      const c2 = cv.getContext("2d", { willReadFrequently: true });
      if (!c2) return null;
      c2.fillStyle = "#fff";
      c2.fill(Renderer.shape(cells, M, M, cell, null, sharp));

      const img = c2.getImageData(0, 0, w, h);
      const px = img.data;
      const masque = new Uint8Array(w * h);
      for (let i = 0; i < w*h; i++) masque[i] = px[i*4 + 3] > 127 ? 1 : 0;

      const dist = this._distance(masque, w, h);
      const biseau = Math.max(3, cell * this.BISEAU);

      /* hauteur du biseau : 0 sur l'arête, 1 au cœur, avec un arrondi
         en quart de sinus qui évite l'angle vif au sommet. */
      const ht = new Float32Array(w * h);
      for (let i = 0; i < w*h; i++){
        ht[i] = Math.sin(Math.min(dist[i] / biseau, 1) * Math.PI / 2);
      }

      const base = [parseInt(color.substr(1,2),16),
                    parseInt(color.substr(3,2),16),
                    parseInt(color.substr(5,2),16)];
      /* Lumière fixe en haut à gauche, comme partout ailleurs dans le
         jeu — l'ombre portée des pièces tombe déjà vers le bas. */
      const Lx = -0.45, Ly = -0.62, Lz = 0.65;
      const ln = Math.sqrt(Lx*Lx + Ly*Ly + Lz*Lz);
      const lx = Lx/ln, ly = Ly/ln, lz = Lz/ln;
      let hx = lx, hy = ly, hz = lz + 1;              // demi-vecteur (Blinn-Phong)
      const hn = Math.sqrt(hx*hx + hy*hy + hz*hz);
      hx /= hn; hy /= hn; hz /= hn;
      const epMax = cell * 0.9;

      for (let y = 0; y < h; y++){
        for (let x = 0; x < w; x++){
          const i = y*w + x, o = i*4;
          if (!masque[i]){ px[o+3] = px[o+3] > 0 ? px[o+3] : 0; continue; }
          const gx = (ht[i + (x < w-1 ? 1 : 0)] - ht[i - (x > 0 ? 1 : 0)]) * 0.5;
          const gy = (ht[i + (y < h-1 ? w : 0)] - ht[i - (y > 0 ? w : 0)]) * 0.5;
          let nx = -gx * biseau * 0.5, ny = -gy * biseau * 0.5, nz = 1;
          const nn = Math.sqrt(nx*nx + ny*ny + 1);
          nx /= nn; ny /= nn; nz /= nn;

          const diff = Math.max(0, nx*lx + ny*ly + nz*lz);
          let sp = Math.max(0, nx*hx + ny*hy + nz*hz);
          sp = Math.pow(sp, 42) * 0.85;
          const fres = Math.pow(1 - nz, 2.4) * 0.30;
          const ep = Math.min(dist[i] / epMax, 1);

          const k = (0.55 + 0.75*ep) * (0.42 + 0.78*diff);
          px[o]   = Math.min(255, base[0]*k + 255*sp + 190*fres);
          px[o+1] = Math.min(255, base[1]*k + 255*sp + 225*fres);
          px[o+2] = Math.min(255, base[2]*k + 255*sp + 255*fres);
        }
      }
      c2.putImageData(img, 0, 0);
      return { cv, M };
    }catch(e){ return null; }
  },

  obtenir(cells, cell, color, sharp){
    const k = this.cle(cells, cell, color);
    if (this.cache.has(k)) return this.cache.get(k);
    const g = this.fabriquer(cells, cell, color, sharp);
    if (this.cache.size >= this.MAX) this.cache.delete(this.cache.keys().next().value);
    this.cache.set(k, g);
    return g;
  }
};

const Renderer = {
  cv:null, ctx:null, W:0, H:0, dpr:1,
  lightCv:null, lightCtx:null, lightScale:0.25,
  waves:[],
  risingStars:[],
  board:{ ox:0, oy:0, cell:40 },
  tray:{ y:0, cell:24, slots:{} },

  /* Nappe de lumière à la résolution du niveau.

     ECLAT_MS : durée. Passée de 500 à 900 ms — à 500 ms l'effet ne se
       ressentait pas sur un grand plateau : la nappe parcourait plus de
       mille pixels en un demi-tour de seconde.
     ECLAT_FORCE : intensité, passée de 0.45 à 0.85. Restée basse au
       début à cause d'un reproche sur le blanc, mais ce blanc-là venait
       d'une barre FIXE peinte en permanence. Ici la lumière passe et
       s'en va : c'est le mouvement qu'on doit voir, pas une tache.

     CONSÉQUENCE ASSUMÉE : à 900 ms la nappe dépasse l'envol de l'étoile
       (au plus tôt 600 ms). Les deux ne se gênent pas à l'écran — la
       nappe est sur les pièces, l'étoile part bien au-dessus du plateau.
       Le popup du score, lui, RECOUVRE le plateau : son apparition est
       donc calée sur la fin de la nappe, plus bas dans le fichier. */
  eclatAt: 0,
  ECLAT_MS: 900,
  ECLAT_FORCE: 0.85,
  _nappeCv: null,

  init(){
    this.cv = document.getElementById("canvas");
    this.ctx = this.cv.getContext("2d");
    this.lightCv = document.createElement("canvas");
    this.lightCtx = this.lightCv.getContext("2d");
    window.addEventListener("resize", ()=> this.layout());
  },

  /** Émet une onde lumineuse depuis un point du plateau. */
  /** Fait s'envoler un point de lumière depuis (x,y), de la couleur
      qu'il portera une fois installé dans le Ciel. Plafonné à 3 en vol
      pour rester lisible si le joueur enchaîne les niveaux vite.
      Des éclats partent en étoile au moment de la déchirure — direction
      et distance tirées une fois pour toutes, pas recalculées à chaque
      image, sinon ils scintilleraient de façon incohérente. */
  launchStar(x, y, color, planete, geante){
    const n = 10 + Math.floor(Math.random() * 4);
    const eclats = [];
    for (let i = 0; i < n; i++)
      eclats.push({
        angle: (i / n) * 6.2832 + Math.random() * .35,
        dist: 30 + Math.random() * 40,
        longueur: 13 + Math.random() * 12,
      });
    this.risingStars.push({ x, y, color, t: performance.now(), life: 2400, eclats, planete: !!planete, geante: !!geante });
    if (this.risingStars.length > 3) this.risingStars.shift();
    /* Un éclair bref et net accompagne la déchirure — distinct de la
       lueur douce de l'étoile elle-même, il donne le choc du moment où
       ça se déchire, avant que le scintillement ne prenne le relais. */
    this.emit(x, y, "#FFFFFF", { life: 380, a: .95, w: this.board.cell * 1.6, max: this.board.cell * 5 });
  },

  /** Une vraie étoile scintillante — halo large et doux, cœur à bords
      progressifs (jamais un cercle à bord net), quatre branches
      effilées plus quatre fines en diagonale, légèrement tournées au
      fil du temps pour un effet de scintillement vivant. Vérifié en
      rendu Python avant d'écrire ce code : un simple cercle plein,
      même entouré d'un halo, se lit comme un rond mal fini — la forme
      à branches est ce qui fait reconnaître « étoile » au premier
      coup d'œil. */
  /** Le rendu d'une planète qui s'envole — une vraie sphère, pas un
      scintillement à branches. Un point qui scintille dit « étoile » ;
      un monde qu'on reconnaît doit se lire comme un disque plein, avec
      son dégradé et ses bandes s'il s'agit d'une géante gazeuse.
      Formule identique à celle utilisée dans le Ciel (SkyManager), pour
      que ce qui s'envole du plateau soit vraiment ce qu'on retrouvera
      installé — pas une approximation qui recréerait un autre écart. */
  planetSphere(ctx, x, y, taille, color, alpha, geante){
    if (alpha <= 0 || taille <= 0) return;
    const r = 26 * taille;
    ctx.save();
    ctx.globalAlpha = alpha;
    this.blob(ctx, x, y, r * 2.4, color, .4);
    const g = ctx.createRadialGradient(x - r*.3, y - r*.3, 0, x, y, r);
    g.addColorStop(0, "rgba(255,255,255,.6)");
    g.addColorStop(.35, color);
    g.addColorStop(1, shade(color, -.35));
    ctx.beginPath(); ctx.fillStyle = g;
    ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    if (geante){
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.clip();
      const nb = 5;
      for (let i = -nb; i <= nb; i++){
        const yy = y + i * (r / nb) * .85, h = (r / nb) * .9;
        ctx.fillStyle = shade(color, i % 2 === 0 ? .12 : -.1);
        ctx.globalAlpha = alpha * .35;
        ctx.fillRect(x - r * 1.3, yy - h/2, r * 2.6, h);
      }
    }
    ctx.restore();
  },

  starFlare(ctx, x, y, taille, color, alpha, rotationDeg){
    if (alpha <= 0 || taille <= 0) return;
    ctx.save();
    ctx.globalAlpha = alpha;

    this.blob(ctx, x, y, 95 * taille, color, .55);

    const rCoeur = 24 * taille;
    const g = ctx.createRadialGradient(x, y, 0, x, y, rCoeur);
    g.addColorStop(0,  "rgba(255,255,250,1)");
    g.addColorStop(.5, hexa(color, .9));
    g.addColorStop(1,  hexa(color, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, rCoeur, 0, 6.2832); ctx.fill();

    const branche = (longueur, largeur, angleDeg, a) => {
      const L = longueur * taille, W = largeur * taille;
      const rad = (angleDeg + rotationDeg) * Math.PI / 180;
      const cos = Math.cos(rad), sin = Math.sin(rad);
      const pt = (lx, ly) => [x + lx*cos - ly*sin, y + lx*sin + ly*cos];
      const p1 = pt(-W/2, 0), p2 = pt(0, -L*.14), p3 = pt(W/2, 0), p4 = pt(0, L);
      ctx.globalAlpha = alpha * a;
      ctx.fillStyle = "#FFFFFA";
      ctx.beginPath();
      ctx.moveTo(...p1); ctx.lineTo(...p2); ctx.lineTo(...p3); ctx.lineTo(...p4);
      ctx.closePath(); ctx.fill();
    };
    [0, 90, 180, 270].forEach(a => branche(26, 2.6, a, .85));
    [45, 135, 225, 315].forEach(a => branche(15, 1.3, a, .5));

    ctx.globalAlpha = alpha;
    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath(); ctx.arc(x, y, Math.max(1, 2.2 * taille), 0, 6.2832); ctx.fill();
    ctx.restore();
  },

  emit(x, y, color, o){
    o = o || {};
    this.waves.push({
      x, y, color,
      t: performance.now(),
      life: o.life || 760,
      max:  o.max  || Math.max(this.W, this.H) * 0.9,
      w:    o.w    || this.board.cell * 0.55,
      a:    o.a    || 0.85
    });
    if (this.waves.length > 14) this.waves.shift();
  },

  /** Barycentre des cases d'une pièce : pour une forme en L ou en T, le
      centre du rectangle englobant tombe sur une case vide, et la lumière
      s'affichait à côté de la pièce. */
  center(cells, ox, oy, cell){
    let sx = 0, sy = 0;
    cells.forEach(p=>{ sx += p.c + .5; sy += p.r + .5; });
    return { x: ox + (sx / cells.length) * cell, y: oy + (sy / cells.length) * cell };
  },

  /** Onde partant d'une pièce posée. */
  emitFromPiece(piece, oc, or, o){
    const B = this.board;
    const c = this.center(piece.cells, B.ox + oc*B.cell, B.oy + or*B.cell, B.cell);
    this.emit(c.x, c.y, piece.color, o);
  },

  /** Mesure la place que prend la réserve, sans la positionner.
      `square` mesure chaque pièce dans son encombrement maximal : une pièce
      1x4 compte alors pour 4x4. C'est ce qui rend la mesure insensible aux
      rotations, donc stable pendant toute la durée du niveau. */
  /** Mesure la réserve dans une zone de largeur donnée. `zoneW` permet de
      la confiner à une colonne (mise en page paysage) au lieu de toute
      la largeur — par défaut, tout l'écran, comme avant. */
  packTray(list, tc, square, zoneW){
    const W = zoneW || this.W;
    const gap = Math.max(9, tc * .55), rowGap = Math.max(9, tc * .5);
    if (!list.length) return { rows:[], heights:[], height:0, gap, rowGap, used:0 };
    const dim = p => {
      const s = PieceManager.size(p.cells);
      return square ? { w: Math.max(s.w, s.h), h: Math.max(s.w, s.h) } : s;
    };
    const rows = [[]]; let rowW = 0;
    list.forEach(p=>{
      const w = dim(p).w * tc;
      if (rowW + w > W - 14 && rows[rows.length-1].length){ rows.push([]); rowW = 0; }
      rows[rows.length-1].push(p); rowW += w + gap;
    });
    const heights = rows.map(r => Math.max(...r.map(p => dim(p).h)) * tc);
    const height = heights.reduce((a,b)=>a+b, 0) + rowGap * (rows.length - 1);
    /* Largeur réellement occupée : sert à recentrer l'ensemble plutôt
       que de laisser un trou quand la réserve est plus étroite que sa zone. */
    const used = Math.max(...rows.map(r =>
      r.reduce((a,p)=> a + dim(p).w * tc, 0) + gap * (r.length - 1)));
    return { rows, heights, height, gap, rowGap, used };
  },

  /** Place réellement la réserve à partir d'une mesure. */
  placeTray(pack, tc, top, zoneX, zoneW){
    const X = zoneX || 0, W = zoneW || this.W;
    const slots = {}; let y = top;
    pack.rows.forEach((row, i)=>{
      const wSum = row.reduce((a,p)=> a + PieceManager.size(p.cells).w * tc, 0) + pack.gap * (row.length - 1);
      let x = X + (W - wSum) / 2;
      row.forEach(p=>{
        const s = PieceManager.size(p.cells);
        slots[p.id] = { x, y: y + (pack.heights[i] - s.h*tc) / 2, w: s.w*tc, h: s.h*tc };
        x += s.w*tc + pack.gap;
      });
      y += pack.heights[i] + pack.rowGap;
    });
    return slots;
  },

  /** Mise en page : le plateau prend toute la place que la réserve laisse.
      Deux dispositions sont calculées — réserve SOUS le plateau, ou À CÔTÉ —
      et on garde celle qui donne les plus grandes cases. Écran haut et
      étroit : l'empilement gagne. Écran large et bas (téléphone tourné) :
      le côte à côte gagne, au lieu d'écraser le plateau en laissant la
      moitié de la largeur vide. Aucun seuil arbitraire à régler : c'est la
      mesure qui tranche, donc ça marche aussi sur une tablette ou une
      fenêtre redimensionnée. */
  layout(){
    /* La taille de case change : les pierres taillées pour l'ancienne
       taille ne valent plus rien. LES DEUX caches sont concernés — en
       oublier un laisserait des pièces à l'ancienne échelle. */
    Gemme.vider();
    Verre.vider();
    const stage = document.getElementById("stage");
    this.dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    /* Fenêtre dégénérée : on conserve la géométrie précédente plutôt que de
       calculer des dimensions négatives. Arrive quand la console de débogage
       s'ouvre, quand le clavier monte, pendant une rotation d'écran, et
       surtout quand l'application passe en ARRIÈRE-PLAN.

       La mesure se fait dans des variables locales : la version précédente
       affectait this.W avant de tester, donc elle NE conservait rien du
       tout malgré ce que dit ce commentaire. Conséquence, l'effacement de
       draw() portait sur un rectangle nul et l'écran se barbouillait à la
       reprise. */
    const mW = stage.clientWidth, mH = stage.clientHeight;
    if (mW < 140 || mH < 140) return;
    this.W = mW; this.H = mH;
    this.cv.width = this.W * this.dpr; this.cv.height = this.H * this.dpr;
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.lightCv.width  = Math.max(1, Math.round(this.W * this.lightScale));
    this.lightCv.height = Math.max(1, Math.round(this.H * this.lightScale));

    const L = GameManager.level; if (!L) return;
    const pad = 10;
    const gapV = Math.max(16, Math.round(this.H * .05));
    const gapH = Math.max(16, Math.round(this.W * .04));
    const loose = L.pieces.filter(p => !p.placed);
    /* Les pièces en réserve sont dessinées à la moitié de l'échelle du
       plateau : c'est le meilleur compromis mesuré entre surface de jeu et
       saut d'échelle au moment de la saisie (x2 au pire). */
    const trayCellOf = c => Math.max(16, Math.round(c * .50));

    /* Réservation calculée sur l'ensemble des pièces du niveau : elle ne
       bouge donc plus quand on en pose une ou qu'on en tourne une. */
    const empile = ()=>{
      const avail = this.H - pad*2;
      let cell = Math.max(12, Math.floor(Math.min((this.W - pad*2) / L.cols, avail / L.rows, 116)));
      let hold = this.packTray(L.pieces, trayCellOf(cell), true, this.W);
      while (cell > 15 && L.rows*cell + gapV + hold.height > avail){
        cell--;
        hold = this.packTray(L.pieces, trayCellOf(cell), true, this.W);
      }
      return { mode:"v", cell, hold };
    };

    const cote = ()=>{
      const avail = this.H - pad*2;
      let cell = Math.max(12, Math.floor(Math.min((this.W - pad*2) / L.cols, avail / L.rows, 116)));
      let hold = null;
      while (cell > 15){
        const zoneW = this.W - pad*2 - L.cols*cell - gapH;
        if (zoneW >= 90){
          const h = this.packTray(L.pieces, trayCellOf(cell), true, zoneW);
          /* `used <= zoneW` est indispensable : une pièce plus large que
             la colonne y est placée quand même (on ne peut pas la couper),
             et la réserve déborde alors de sa zone — ce qui poussait le
             plateau hors de l'écran. Sans cette condition, la disposition
             côte à côte était retenue à tort même en portrait. */
          if (h.used <= zoneW && h.height <= avail && L.rows*cell <= avail){ hold = h; break; }
        }
        cell--;
      }
      if (!hold) return null;
      return { mode:"h", cell, hold, zoneW: this.W - pad*2 - L.cols*cell - gapH };
    };

    const a = empile(), b = cote();
    const best = (b && b.cell > a.cell) ? b : a;
    const cell = best.cell, tc = trayCellOf(cell), hold = best.hold;
    this.board.cell = cell;

    if (best.mode === "h"){
      /* Côte à côte : l'ensemble (plateau + réserve réellement occupée)
         est centré, pour ne pas coller le plateau au bord gauche quand la
         réserve est plus étroite que sa colonne. */
      const pack = this.packTray(loose, tc, false, best.zoneW);
      const trayW = Math.min(best.zoneW, Math.max(pack.used || 0, hold.used || 0, 90));
      const blocW = L.cols*cell + gapH + trayW;
      /* Garde de sécurité : même si un calcul en amont se trompait un
         jour, le plateau ne doit jamais commencer hors de l'écran. */
      const ox = Math.max(pad, Math.round((this.W - blocW) / 2));
      this.board.ox = ox;
      this.board.oy = Math.max(pad, Math.round((this.H - L.rows*cell) / 2));
      const zoneX = ox + L.cols*cell + gapH;
      const trayTop = Math.max(pad, Math.round((this.H - pack.height) / 2));
      this.tray = { y: trayTop, cell: tc, slots: this.placeTray(pack, tc, trayTop, zoneX, trayW) };
      this.draw();
      return;
    }

    const total = L.rows*cell + gapV + hold.height;
    const top = Math.max(pad, Math.round((this.H - total) / 2));
    this.board.ox = Math.round((this.W - L.cols*cell) / 2);
    this.board.oy = top;

    /* Les pièces restantes se recentrent dans la bande réservée. */
    const bandTop = top + L.rows*cell + gapV;
    const pack = this.packTray(loose, tc, false, this.W);
    const trayTop = bandTop + Math.max(0, (hold.height - pack.height) / 2);
    this.tray = { y: trayTop, cell: tc, slots: this.placeTray(pack, tc, trayTop, 0, this.W) };
    this.draw();
  },

  /* ---------------- Formes ---------------- */

  /** Les trois sommets d'un triangle, en pixels, a l'interieur d'une
      case dessinee a (x,y) de cote `cell`. */
  /** La SILHOUETTE réelle d'une pièce : ses cases fondues en un ou
      plusieurs contours fermés, sans aucune arête interne.

      Auparavant chaque case était dessinée séparément avec son propre
      rayon d'arrondi, et des rectangles de soudure masquaient les
      jonctions. Ça marchait pour des cases entières, mais aux deux
      extrémités d'une diagonale les arrondis de chaque case laissaient
      un petit épaulement : la diagonale n'allait pas franchement d'un
      point à l'autre. Ici on calcule le contour une fois, on fusionne
      les segments alignés — une diagonale devient un seul segment A→B —
      et l'arrondi s'applique au contour final, pas aux cases. */
  outline(cells){
    const V = p => p[0] + "," + p[1];
    const poly = cell => {
      const c = cell.c, r = cell.r;
      const TL=[c,r], TR=[c+1,r], BL=[c,r+1], BR=[c+1,r+1];
      if (!cell.t) return [TL,TR,BR,BL];
      return { TL:[TL,TR,BL], TR:[TL,TR,BR], BR:[TR,BR,BL], BL:[TL,BR,BL] }[cell.t];
    };
    /* Toutes les arêtes orientées. Deux cases voisines de la même pièce
       partagent la même arête en sens inverse : c'est ce qui permet de
       reconnaître une arête interne sans aucun cas particulier, y
       compris pour les facettes. */
    const edges = new Map();
    cells.forEach(cell=>{
      const p = poly(cell);
      for (let i = 0; i < p.length; i++){
        const a = p[i], b = p[(i+1) % p.length];
        edges.set(V(a) + ">" + V(b), [a, b]);
      }
    });
    const bord = [];
    edges.forEach((e, k)=>{ if (!edges.has(V(e[1]) + ">" + V(e[0]))) bord.push(e); });

    const parDepart = new Map();
    bord.forEach(e=>{
      const k = V(e[0]);
      if (!parDepart.has(k)) parDepart.set(k, []);
      parDepart.get(k).push(e);
    });

    const vues = new Set(), boucles = [];
    const angle = d => Math.atan2(d[1], d[0]);
    bord.forEach(depart=>{
      if (vues.has(depart)) return;
      const boucle = [];
      let e = depart;
      while (e && !vues.has(e)){
        vues.add(e);
        boucle.push(e[0]);
        const suite = (parDepart.get(V(e[1])) || []).filter(x => !vues.has(x));
        if (!suite.length) break;
        /* Un sommet peut réunir plus de deux arêtes (pièce qui se touche
           en coin) : on prend systématiquement le virage le plus serré,
           ce qui garde le parcours sur le même contour. */
        const dIn = [e[1][0]-e[0][0], e[1][1]-e[0][1]];
        const rel = x => {
          const d = [x[1][0]-x[0][0], x[1][1]-x[0][1]];
          let a = angle(d) - angle(dIn);
          while (a <= -Math.PI) a += 2*Math.PI;
          while (a > Math.PI)  a -= 2*Math.PI;
          return a;
        };
        suite.sort((p, q) => rel(p) - rel(q));
        e = suite[0];
      }
      if (boucle.length >= 3) boucles.push(boucle);
    });

    /* Fusion des points alignés : trois points sur une même droite n'en
       font plus qu'un segment. C'est ce qui transforme une diagonale
       hachée en une vraie arête d'un bout à l'autre. */
    return boucles.map(b=>{
      const out = [];
      for (let i = 0; i < b.length; i++){
        const p0 = b[(i-1+b.length) % b.length], p1 = b[i], p2 = b[(i+1) % b.length];
        const cross = (p1[0]-p0[0])*(p2[1]-p1[1]) - (p1[1]-p0[1])*(p2[0]-p1[0]);
        if (Math.abs(cross) > 1e-9) out.push(p1);
      }
      return out.length >= 3 ? out : b;
    });
  },

  /** Trace une suite de points en arrondissant chaque sommet.

      Le rayon est borné SELON L'ANGLE, pas seulement selon la longueur
      des arêtes : un arc consomme r / tan(angle/2) le long de chaque
      arête, soit 2,41 × r sur une pointe à 45° — les pointes de facette,
      justement. Borné à la seule moitié d'arête, l'arc débordait, les
      arrondis de deux sommets voisins se chevauchaient, et la forme se
      rétractait en pastille : d'où de petites pièces devenues rondes et
      un filet de fond visible entre deux pièces censées se toucher. */
  roundedLoop(path, pts, R, vif){
    const n = pts.length;
    if (n < 3) return;
    const m = [(pts[n-1][0] + pts[0][0]) / 2, (pts[n-1][1] + pts[0][1]) / 2];
    path.moveTo(m[0], m[1]);
    for (let i = 0; i < n; i++){
      const prev = pts[(i-1+n) % n], cur = pts[i], next = pts[(i+1) % n];
      let r = 0;
      /* Un sommet situé À L'INTÉRIEUR du motif est partagé avec une
         pièce voisine : l'arrondir creuserait une poche sombre entre
         les deux, chacune s'écartant du point commun. Il reste donc
         vif, et les deux pièces se rejoignent exactement au même point.
         Seuls les sommets exposés au fond sont adoucis. */
      const nettete = vif ? vif(i) : 0;
      if (nettete < 1){
        const v1 = [prev[0]-cur[0], prev[1]-cur[1]], v2 = [next[0]-cur[0], next[1]-cur[1]];
        const l1 = Math.hypot(v1[0], v1[1]), l2 = Math.hypot(v2[0], v2[1]);
        /* Un coin RENTRANT (échancrure) ne doit presque pas s'arrondir :
           arrondi autant qu'un coin saillant, il fait « fondre » la
           forme — une pièce isolée prenait un aspect de vaguelette,
           alors que la même pièce assemblée paraissait nette parce que
           ses coins partagés restaient vifs. Le sens de rotation du
           contour donne la nature du coin sans aucun cas particulier. */
        const croix = (cur[0]-prev[0])*(next[1]-cur[1]) - (cur[1]-prev[1])*(next[0]-cur[0]);
        r = croix < 0 ? R * 0.22 : R;
        if (l1 > 0 && l2 > 0){
          const cos = Math.max(-1, Math.min(1, (v1[0]*v2[0] + v1[1]*v2[1]) / (l1*l2)));
          const demi = Math.acos(cos) / 2;
          r = Math.min(r, (Math.min(l1, l2) / 2) * Math.tan(demi) * 0.9);
        }
        r *= (1 - nettete);
      }
      path.arcTo(cur[0], cur[1], next[0], next[1], Math.max(0, r));
    }
    path.closePath();
  },

  /** Recense les sommets qu'au moins DEUX pièces posées ont en commun.
      Un tel sommet doit rester vif chez les deux : si chacune y arrondit
      son coin, elles s'écartent du point commun et creusent une encoche.
      Ça vaut partout — à l'intérieur du motif comme sur son périmètre,
      où le défaut se voyait le plus car il entaillait la silhouette
      extérieure. Seuls les sommets qu'une pièce ne partage avec personne
      sont adoucis : l'arrondi extérieur du jeu est donc préservé. */
  censusVertices(){
    const compte = new Map();
    const L = GameManager.level;
    if (!L) return new Set();
    L.pieces.forEach(p=>{
      if (!p.placed || !p.pos) return;
      const vus = new Set();
      this.outline(p.cells).forEach(loop=> loop.forEach(v=>{
        const k = (p.pos.c + v[0]) + "," + (p.pos.r + v[1]);
        if (vus.has(k)) return;            /* une pièce ne se compte qu'une fois */
        vus.add(k);
        compte.set(k, (compte.get(k) || 0) + 1);
      }));
    });
    const partages = new Set();
    compte.forEach((n, k)=>{ if (n >= 2) partages.add(k); });
    return partages;
  },

  /** Le chemin dessinable de cette silhouette. `origin` (position de la
      pièce sur la grille) permet de reconnaître les sommets partagés
      avec une voisine, qui doivent rester vifs. Sans lui — pièce en
      réserve, pièce en main, aperçu — tout est arrondi comme avant. */
  outlinePath(cells, x0, y0, cell, origin, sharp){
    /* `sharp` : coins vifs partout, quel que soit l'état de la pièce.
       Les coins étaient arrondis en main et vifs une fois posés — parce
       qu'un sommet ne s'affûte que s'il est partagé avec une voisine, et
       qu'une pièce tenue au doigt n'en a aucune. Mesuré : 76 % des
       sommets changeaient d'aspect à la pose, jusqu'à 100 % sur
       certaines pièces. Avec des coins vifs dans les trois états, la
       pièce qu'on tient est exactement celle qu'on obtient. */
    const path = new Path2D(), R = sharp ? 0 : Math.min(cell * 0.24, 10);
    const partages = (origin && !sharp)
      ? (this._partages || (this._partages = this.censusVertices()))
      : null;
    this.outline(cells).forEach(loop=>{
      const pts = loop.map(p => [x0 + p[0]*cell, y0 + p[1]*cell]);
      let vif = null;
      if (partages && partages.size){
        /* Une pièce tenue en main suit le doigt librement : elle n'est
           alignée sur rien, donc aucun sommet n'est partagé et tout est
           arrondi. En se posant, ses coins mitoyens s'affûtent — mais
           sur 140 ms plutôt que d'un coup, pour que le changement se
           lise comme la pièce qui s'emboîte, et non comme un défaut.
           Mesuré : 76 % des sommets sont concernés, jusqu'à 100 % sur
           certaines pièces — d'où l'effet très visible d'avant. */
        const t = origin.settledAt ? (performance.now() - origin.settledAt) / 140 : 1;
        const k = Math.max(0, Math.min(1, t));
        vif = i => partages.has((origin.c + loop[i][0]) + "," + (origin.r + loop[i][1])) ? k : 0;
      }
      this.roundedLoop(path, pts, R, vif);
    });
    return path;
  },

  /** Les trois sommets d'un triangle, en pixels, à l'intérieur d'une
      case dessinée à (x,y) de côté `cell`.

      L'ORDRE DES SOMMETS COMPTE, et pas seulement pour la forme : Canvas
      remplit un chemin selon la règle « nonzero », où deux sous-tracés
      qui se chevauchent en sens OPPOSÉS s'annulent et laissent un trou.
      Les rectangles (roundRect) tournent dans le sens positif ; « BL »
      était le seul triangle listé à l'envers, donc dès qu'il chevauchait
      un rectangle de soudure il perçait la pièce d'un trou noir en
      diagonale — visible sur le plateau comme en réserve, et changeant
      avec la rotation (qui transforme BL en TL). Mesuré avant
      correction : 553 formes trouées sur 3660, soit quasiment toutes
      celles contenant un BL. L'ordre ci-dessous les met toutes dans le
      même sens que les rectangles. */
  triPoints(t, x, y, cell){
    const TL=[x,y], TR=[x+cell,y], BL=[x,y+cell], BR=[x+cell,y+cell];
    return { TL:[TL,TR,BL], TR:[TL,TR,BR], BR:[TR,BR,BL], BL:[TL,BR,BL] }[t];
  },

  /** Un point (lx,ly), en coordonnées locales 0..1 dans une case,
      tombe-t-il dans le triangle de type t ? Test par signe (produit
      vectoriel des trois arêtes) — robuste à l'ordre des sommets,
      contrairement à une première version barycentrique qui s'était
      trompée sur ce point précis lors de la vérification. */
  pointInTri(lx, ly, t){
    const tri = { TL:[[0,0],[1,0],[0,1]], TR:[[0,0],[1,0],[1,1]],
                  BR:[[1,0],[1,1],[0,1]], BL:[[0,0],[0,1],[1,1]] }[t];
    const sign = (ax,ay,bx,by,cx,cy) => (bx-ax)*(cy-ay) - (by-ay)*(cx-ax);
    const [[x1,y1],[x2,y2],[x3,y3]] = tri;
    const d1 = sign(x1,y1,x2,y2,lx,ly), d2 = sign(x2,y2,x3,y3,lx,ly), d3 = sign(x3,y3,x1,y1,lx,ly);
    return !((d1<0||d2<0||d3<0) && (d1>0||d2>0||d3>0));
  },

  /** Silhouette d'un groupe de cases (entières ou triangulaires) : coins
      extérieurs arrondis sur les cases entières, jointures soudées —
      y compris quand l'une des deux cases d'une jointure est un
      triangle, auquel cas seule l'arête qu'il touche réellement compte. */
  /** La forme dessinable d'une pièce = sa silhouette réelle. Les cases
      ne sont plus dessinées séparément : plus aucune arête interne à
      masquer, donc plus de rectangles de soudure, et l'arrondi tombe sur
      le contour final au lieu de chaque case. */
  shape(cells, x0, y0, cell, origin, sharp){
    return this.outlinePath(cells, x0, y0, cell, origin, sharp);
  },

  /** Dessine une pièce : liseré sombre, dégradé, reflet supérieur.
      Le liseré est obtenu en refaisant la silhouette légèrement dilatée :
      il épouse donc les arrondis, sans le coût d'une ombre floutée. */
  /** Nappe de lumière qui traverse une pièce déjà dessinée.

      On NE recalcule rien : on redessine la pièce SUR ELLE-MÊME en mode
      lumière, à travers un dégradé mobile. Comme la source est la pièce,
      les zones déjà claires — arêtes, biseaux — s'embrasent et les
      sombres restent sombres : la lumière suit le relief au lieu de le
      badigeonner. C'est ce qui sépare cet effet du bandeau uniforme
      rejeté auparavant.

      Le dégradé est calculé en coordonnées du PLATEAU, pas de la pièce :
      la nappe est donc continue d'une pièce à l'autre et traverse la
      figure entière d'un seul tenant. */
  _nappe(src, dx, dy, dw, dh, e){
    const c = this._nappeCv || (this._nappeCv = document.createElement("canvas"));
    if (c.width !== src.width || c.height !== src.height){
      c.width = src.width; c.height = src.height;
    }
    const g = c.getContext("2d");
    if (!g) return;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = "source-over";
    g.clearRect(0, 0, c.width, c.height);
    g.drawImage(src, 0, 0);
    /* Un point dont la projection sur u vaut s se trouve en u*s, puisque
       u est unitaire. On passe ensuite des pixels d'écran à ceux du
       canevas hors écran, qui est en résolution physique. */
    const k = src.width / Math.max(dw, 1e-6);
    const gr = g.createLinearGradient(
      (e.u.x*(e.s - e.larg) - dx)*k, (e.u.y*(e.s - e.larg) - dy)*k,
      (e.u.x*(e.s + e.larg) - dx)*k, (e.u.y*(e.s + e.larg) - dy)*k);
    gr.addColorStop(0, "rgba(255,255,255,0)");
    gr.addColorStop(0.5, "rgba(255,255,255,1)");
    gr.addColorStop(1, "rgba(255,255,255,0)");
    g.globalCompositeOperation = "destination-in";
    g.fillStyle = gr;
    g.fillRect(0, 0, c.width, c.height);
    g.globalCompositeOperation = "source-over";
    const ctx = this.ctx;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = e.a;
    ctx.drawImage(c, dx, dy, dw, dh);
    ctx.restore();
  },

  piece(cells, x0, y0, cell, color, o){
    const ctx = this.ctx; o = o || {};
    const s = PieceManager.size(cells), path = this.shape(cells, x0, y0, cell, o.origin, o.sharp);
    const bw = s.w * cell, bh = s.h * cell, b = Math.max(1.5, cell * .055);
    ctx.save();
    if (o.alpha !== undefined) ctx.globalAlpha = o.alpha;

    if (o.lift){                                   /* pièce tenue : ombre portée */
      ctx.shadowColor = "rgba(0,0,0,.7)";
      ctx.shadowBlur = cell * .6; ctx.shadowOffsetY = cell * .24;
    }
    ctx.save();
    ctx.strokeStyle = "rgba(3,8,12,.94)";
    ctx.lineWidth = b * 2;
    ctx.lineJoin = "round";
    ctx.stroke(path);          /* un seul trait, sur la silhouette entière */
    ctx.restore();
    ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

    /* Corps de la pièce : pierre taillée, calculée une fois puis
       réutilisée (voir Gemme). Si le calcul échoue — canevas refusé,
       lecture de pixels interdite, mémoire courte — on retombe sur
       l'ancien dégradé et le jeu reste parfaitement jouable. */
    /* PALIER 1 du chantier WebGL2. Le moteur est essayé en premier ;
       s'il rend, la pièce apparaît en COULEUR PLATE, sans relief. Ce
       n'est pas un oubli : c'est le rapport de test lui-même. Des
       pièces plates prouvent que le contexte s'ouvre, que la géométrie
       tombe au bon endroit et que la triangulation des facettes est
       juste. Du relief signifie que le moteur a échoué et que le repli
       a fonctionné — les deux issues sont des informations utiles.
       La raison de l'échec est jointe à l'export des relevés. */
    /* RÉSOLUTION. Le contexte 2D est mis à l'échelle de la densité de
       l'écran : une image dessinée à la taille des cases CSS est donc
       agrandie jusqu'à 2,5 fois à l'affichage, et tout devient mou.
       On la calcule à la résolution PHYSIQUE, puis on la repose à sa
       taille logique. Le défaut existait aussi sur le rendu processeur
       — il y était juste moins visible, les dégradés lissant tout. */
    const d = this.dpr || 1;
    const cellHD = cell * d;

    const gv = Verre.obtenir(cells, cellHD, color, o.sharp);
    if (gv && gv.cv){
      ctx.save();
      ctx.clip(path);
      ctx.drawImage(gv.cv, x0 - gv.M/d, y0 - gv.M/d, gv.cv.width/d, gv.cv.height/d);
      if (o.eclat) this._nappe(gv.cv, x0 - gv.M/d, y0 - gv.M/d,
                               gv.cv.width/d, gv.cv.height/d, o.eclat);
      ctx.restore();
      ctx.restore();
      return;
    }

    const gem = Gemme.obtenir(cells, cellHD, color, o.sharp);
    if (gem && gem.cv){
      ctx.save();
      ctx.clip(path);                              /* jamais hors silhouette */
      ctx.drawImage(gem.cv, x0 - gem.M/d, y0 - gem.M/d, gem.cv.width/d, gem.cv.height/d);
      ctx.restore();
    } else {
      const g = ctx.createLinearGradient(x0, y0, x0 + bw, y0 + bh);
      g.addColorStop(0, shade(color, .26));
      g.addColorStop(1, shade(color, -.22));
      ctx.fillStyle = g;
      ctx.fill(path);
      ctx.clip(path);                              /* reflet du haut */
      const h = ctx.createLinearGradient(0, y0, 0, y0 + bh);
      h.addColorStop(0,   "rgba(255,255,255,.32)");
      h.addColorStop(.30, "rgba(255,255,255,.06)");
      h.addColorStop(1,   "rgba(255,255,255,0)");
      ctx.fillStyle = h;
      ctx.fillRect(x0 - 2, y0 - 2, bw + 4, bh + 4);
    }
    ctx.restore();
  },

  /* ---------------- Lumière ---------------- */

  blob(ctx, x, y, r, color, a){
    if (r <= 0) return;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0,   hexa(color, a));
    g.addColorStop(.42, hexa(color, a * .32));
    g.addColorStop(1,   hexa(color, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
  },

  ring(ctx, x, y, r, w, color, a){
    const outer = r + w; if (outer <= 0) return;
    const g = ctx.createRadialGradient(x, y, Math.max(0, r - w), x, y, outer);
    g.addColorStop(0,  hexa(color, 0));
    g.addColorStop(.5, hexa(color, a));
    g.addColorStop(1,  hexa(color, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, outer, 0, 6.2832); ctx.fill();
  },

  /** Compose la carte de lumière de l'image courante. */
  buildLight(){
    const lc = this.lightCtx, s = this.lightScale, L = GameManager.level, B = this.board;
    lc.setTransform(1, 0, 0, 1, 0, 0);
    lc.clearRect(0, 0, this.lightCv.width, this.lightCv.height);
    lc.globalCompositeOperation = "lighter";

    /* Nappe ambiante : le plateau existe même avant la première pièce. */
    this.blob(lc, (B.ox + L.cols*B.cell/2) * s, (B.oy + L.rows*B.cell/2) * s,
              Math.hypot(L.cols, L.rows) * B.cell * .78 * s, "#6FA8C4", .40);

    L.pieces.forEach(p=>{
      const box = PieceManager.size(p.cells);
      if (p.placed){                                   /* posée : lampe franche */
        const c = this.center(p.cells, B.ox + p.pos.c*B.cell, B.oy + p.pos.r*B.cell, B.cell);
        this.blob(lc, c.x * s, c.y * s,
                  (Math.max(box.w, box.h) * .58 + 1.4) * B.cell * s, p.color, .50);
      } else {                                         /* en réserve : veilleuse */
        const sl = this.tray.slots[p.id]; if (!sl) return;
        this.blob(lc, (sl.x + sl.w/2) * s, (sl.y + sl.h/2) * s,
                  (Math.max(sl.w, sl.h) * .7 + this.tray.cell) * s, p.color, .20);
      }
    });

    const d = InputManager.drag;
    if (d){
      const box = PieceManager.size(d.piece.cells);
      const c = this.center(d.piece.cells, d.x, d.y, B.cell);
      this.blob(lc, c.x * s, c.y * s,
                (Math.max(box.w, box.h) * .7 + 2) * B.cell * s, d.piece.color, .60);
    }

    const now = performance.now();
    if (this.waves.length) this.waves = this.waves.filter(w => now - w.t < w.life);
    this.waves.forEach(w=>{
      const k = (now - w.t) / w.life, e = 1 - Math.pow(1 - k, 2.4);
      this.ring(lc, w.x*s, w.y*s, w.max*e*s, w.w*s, w.color, w.a * (1-k) * (1-k));
    });

    lc.globalCompositeOperation = "source-over";
  },

  /* ---------------- Image ---------------- */

  draw(){
    const L = GameManager.level; if (!L || !this.ctx) return;
    if (!(this.board.cell > 0) || !(this.W > 0) || !(this.H > 0)) return;
    const ctx = this.ctx, B = this.board, cell = B.cell;
    const R = Math.min(cell * 0.24, 10);
    ctx.clearRect(0, 0, this.W, this.H);
    this.buildLight();

    /* 1 — la zone encore à remplir : UNE SEULE silhouette, pas des
       tuiles indépendantes.

       Chaque case vide était auparavant rétrécie de 3 px sur TOUS ses
       côtés, y compris celui qui touche une pièce déjà posée : la case
       semblait donc se réduire au moment où on posait la pièce, et un
       écart sombre s'ouvrait le long de la facette. Ici la zone restante
       est traitée comme une forme unique, dont la frontière contre une
       pièce est exacte — aucun retrait, aucun écart. Un fin quadrillage
       intérieur conserve la lisibilité case par case. */
    const vide = k => !GameManager.isCovered(k);
    const restant = [], dejaTraite = new Set();
    L.target.forEach(k=>{
      if (!vide(k) || dejaTraite.has(k)) return;
      const p = k.split(","), c = +p[0], r = +p[1], t = p[2];
      if (t){
        /* Les deux moitiés encore libres : c'est une case pleine, on ne
           montre pas la découpe avant qu'une pièce y touche. */
        const jumelle = c+","+r+","+PieceManager.COMPLEMENT[t];
        if (L.target.has(jumelle) && vide(jumelle)){
          dejaTraite.add(k); dejaTraite.add(jumelle);
          restant.push({ c, r });
          return;
        }
        restant.push({ c, r, t });
      } else restant.push({ c, r });
    });

    const holes = new Path2D();
    const TC = GameManager.state.targetCells;
    this.outline(restant).forEach(loop=>{
      const pts = loop.map(q => [B.ox + q[0]*cell, B.oy + q[1]*cell]);
      /* Un sommet enfermé dans le motif borde une pièce posée : il reste
         vif pour que la frontière soit exacte. Les sommets exposés au
         fond gardent l'arrondi du jeu. */
      const vif = i => {
        const a = loop[i][0], b = loop[i][1];
        return TC.has((a-1)+","+(b-1)) && TC.has(a+","+(b-1))
            && TC.has((a-1)+","+b)     && TC.has(a+","+b);
      };
      this.roundedLoop(holes, pts, R * .7, vif);
    });

    /* Quadrillage intérieur : un trait fin sur chaque frontière entre
       deux cases encore libres, pour continuer à compter les cases. */
    const grille = new Path2D();
    const touche = (q, d) => PieceManager.edgesOf(q).includes(d);
    restant.forEach(q=>{
      const x = B.ox + q.c*cell, y = B.oy + q.r*cell;
      if (touche(q, "E") && restant.some(z => z.c===q.c+1 && z.r===q.r && touche(z, "W"))){
        grille.moveTo(x + cell, y); grille.lineTo(x + cell, y + cell);
      }
      if (touche(q, "S") && restant.some(z => z.c===q.c && z.r===q.r+1 && touche(z, "N"))){
        grille.moveTo(x, y + cell); grille.lineTo(x + cell, y + cell);
      }
    });
    ctx.fillStyle = "#1E2E3D"; ctx.fill(holes);

    /* 2 — la lumière tombe sur le plateau, et seulement là. */
    ctx.save();
    ctx.clip(holes);
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = .60;   /* plafonné : une case vide ne doit jamais passer
                                pour une pièce grise, même plateau très éclairé */
    ctx.drawImage(this.lightCv, 0, 0, this.W, this.H);
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = "rgba(174,214,206,.22)"; ctx.lineWidth = 1;
    ctx.stroke(holes);
    /* Le quadrillage intérieur est plus discret que le contour : il aide
       à compter sans redécouper la zone en tuiles séparées. */
    ctx.strokeStyle = "rgba(174,214,206,.11)";
    ctx.stroke(grille);
    ctx.restore();

    /* 3 — aperçu de position, sous les pièces.
       Cet aperçu ne s'affichait qu'aux emplacements VALIDES : il
       annonçait donc la bonne réponse. Mesuré sur 100 niveaux : une
       pièce contenant un triangle n'a que 4,2 emplacements possibles en
       moyenne (19 % n'en ont qu'un seul), contre 46,7 pour une pièce
       ordinaire. Balayer le plateau avec une pièce à facette revenait à
       lancer un solveur.
       Désormais l'aperçu montre simplement OÙ la pièce va tomber, dans
       une teinte neutre, valide ou non. La validité ne se découvre qu'au
       moment de lâcher — comme avec de vraies pièces sur une table.
       Le délai de maintien devient inutile : il ne servait qu'à freiner
       la révélation, l'aperçu peut redevenir immédiat. */
    const d = InputManager.drag;
    if (d){
      const gc = Math.round((d.x - B.ox) / cell), gr = Math.round((d.y - B.oy) / cell);
      const ox = B.ox + gc*cell, oy = B.oy + gr*cell;
      ctx.save();
      ctx.fillStyle = "rgba(234,255,247,.10)";
      ctx.strokeStyle = "rgba(234,255,247,.34)";
      ctx.lineWidth = 2; ctx.lineJoin = "round";
      /* Coins vifs, comme la pièce tenue juste au-dessus : sans ça,
         l'empreinte restait arrondie et ne coïncidait plus avec la
         forme qu'elle annonce. */
      const gp = this.outlinePath(d.piece.cells, ox, oy, cell, null, true);
      ctx.fill(gp); ctx.stroke(gp);
      ctx.restore();
    }

    /* 4 — pièces posées. Le recensement des sommets partagés se fait une
       seule fois par image, pas une fois par pièce : deux voisines
       doivent lire exactement la même liste, sinon l'une arrondirait un
       coin que l'autre garde vif. */
    /* Le recensement n'est calculé QUE s'il sert. Avec des coins vifs
       partout, le rayon vaut zéro avant même que cette logique
       intervienne : le calcul était intégralement perdu (mesuré : 17 %
       du temps de dessin). Invalidé à chaque image, il se recalcule à la
       première demande — donc jamais tant que le rendu reste anguleux,
       et correctement si l'arrondi revenait un jour. */
    this._partages = null;

    /* ÉCLAT DE RÉSOLUTION. Une seule nappe de lumière traverse la figure
       achevée, d'un bord à l'autre, toutes les pièces ENSEMBLE.

       Pourquoi pas pièce par pièce : la victoire allume déjà les pièces
       l'une après l'autre, décalées de 75 ms, et l'étoile s'envole à
       min(600, pièces × 75 + 120) ms. Un éclat calqué sur ce décalage
       finirait vers 1025 ms sur un niveau de huit pièces — il
       percuterait l'envol. Une nappe unique de 500 ms se termine avant.

       Pourquoi pas à la pose : un éclat qui ne s'allume que sur une pose
       correcte devient un oracle gratuit. Or l'indice, lui, coûte des
       points. Un joueur essayant les combinaisons obtiendrait la
       solution sans payer. À la résolution, le niveau est déjà gagné :
       plus rien à divulguer. */
    let eclat = null;
    if (this.eclatAt){
      const k = (performance.now() - this.eclatAt) / this.ECLAT_MS;
      if (k >= 1) this.eclatAt = 0;
      else {
        const n = Math.hypot(0.72, 0.69);
        const u = { x: 0.72/n, y: 0.69/n };
        const x1 = B.ox, y1 = B.oy;
        const x2 = B.ox + L.cols*cell, y2 = B.oy + L.rows*cell;
        const ss = [x1*u.x + y1*u.y, x2*u.x + y1*u.y, x1*u.x + y2*u.y, x2*u.x + y2*u.y];
        const smin = Math.min.apply(null, ss), smax = Math.max.apply(null, ss);
        const larg = Math.max(cell*0.9, (smax - smin) * 0.26);
        eclat = { u, larg, a: this.ECLAT_FORCE,
                  s: smin - larg + k * (smax - smin + 2*larg) };
      }
    }

    L.pieces.forEach(p=>{
      if (!p.placed || (d && d.piece === p)) return;
      this.piece(p.cells, B.ox + p.pos.c*cell, B.oy + p.pos.r*cell, cell, p.color,
        { origin: { c: p.pos.c, r: p.pos.r, settledAt: p.settledAt }, sharp:true, eclat });
    });

    /* 5 — réserve. */
    L.pieces.forEach(p=>{
      if (p.placed || (d && d.piece === p)) return;
      const sl = this.tray.slots[p.id]; if (!sl) return;
      this.piece(p.cells, sl.x, sl.y, this.tray.cell, p.color, { alpha:.95, sharp:true });
      /* PIÈCE FIGÉE : un appui ne la fera pas tourner. Sans marque
         visible, le joueur croirait à une panne du jeu. Trois petits
         points alignés sur sa première case — discret, mais constant,
         et lisible sans couleur (donc sans dépendre de la vue des
         couleurs du joueur). */
      if (p.fige){
        const tc = this.tray.cell;
        const cx = sl.x + (p.cells[0].c + .5) * tc, cy = sl.y + (p.cells[0].r + .5) * tc;
        ctx.save();
        ctx.fillStyle = "rgba(12,18,24,.62)";
        for (let i = -1; i <= 1; i++){
          ctx.beginPath();
          ctx.arc(cx + i * tc * .20, cy, Math.max(1.2, tc * .058), 0, Math.PI*2);
          ctx.fill();
        }
        ctx.restore();
      }
    });

    /* 5bis — GESTE D'ACCUEIL : un disque de contact glisse sur la
       première pièce, une seule fois, pour montrer qu'on la déplace au
       doigt. Purement dessiné sur le canevas : aucune zone tactile
       n'existe ici, donc il ne peut jamais gêner un vrai geste.

       Boucle en cloche (va, revient, se répète) : mesuré sur le
       prototype, un aller simple suggérait une direction de pose
       précise, ce qui serait un mensonge visuel pour la plupart des
       niveaux. La cloche dit seulement « ceci se déplace », sans dire
       où. S'efface pour de bon dès le premier contact du joueur, où
       qu'il touche — voir InputManager.onDown. */
    if (this.gesteAccueil && performance.now() >= this.gesteAccueil.debut){
      const g = this.gesteAccueil, p = g.piece;
      const sl = this.tray.slots[p.id];
      if (!sl || p.placed){
        this.gesteAccueil = null;
      } else {
        const dt = performance.now() - g.debut;
        const PERIODE = 2100;
        const boucle = (dt % PERIODE) / PERIODE;
        /* Trois boucles puis silence : au-delà, une animation qui ne
           s'arrête jamais devient un tic agaçant plutôt qu'une aide. */
        if (dt < PERIODE * 3){
          /* Mouvement VERS LE HAUT (Fabien, 10 oct.) : la main part de la
             pièce et monte jusqu'au bord du plateau, puis s'efface et
             recommence. Elle dit « glisse ta pièce vers le plateau » sans
             désigner de case précise : elle s'arrête juste à l'entrée de
             la grille, jamais sur l'emplacement de la solution. */
          const tc = this.tray.cell;
          const cx = sl.x + (p.cells[0].c + 0.6) * tc;
          const y0 = sl.y + (p.cells[0].r + 0.6) * tc;
          const L = GameManager.level;
          const yHaut = L ? this.board.oy + L.rows * this.board.cell - this.board.cell * 0.55 : y0 - tc * 3;
          const t = Math.min(1, boucle / 0.72);
          const phase = t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;   // départ et arrivée en douceur
          const cy = y0 + (Math.min(yHaut, y0) - y0) * phase;
          const visible = Math.min(1, boucle / 0.08) * (boucle > 0.78 ? Math.max(0, 1 - (boucle - 0.78) / 0.18) : 1);
          const bord = visible * Math.min(1, dt/280) * Math.min(1, (PERIODE*3 - dt)/280);
          /* MAIN 👆 (demande de Fabien, 10 oct.) : le disque blanc seul
             ne se lisait pas comme « mets ton doigt ici ». On garde une
             petite onde de contact sous le bout de l'index, et on dessine
             la main (emoji Noto, licence OFL) qui pend sous ce point,
             exactement comme dans les Shorts. Repli : si l'image n'est
             pas encore décodée, l'ancien disque reste affiché. */
          const r = tc * 0.22;
          const img = MAIN_ACCUEIL;
          /* PIÈCE FANTÔME (Fabien, 10 oct.) : une copie translucide de la
             pièce monte avec la main, en grandissant jusqu'à la taille des
             cases du plateau, comme une vraie pièce tenue au doigt. La
             vraie pièce reste dans la réserve. Orientation de la réserve
             conservée : le fantôme ne révèle jamais le sens de pose. */
          if (bord > 0.01){
            const bc = this.board.cell;
            const k = tc + (bc - tc) * phase;
            const ox = cx - (p.cells[0].c + 0.6) * k, oy = cy - (p.cells[0].r + 0.6) * k;
            this.piece(p.cells, ox, oy, k, p.color, { lift: phase > 0.02, sharp:true, alpha: bord * 0.62 });
          }
          ctx.save();
          const onde = 0.5 + 0.5 * Math.sin(dt / 190);
          for (let h = r*(1.6 + onde*0.5); h > r*0.6; h -= 2){
            const a = bord * 0.22 * (1 - (h - r*0.6)/(r*1.4));
            if (a <= 0) continue;
            ctx.beginPath(); ctx.arc(cx, cy, h, 0, Math.PI*2);
            ctx.fillStyle = `rgba(255,255,255,${a})`;
            ctx.fill();
          }
          if (img && img.complete && img.naturalWidth){
            const H = tc * 1.9, k = H / img.naturalHeight;
            ctx.globalAlpha = bord;
            ctx.shadowColor = "rgba(0,0,0,.45)"; ctx.shadowBlur = tc * 0.35; ctx.shadowOffsetY = tc * 0.12;
            /* bout de l'index : (39, 0) dans l'image */
            ctx.drawImage(img, cx - 39 * k, cy - 2 * k, img.naturalWidth * k, H);
          } else {
            ctx.beginPath(); ctx.arc(cx, cy, tc*0.34, 0, Math.PI*2);
            ctx.fillStyle = `rgba(255,255,255,${bord*0.90})`;
            ctx.fill();
          }
          ctx.restore();
        } else {
          this.gesteAccueil = null;
        }
      }
    }

    /* 6 — pièce tenue par le doigt. */
    if (d) this.piece(d.piece.cells, d.x, d.y, cell, d.piece.color, { lift:true, sharp:true });

    /* 7 — étoile en partance : au moment où une nouvelle étoile du Ciel
       vient d'être gagnée, un point de lumière quitte le plateau vers le
       haut, comme s'il rejoignait sa place dans une constellation.
       Trois temps : elle déchire d'abord le puzzle en éclatant largement
       (jaillissement + étincelles qui giclent), puis scintille sur place
       un instant — la « libération » —, et seulement alors s'élève,
       lentement d'abord, prenant de l'élan.

       Version précédente jugée décevante : un simple disque blanc plat,
       sans scintillement — ça ressemblait à un rond mal fini, pas à une
       étoile. Remplacé par une vraie forme à quatre branches effilées
       (+ quatre plus fines en diagonale), avec un cœur à bords doux —
       jamais de cercle à bord net — et les étincelles de la déchirure
       sont désormais de petits traits qui giclent, pas des points.

       Dessiné en pleine résolution, pas dans le calque de lumière flou :
       ce doit être un point net qui se détache, pas une lueur de plus. */
    if (this.risingStars.length){
      const now = performance.now();
      this.risingStars = this.risingStars.filter(s => now - s.t < s.life);
      this.risingStars.forEach(s=>{
        const k = (now - s.t) / s.life;
        let taille, monte, alpha;
        if (k < .15){
          const t = k / .15;
          taille = t < .5 ? t * 2.3 : 1.15 - (t - .5) * .3;
          monte = 0;
          alpha = Math.min(1, t * 3);
        } else if (k < .38){
          const t = (k - .15) / .23;
          taille = 1 + Math.sin(t * Math.PI * 5) * .09;
          monte = 0;
          alpha = 1;
        } else {
          const t = (k - .38) / .62;
          monte = t * t;
          taille = 1 - Math.min(1, t) * .6;
          alpha = t > .62 ? Math.max(0, 1 - (t - .62) / .38) : 1;
        }
        if (alpha <= 0) return;
        const y = s.y - monte * Math.max(260, this.H * 0.6);
        const x = s.x + Math.sin(k * Math.PI * 1.1) * 16;

        /* Étincelles de la déchirure : de petits traits effilés qui
           giclent puis s'effacent, pas de simples points. Une planète
           en a moins et de plus discrètes — elle ne scintille pas,
           elle émerge. */
        if (k < .3 && s.eclats){
          const ea = Math.max(0, 1 - k / .3) * (s.planete ? .5 : 1);
          ctx.save(); ctx.fillStyle = "#F4FFFA"; ctx.globalAlpha = ea * .9;
          s.eclats.forEach(e=>{
            const d = e.dist * Math.min(1, k / .14);
            const ex = s.x + Math.cos(e.angle) * d, ey = s.y + Math.sin(e.angle) * d;
            const dx = Math.cos(e.angle), dy = Math.sin(e.angle), px = -dy, py = dx;
            const L = e.longueur;
            ctx.beginPath();
            ctx.moveTo(ex - px*2, ey - py*2);
            ctx.lineTo(ex + dx*L, ey + dy*L);
            ctx.lineTo(ex + px*2, ey + py*2);
            ctx.closePath(); ctx.fill();
          });
          ctx.restore();
        }

        if (s.planete) this.planetSphere(ctx, x, y, taille, s.color, alpha, s.geante);
        else this.starFlare(ctx, x, y, taille, s.color, alpha, k * 40);
      });
    }

    /* 8 — halo général : c'est lui qui donne l'impression de lumière réelle. */
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = .26;
    ctx.drawImage(this.lightCv, 0, 0, this.W, this.H);
    ctx.restore();
  },

  /** Case d'accroche valide pour la pièce déplacée, sinon null. */
  snapTarget(d){
    const B = this.board;
    const c = Math.round((d.x - B.ox) / B.cell), r = Math.round((d.y - B.oy) / B.cell);
    return PieceManager.canPlace(GameManager.state, d.piece, c, r) ? { c, r } : null;
  }
};

/* ------------------------------------------------------------------
   InputManager — tactile : glisser-déposer, appui pour tourner / retirer
   ------------------------------------------------------------------ */
/* ============================================================
   InputManager — gestes sur le plateau de jeu
   ------------------------------------------------------------
   Rôle    : saisir, déplacer, tourner et poser une pièce.
   Expose  : init(), onDown(), onMove(), onUp(), cancel().
   Dépend  : Renderer, GameManager.
   Piège   : un SEUL doigt à la fois est suivi — un second contact
             est ignoré, sinon la pièce saute d'un doigt à l'autre.
   ============================================================ */
const InputManager = {
  drag:null, down:null,

  init(){
    const cv = Renderer.cv;
    cv.addEventListener("pointerdown", e => this.onDown(e));
    cv.addEventListener("pointermove", e => this.onMove(e));
    cv.addEventListener("pointerup",   e => this.onUp(e));
    cv.addEventListener("pointercancel", ()=> this.cancel());
  },

  pos(e){
    const r = Renderer.cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  },

  /** Quelle pièce se trouve sous le doigt ? */
  hit(x, y){
    const L = GameManager.level, B = Renderer.board, Tr = Renderer.tray;
    for (const p of L.pieces){                       // d'abord la réserve (au-dessus)
      if (p.placed) continue;
      const s = Tr.slots[p.id]; if (!s) continue;
      const m = 10;   /* marge de saisie : la cible tactile dépasse le dessin */
      if (x >= s.x - m && x <= s.x + s.w + m && y >= s.y - m && y <= s.y + s.h + m) return { piece:p, from:"tray" };
    }
    const c = Math.floor((x - B.ox) / B.cell), r = Math.floor((y - B.oy) / B.cell);
    let owner = GameManager.state.occupied.get(c+","+r);
    if (owner === undefined){
      /* La case est peut-être scindée en deux triangles : on détermine
         précisément laquelle des deux moitiés le doigt touche, plutôt
         que de s'arrêter à "quelque chose occupe cette case". */
      const lx = (x - (B.ox + c*B.cell)) / B.cell, ly = (y - (B.oy + r*B.cell)) / B.cell;
      for (const t of ["TL","TR","BR","BL"]){
        if (Renderer.pointInTri(lx, ly, t)){
          owner = GameManager.state.occupied.get(c+","+r+","+t);
          if (owner !== undefined) break;
        }
      }
    }
    if (owner !== undefined) return { piece: L.pieces[owner], from:"board" };
    return null;
  },

  onDown(e){
    if (!GameManager.running) return;
    /* Le premier contact, quel qu'il soit, efface le geste d'accueil.
       Il ne doit pas falloir toucher PRÉCISÉMENT la pièce démontrée :
       un joueur qui explore ailleurs a déjà compris qu'on peut toucher
       l'écran, la démonstration n'a plus rien à lui apprendre. */
    if (Renderer.gesteAccueil) Renderer.gesteAccueil = null;
    /* Un seul doigt à la fois. Sans ce garde-fou, un second contact —
       un pouce qui traîne, la paume, un appui simultané — écrasait le
       geste en cours : la pièce tenue restait en l'air et le glisser
       partait sur une autre. Les doigts suivants sont ignorés jusqu'à
       ce que le premier ait relâché. */
    if (this.pointerId !== null && this.pointerId !== undefined) return;
    Audio_.ensure();
    const { x, y } = this.pos(e);
    const h = this.hit(x, y);
    if (!h) return;
    this.pointerId = e.pointerId;
    Renderer.cv.setPointerCapture(e.pointerId);
    this.down = { ...h, x, y, t: performance.now(), moved:false };
  },

  onMove(e){
    if (e.pointerId !== this.pointerId) return;   /* un autre doigt : ignoré */
    if (!this.down) return;
    const { x, y } = this.pos(e);
    if (!this.drag){
      if (Math.hypot(x - this.down.x, y - this.down.y) < 8) return;
      this.down.moved = true;
      const p = this.down.piece, B = Renderer.board;
      const s = PieceManager.size(p.cells);
      if (p.placed){
        this.origin = { ...p.pos };
        /* Reprise : une pièce déjà posée qu'on soulève pour la remettre
           ailleurs. C'est la mesure d'hésitation qui remplace l'ancien
           comptage d'erreurs, devenu inopérant. */
        GameManager.repositions++;
        GameManager.remove(p);
      } else this.origin = null;
      /* La pièce remonte au-dessus du doigt. Le dégagement se mesure
         depuis le BAS de la pièce, jamais depuis son centre : mesuré
         depuis le centre, une pièce haute de 4 cases à 28px avait son
         centre à 56px — au-delà du décalage lui-même — et le doigt se
         retrouvait à l'intérieur de la pièce, sans aucun dégagement.
         Ici l'écart entre le doigt et le bas de la pièce est constant,
         quelles que soient la hauteur de la pièce et la taille des cases. */
      const gap = Math.max(B.cell * 0.5, 46);
      this.drag = { piece:p, from:this.down.from, dx: -s.w*B.cell/2, dy: -s.h*B.cell - gap, x:0, y:0 };
    }
    this.drag.x = x + this.drag.dx;
    this.drag.y = y + this.drag.dy;
    Renderer.draw();
  },

  onUp(e){
    if (e.pointerId !== this.pointerId) return;   /* un autre doigt : ignoré */
    this.pointerId = null;
    const d = this.drag, dn = this.down;
    this.drag = null; this.down = null;
    if (!dn) return;

    /* Appui simple : tourner, dans la réserve comme sur le plateau — un
       seul geste, sans délai. Retirer une pièce posée se fait désormais
       en la faisant glisser jusque dans la réserve (voir plus bas) : le
       tapotement n'a donc plus qu'un seul sens partout, ce qui est plus
       net que le compromis à double-tapotement essayé un peu plus tôt. */
    if (!d){
      const p = dn.piece;
      if (dn.from === "tray"){
        /* Pièce figée : turn() refuse. Sans retour, l'appui paraîtrait
           simplement cassé — on le dit une fois, brièvement. */
        if (p.fige){ UIManager.toast(T("piece_figee")); buzz(6); return; }
        GameManager.turn(p); GameManager.push({type:"rotate", id:p.id}); Audio_.turn(); buzz(8);
        Renderer.layout();
        const sl = Renderer.tray.slots[p.id];
        if (sl) Renderer.emit(sl.x + sl.w/2, sl.y + sl.h/2, p.color,
          { life:420, max: Renderer.tray.cell * 3.4, w: Renderer.tray.cell * .42, a:.7 });
      } else {
        /* Demandé par un testeur : tourner une pièce posée, sans la
           reprendre en main. turn() refuse explicitement toute pièce
           posée (voir son commentaire), pour ne jamais laisser la
           grille d'occupation avec des cases fantômes — donc on ne le
           contourne pas : on retire proprement, on tourne, on retente
           la pose au même endroit (voir tournerSurPlace ci-dessous). */
        this.tournerSurPlace(p);
      }
      return;
    }

    /* Dépose. */
    const g = Renderer.snapTarget(d);
    if (g){
      GameManager.place(d.piece, g.c, g.r);
      GameManager.push(this.origin ? {type:"move", id:d.piece.id, pos:this.origin} : {type:"place", id:d.piece.id});
      this.origin = null;
      Renderer.layout();
      GameManager.checkWin();
      return;
    }

    /* Hors cible. Une pièce venue du plateau (this.origin) a déjà été
       retirée de la grille dès le début du glissement (voir onMove) :
       il ne reste qu'à décider si elle revient à sa place ou part pour
       de bon dans la réserve.

       Signalé par un testeur : avec un simple point de test (le coin de
       la pièce le plus loin du doigt), une GRANDE pièce devait être
       glissée bien plus bas qu'une petite avant d'être reconnue "hors
       du plateau" — ce coin reste visuellement au-dessus de la zone
       longtemps après que le reste de la pièce l'ait quittée. On
       raisonne donc en SURFACE qui dépasse, pas en un seul point : la
       pièce est retirée dès qu'elle a trois quarts sortis du plateau,
       quelle que soit sa taille. */
    const fraction = this.chevauchementPlateau(d.x, d.y, d.piece);
    if (this.origin){
      if (fraction >= 0.25){
        /* Encore assez sur le plateau : repose ratée (collision, case
           occupée), revient exactement où elle était. */
        GameManager.place(d.piece, this.origin.c, this.origin.r, true);
      } else {
        /* Trois quarts sortis ou plus : retrait définitif vers la réserve. */
        const B = Renderer.board, pos = this.origin, s = PieceManager.size(d.piece.cells);
        GameManager.push({type:"remove", id:d.piece.id, pos});
        Audio_.turn();
        Renderer.emit(B.ox + (pos.c + s.w/2) * B.cell, B.oy + (pos.r + s.h/2) * B.cell, d.piece.color,
          { life:480, max: B.cell * 3.6, w: B.cell * .45, a:.55 });
      }
      this.origin = null;
    } else if (fraction > 0){
      /* Pièce de réserve visant le plateau (au moins un chevauchement)
         mais relâchée sur une case déjà occupée : seul cas où une
         erreur est comptée — elle n'était pas encore posée. */
      GameManager.errors++; Audio_.error(); buzz(30);
    }
    Renderer.layout();
  },

  /** Fraction (0 à 1) de la pièce en cours de glissement qui chevauche
      encore le plateau. `x, y` est le coin de la pièce le plus loin du
      doigt (voir onMove) ; PieceManager.size() donne sa largeur et sa
      hauteur en cases. Une aire, pas un point : le résultat ne dépend
      donc pas de la taille de la pièce. */
  chevauchementPlateau(x, y, piece){
    const B = Renderer.board, L = GameManager.level, s = PieceManager.size(piece.cells);
    const pw = s.w * B.cell, ph = s.h * B.cell;
    const gx = Math.max(0, Math.min(x + pw, B.ox + L.cols*B.cell) - Math.max(x, B.ox));
    const gy = Math.max(0, Math.min(y + ph, B.oy + L.rows*B.cell) - Math.max(y, B.oy));
    const airePiece = pw * ph;
    return airePiece > 0 ? (gx * gy) / airePiece : 0;
  },

  /** Tourne une pièce déjà posée, SANS toucher à la garde de turn().
      Retire, tourne, retente la pose au même point d'ancrage. Si la
      nouvelle orientation ne rentre plus ici (bordure, pièce voisine),
      on revient exactement à l'état de départ — jamais de pièce perdue
      ou dupliquée. */
  tournerSurPlace(p){
    if (p.fige){ UIManager.toast(T("piece_figee")); buzz(6); return; }
    const B = Renderer.board, pos = { ...p.pos };
    GameManager.remove(p);
    GameManager.turn(p);
    if (GameManager.place(p, pos.c, pos.r, true)){
      GameManager.push({ type:"rotate-board", id:p.id, pos });
      Audio_.turn(); buzz(8);
      const s = PieceManager.size(p.cells);
      Renderer.emitFromPiece(p, pos.c, pos.r);
      Renderer.layout();
      GameManager.checkWin();
    } else {
      /* Ne rentre pas dans cette orientation à cet endroit : trois
         tours de plus ramènent exactement à la forme de départ (turn()
         boucle sur 4 états), puis on repose là où la pièce était. */
      GameManager.turn(p); GameManager.turn(p); GameManager.turn(p);
      GameManager.place(p, pos.c, pos.r, true);
      UIManager.toast(T("piece_bloquee"));
      buzz(6);
      Renderer.layout();
    }
  },

  cancel(){
    if (this.drag && this.origin) GameManager.place(this.drag.piece, this.origin.c, this.origin.r, true);
    this.drag = null; this.down = null; this.origin = null; this.pointerId = null;
    Renderer.layout();
  }
};

/* ------------------------------------------------------------------
   UIManager — navigation entre écrans, menus, chronomètre
   ------------------------------------------------------------------ */
/* ============================================================
   UIManager — écrans, navigation et widgets
   ------------------------------------------------------------
   Rôle    : bascule entre écrans, liste des niveaux, boutique,
             réglages, messages, confirmations, popups.
   Expose  : show(id), buildLevels(), message(), confirm(),
             toast(), winPop(), showGame(), syncTheme().
   Dépend  : SaveManager, GameManager, LevelManager, I18N.
   Piège   : toute action DESTRUCTRICE (remise à zéro) doit passer
             par confirm(), qui annonce ce qui sera perdu AVANT
             d'agir — jamais un « c'est fait » après coup.
   ============================================================ */
const UIManager = {
  show(id){
    document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
    if (id === "s-game") requestAnimationFrame(()=> Renderer.layout());
    /* Le moteur peut se désactiver EN COURS de partie — perte de
       contexte, rendu jugé invalide. Le diagnostic doit donc refléter
       l'état du moment, pas celui du démarrage. */
    if (id === "s-settings") this.syncMoteur();
  },
  demoWall(){
    const ok = document.getElementById("msg-ok"), no = document.getElementById("msg-no");
    const t = document.getElementById("msg-title");
    t.textContent = DT("titre"); t.style.display = "";
    document.getElementById("msg-text").textContent = DT("msg");
    ok.textContent = DT("go");
    ok.onclick = ()=>{ ok.onclick = null; no.onclick = null; window.open(DEMO_LIEN, "_blank", "noopener"); };
    no.textContent = DT("non"); no.style.display = "";
    no.onclick = ()=>{ no.style.display = "none"; no.onclick = null; ok.onclick = null;
      document.getElementById("ov-msg").classList.remove("on"); };
    document.getElementById("ov-msg").classList.add("on");
  },
  message(text){
    const t = document.getElementById("msg-title");
    if (t){ t.textContent = ""; t.style.display = "none"; }
    document.getElementById("msg-text").textContent = text;
    document.getElementById("msg-ok").textContent = "OK";
    document.getElementById("msg-no").style.display = "none";
    document.getElementById("ov-msg").classList.add("on");
  },
  /** Demande avant d'agir. `ouiLabel` est volontairement explicite plutôt
      qu'un « OK » : on doit lire ce qu'on s'apprête à faire. Le bouton
      qui n'engage à rien reste le plus visible, l'action destructrice
      est en retrait — l'inverse conduit à confirmer par réflexe. */
  /* `titre` est optionnel : les messages courants gardent leur forme
     d'origine, seules les actions graves reçoivent un titre séparé —
     une question claire d'abord, la conséquence ensuite. */
  /* `labelSur` = texte du bouton principal, celui qui ne détruit rien.
     Il valait toujours « Non, garder », ce qui n'a de sens que devant
     une question. Signalé par Fabien : après la réinitialisation, le
     jeu affichait « Progression effacée. » surmontée d'un gros bouton
     « Non, garder » — alors qu'il n'y avait justement plus rien à
     garder. Le libellé est donc désormais adaptable au contexte. */
  confirm(text, ouiLabel, onOui, titre, labelSur){
    const ok = document.getElementById("msg-ok"), no = document.getElementById("msg-no");
    const t = document.getElementById("msg-title");
    t.textContent = titre || "";
    t.style.display = titre ? "" : "none";
    document.getElementById("msg-text").textContent = text;
    ok.textContent = labelSur || T("cancel");
    no.textContent = ouiLabel;
    no.style.display = "";
    ok.onclick = null;
    no.onclick = ()=>{
      no.style.display = "none"; no.onclick = null;
      document.getElementById("ov-msg").classList.remove("on");
      onOui();
    };
    document.getElementById("ov-msg").classList.add("on");
  },
  /** Le palier de diamants ENCORE ATTEIGNABLE, à cet instant précis.

      Demandé par Fabien : la ligne annonçait « ◆◆◆ avant 0:34 » même
      une fois le délai dépassé. Elle promettait donc une récompense
      déjà perdue. Elle suit désormais l'état réel et rétrograde d'un
      cran à chaque seuil franchi.

      Elle corrige au passage un défaut que je n'avais pas vu : trois
      diamants exigent aussi de ne pas déplacer plus de trois fois une
      pièce déjà posée. Un joueur pouvait donc rester dans les temps,
      voir « ◆◆◆ » affiché, et découvrir deux diamants à l'arrivée.
      Les deux conditions sont maintenant prises en compte.

      Le palier le plus bas n'affiche aucun délai : un diamant est
      acquis dès que le niveau est terminé sans indice, il n'y a plus
      rien à courir. */
  palierActuel(){
    const g = GameManager, L = g.level;
    if (!L) return "";
    if (g.hints > 0) return T("par_0");                    // un indice annule tout
    const s = Math.floor(g.elapsed / 1000);
    if (g.repositions <= 3 && s <= L.parTime)
      return T("par_3").replace("%c", fmt(L.parTime));
    const limite2 = Math.round(L.parTime * 2.2);
    if (s <= limite2) return T("par_2").replace("%c", fmt(limite2));
    return T("par_1");
  },
  /** Reconstruit la ligne discrète : palier, score et diamants restants.
      Appelée à chaque seconde écoulée — le score y est donc juste lui
      aussi, y compris après une ponction d'indice. */
  majLigneJeu(){
    const L = GameManager.level;
    if (!L) return;
    /* Chaque morceau est insécable — vu sur capture de Fabien
       (25 sept.) : « ◆◆ AVANT » en fin de ligne et « 1:17 » seul sur
       la suivante. La ligne ne se coupe plus qu'ENTRE deux morceaux,
       au point médian, jamais au milieu d'un palier. */
    const esc = m => String(m).replace(/&/g, "&amp;").replace(/</g, "&lt;");
    document.getElementById("g-tier").innerHTML =
      [T(L.tier), fmtScore(SaveManager.data.score) + " pts", this.palierActuel()]
        .map(m => '<span class="insec">' + esc(m) + "</span>").join("  ·  ");
  },
  showGame(){
    const L = GameManager.level;
    document.getElementById("g-level").textContent = T("level") + " " + L.n;
    /* Le score total, visible EN JEU — signalé par une revue : les
       indices retirent des points de ce total (règle voulue par
       Fabien), mais le joueur ne le voyait que sur l'accueil, jamais
       au moment où il décide de prendre un indice. Affiché à côté du
       palier, sur la même ligne discrète, pour ne pas concurrencer le
       chronomètre ni le numéro de niveau. */
    this.majLigneJeu();
    this.show("s-game");
  },
  /** Le niveau atteint et le score cumulé, sous le bouton Jouer : à jour
      dès qu'on revient au menu, jamais un chiffre figé depuis le
      lancement. C'est ce qui montre, d'un coup d'œil, qu'il n'y a pas
      de fin — juste une reprise exactement là où on s'était arrêté. */
  syncPlayProgress(){
    document.getElementById("play-progress").textContent =
      T("play_progress").replace("%n", SaveManager.data.unlocked)
                        .replace("%p", fmtScore(SaveManager.data.score))
                        .replace("%d", SaveManager.totalStars());
  },
  /** Un mot bref, non bloquant, qui apparaît et s'efface tout seul —
      le même témoin que celui des victoires, mais pour une simple
      confirmation textuelle. Jamais rien à toucher pour le faire
      disparaître. */
  toast(text){
    const pop = document.getElementById("win-pop");
    pop.innerHTML = '<div class="wp">' + text + '</div>';
    pop.classList.remove("rise"); void pop.offsetWidth; pop.classList.add("rise");
  },
  /** Le retour de victoire : un flash d'étoiles et de points, jamais un
      bouton à toucher. Le niveau suivant s'enchaîne juste après, sans
      geste requis — c'était le seul but du bouton "suivant" de toute
      façon, autant se passer du détour. */
  winPop(stars, gained, dejaAcquis){
    const pop = document.getElementById("win-pop");
    /* Zéro étoile et zéro point n'arrivent que dans un seul cas — un
       niveau résolu entièrement aux indices, sans une seule pose de la
       main du joueur (voir checkWin). Sans ce mot, ça ressemblerait à
       un bug plutôt qu'à une règle assumée. */
    const explication = (stars === 0 && gained === 0)
      ? '<div class="wp" style="opacity:.75;font-weight:400">' + T("hint_only_msg") + '</div>'
      /* « +0 » seul ressemblerait à un bug : on dit la règle. */
      : dejaAcquis ? '<div class="wp" style="opacity:.75;font-weight:400;font-size:12px">'
                     + T("replay_msg") + (dejaAcquis === "mieux" ? '<br>' + T("replay_faster") : '') + '</div>' : '';
    pop.innerHTML =
      '<div class="ws">' + DIAMANTS(stars) + '</div>'
      + '<div class="wp">+' + fmtScore(gained) + '</div>' + explication;
    pop.classList.remove("rise"); void pop.offsetWidth; pop.classList.add("rise");

    /* Garde de sécurité : si le joueur a quitté l'écran de jeu, relancé
       le niveau, ou déjà avancé par un autre chemin pendant ce court
       délai, ce passage automatique ne fait plus rien — plutôt que de
       le rattraper en arrière-plan et le ramener où il ne voulait plus
       être. */
    const solvedN = GameManager.level.n;
    this.cancelAutoNext();
    this._autoNext = setTimeout(()=>{
      if (document.getElementById("s-game").classList.contains("on")
          && GameManager.level && GameManager.level.n === solvedN && !GameManager.running){
        GameManager.start(solvedN + 1);
      }
    }, 1150);
  },
  cancelAutoNext(){ clearTimeout(this._autoNext); this._autoNext = null; },
  buildLevels(){
    const wrap = document.getElementById("lv-list");
    wrap.innerHTML = "";
    const tiers = LevelManager.tierRanges();
    /* Les niveaux générés au-delà de la campagne n'apparaissent qu'une
       fois atteints : inutile d'afficher une grille infinie à quelqu'un
       qui n'y est pas encore. */
    const atteint = SaveManager.data.unlocked;
    if (atteint > LevelManager.TOTAL){
      /* On montre jusqu'au niveau atteint, plus quelques-uns devant. */
      tiers.push(["t_beyond", LevelManager.TOTAL + 1, atteint + 4]);
    }
    tiers.forEach(([key, a, b])=>{
      const h = document.createElement("div"); h.className = "tierhead"; h.textContent = T(key);
      wrap.appendChild(h);
