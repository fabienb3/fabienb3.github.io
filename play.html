      const grid = document.createElement("div"); grid.className = "levels";
      for (let n = a; n <= b; n++){
        const st = SaveManager.stars(n), open = SaveManager.isUnlocked(n), fait = SaveManager.completed(n);
        const el = document.createElement("button");
        const classeNote = st ? " s" + st : (fait ? " s0" : "");
        el.className = "lvl" + (open ? "" : " locked") + classeNote;
        /* Résolu aux indices (0 étoile) : sans ce cas, ce niveau
           paraissait identique à un niveau jamais tenté — trois
           étoiles vides valent mieux qu'une absence totale de signe. */
        const etoiles = fait
          ? DIAMANTS(st)
          : "";
        el.innerHTML = (open ? n : "🔒") + '<span class="st">' + etoiles + "</span>";
        el.onclick = ()=> open ? (GameManager.cameFrom = "s-levels", GameManager.start(n))
          : (n > LevelManager.TOTAL && !SaveManager.data.allUnlocked) ? MonetizationManager.showWall()
          : this.message(T("locked"));
        grid.appendChild(el);
      }
      wrap.appendChild(grid);
    });
    /* Signalé par Fabien : l'en-tête annonçait « Niveau 175 atteint »
       alors que la plupart des niveaux n'avaient jamais été joués. Une
       fois le déblocage acheté, on ouvre le niveau que l'on veut — le
       plus haut NUMÉRO ouvert ne dit donc rien de la progression
       réelle, exactement le même travers que celui corrigé sur les
       étoiles du Ciel. On compte désormais les niveaux réellement
       résolus, ce qui est vrai dans tous les cas de figure. */
    document.getElementById("lv-progress").textContent =
      T("progress").replace("%n", Object.keys(SaveManager.data.stars).length)
                   .replace("%d", SaveManager.totalStars());
  },
  bindShop(){
    const b = document.getElementById("buy-unlock");
    if (b && b.tagName === "BUTTON") b.onclick = ()=> MonetizationManager.acheter();
  },
  /* Le sélecteur de thème affiche le thème courant et tourne d'un thème
     à l'autre. Sans le pack, il reste visible mais renvoie vers la
     Boutique plutôt que de disparaître : on sait ce qui existe. */
  /* Signalé par Fabien, capture à l'appui : en passant l'interface en
     espagnol, le bouton Difficulté restait sur « Gentle » et celui de
     l'ambiance sur « Forêt ». I18N.apply() ne réécrit que les textes
     marqués dans le HTML ; ceux que le code pose lui-même — difficulté,
     ambiance, thème — lui échappaient complètement. On les resynchronise
     donc explicitement à chaque changement de langue. */
  syncLang(){
    I18N.apply();
    this.syncMode();
    this.syncAmbiance();
    this.syncTheme();
  },
  syncTheme(){
    const b = document.getElementById("b-theme");
    if (!b) return;
    b.textContent = T("th_" + SaveManager.data.theme);
  },
  /* Les thèmes sont libres. Ils avaient été envisagés comme un achat :
     deux palettes de couleurs contre de l'argent, c'était trop peu pour
     un jeu dont la fiche promet de ne rien imposer — le genre de
     détail qui se paie en commentaires, pas en revenus. */
  cycleTheme(){
    const noms = Object.keys(THEMES);
    const i = noms.indexOf(SaveManager.data.theme);
    SaveManager.data.theme = noms[(i + 1) % noms.length];
    SaveManager.save();
    applyTheme(SaveManager.data.theme);
    this.syncTheme();
    if (document.getElementById("s-game").classList.contains("on")) Renderer.draw();
  },
  syncAmbiance(){
    const b = document.getElementById("b-ambiance");
    if (b) b.textContent = T("amb_" + SaveManager.data.ambiance);
  },
  /** Change l'ambiance sonore — demandé par Fabien : « des sons
      apaisants, des bruits de la nature » en plus de la mélodie
      existante. Si une ambiance joue déjà, on la relance aussitôt avec
      le nouveau choix, pour que basculer se sente immédiat plutôt que
      de devoir quitter l'écran et y revenir. */
  cycleAmbiance(){
    /* « Aucune » remplace l'ancien interrupteur Musique, retiré de l'écran :
       un seul réglage pour choisir l'ambiance OU le silence, au lieu de
       deux contrôles qui se marchaient dessus. */
    const noms = ["melodie", "vent", "ruisseau", "foret", "aucune"];
    const i = noms.indexOf(SaveManager.data.ambiance);
    SaveManager.data.ambiance = noms[(i + 1) % noms.length];
    SaveManager.save();
    this.syncAmbiance();
    if (SaveManager.data.music){ Audio_.stopMusic(); Audio_.startMusic(); }
  },
  /* Le mode se change à tout moment. Les niveaux DÉJÀ résolus gardent
     leurs étoiles : la progression est partagée entre les trois modes,
     seule change la difficulté des puzzles servis ensuite. */
  cycleMode(){
    SaveManager.data.mode = (SaveManager.data.mode % 3) + 1;
    LevelManager.modeCourant = SaveManager.data.mode;
    SaveManager.save();
    this.syncMode();
    this.buildLevels();
    this.message(T("mode_change").replace("%s", T("mode_" + SaveManager.data.mode)));
  },
  /** Met les relevés locaux à plat, dans un texte que le testeur peut
      copier ou partager. Format volontairement simple : une ligne
      d'en-tête et une ligne par niveau, lisible tel quel comme
      exploitable dans un tableur.

      OUTIL DE TEST FERMÉ, pas une fonction de jeu (voir le bouton dans
      les Paramètres) : à retirer avant la publication en production. */
  exporterStats(){
    const d = SaveManager.data, st = d.stats || {};
    const niveaux = Object.keys(st).map(Number).sort((a,b)=>a-b);
    if (!niveaux.length){ this.message(T("stats_vide")); return; }
    const lignes = ["niveau;secondes;indices;essais;ouvertures;mode"];
    let totalSec = 0, totalInd = 0, abandons = 0;
    niveaux.forEach(n=>{
      const s = st[n];
      const ouvertures = s.o || 0, essais = s.e || 0;
      abandons += Math.max(0, ouvertures - essais);
      totalSec += s.s || 0; totalInd += s.i || 0;
      lignes.push([n, s.s||0, s.i||0, essais, ouvertures, s.m||0].join(";"));
    });

    /* Résumé montré À L'ÉCRAN : uniquement des chiffres de jeu. Le
       diagnostic du moteur graphique — utile à Fabien, illisible pour
       un testeur — n'y figure plus. Il reste dans le FICHIER exporté,
       où il sert vraiment. */
    const resumeEcran = [
      "Branoxy — relevés locaux",
      "niveaux conclus : " + niveaux.length,
      "durée moyenne : " + Math.round(totalSec / Math.max(1, niveaux.length)) + " s",
      "indices au total : " + totalInd,
      "abandons : " + abandons,
      "mode actuel : " + (d.mode || 2)
    ].join("\n");
    const diagMoteur = "moteur graphique : " + (Verre.actif ? "WebGL2"
      : ("2D — " + (Verre.raison || "non essayé")))
      + (Verre.manquants ? " | uniformes absents : " + Verre.manquants : "");
    const texte = resumeEcran + "\n" + diagMoteur + "\n\n" + lignes.join("\n");

    /* Partage natif si l'appareil le propose, presse-papier sinon, et en
       dernier recours un téléchargement.

       Défaut trouvé en le relisant : le commentaire annonçait ces trois
       voies, mais seule la troisième existait vraiment dans le code.
       Aucune trace de navigator.share ni du presse-papier, alors que la
       traduction « Relevés copiés dans le presse-papier » existait dans
       les six langues sans jamais être appelée. */
    const secours = async ()=>{
      /* 1 — partage natif. Fichier si l'appareil l'accepte, texte sinon.
         AbortError signifie juste que le testeur a fermé la feuille de
         partage : ce n'est pas un échec, on ne montre rien. */
      if (navigator.share){
        try{
          const bloc = new Blob([texte], { type: "text/csv;charset=utf-8" });
          const fichier = new File([bloc], "branoxy-stats.csv", { type: "text/csv" });
          const avecFichier = navigator.canShare && navigator.canShare({ files: [fichier] });
          await navigator.share(avecFichier
            ? { files: [fichier], title: T("stats_titre") }
            : { text: texte, title: T("stats_titre") });
          return;
        }catch(e){
          if (e && e.name === "AbortError") return;
          /* sinon on continue vers le presse-papier */
        }
      }
      /* 2 — presse-papier. Contrairement à un lien détaché de la page,
         cette API renvoie une vraie promesse : on SAIT si ça a marché,
         donc le message qui suit n'est plus une supposition. */
      if (navigator.clipboard && navigator.clipboard.writeText){
        try{
          await navigator.clipboard.writeText(texte);
          this.message(T("stats_copie"));
          return;
        }catch(e){ /* on tente le téléchargement */ }
      }
      /* 3 — téléchargement, en dernier recours.

         Deux fautes corrigées ici, signalées par Fabien : le fichier
         n'arrivait jamais et le jeu annonçait quand même un succès.
         1. Le lien n'était pas ajouté à la page — Android ignore un
            clic sur un lien détaché, sans lever d'erreur.
         2. Une adresse « data: » est de plus en plus filtrée pour les
            téléchargements ; un objet Blob passe partout.

         Reste une limite qu'aucune de ces corrections ne lève : rien
         dans le navigateur ne confirme qu'Android a vraiment ÉCRIT le
         fichier sur le disque. Le message dit donc « téléchargement
         lancé », jamais « enregistré » — on annonce ce qu'on a fait,
         pas ce qu'on ne peut pas vérifier. */
      try{
        const bloc = new Blob([texte], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(bloc);
        const lien = document.createElement("a");
        lien.href = url;
        lien.download = "branoxy-stats.csv";
        lien.style.display = "none";
        document.body.appendChild(lien);
        lien.click();
        setTimeout(()=>{ document.body.removeChild(lien); URL.revokeObjectURL(url); }, 400);
        this.message(T("stats_ok"));
      }catch(e){ this.message(T("stats_err")); }
    };
    this.confirm(resumeEcran.trim(), T("stats_dl"), secours, T("stats_titre"), T("understood"));
  },
  /** Affiche quel moteur dessine réellement les pièces. Rafraîchi à
      chaque ouverture des Paramètres : le moteur peut se désactiver en
      cours de partie, après une perte de contexte ou un rendu jugé
      invalide. */
  syncMoteur(){
    const e = document.getElementById("diag-moteur");
    if (!e) return;
    e.textContent = "Moteur : " + (Verre.actif ? "WebGL2"
      : ("2D — " + (Verre.raison || "non essayé")))
      + (Verre.manquants ? " | absents : " + Verre.manquants : "");
  },
  syncMode(){
    const b = document.getElementById("b-mode");
    if (b) b.textContent = T("mode_" + (SaveManager.data.mode || 2));
  },
  syncSwitches(){
    const d = SaveManager.data;
    const poser = (id, actif)=>{
      const e = document.getElementById(id);
      e.classList.toggle("on", !!actif);
      e.setAttribute("aria-checked", actif ? "true" : "false");
    };
    poser("sw-sound", d.sound);
    poser("sw-vibe",  d.vibrate);
    poser("sw-ciel",  d.cielReel);
    /* Vibration : ne jamais présenter comme disponible ce qui ne l'est
       pas. Beaucoup d'appareils — la plupart des iPhone sous navigateur,
       les ordinateurs de bureau — n'exposent aucun moteur de vibration.
       L'interrupteur y répondait dans le vide. On le grise, et la
       description dit pourquoi, plutôt que de laisser croire à une
       panne. */
    const dispo = typeof navigator !== "undefined" && typeof navigator.vibrate === "function";
    const ligne = document.getElementById("sw-vibe");
    ligne.setAttribute("aria-disabled", dispo ? "false" : "true");
    const desc = ligne.closest(".opt").querySelector("small");
    if (desc) desc.textContent = T(dispo ? "o_vibe_d" : "o_vibe_no");
  }
};
function fmt(s){ if (!s && s !== 0) return "—"; return Math.floor(s/60) + ":" + String(s % 60).padStart(2, "0"); }
function fmtScore(n){ return (n || 0).toLocaleString(I18N.lang === "fr" ? "fr-FR" : "en-US"); }

/* Bouton retour matériel Android : rejoue exactement ce que ferait un
   tap sur la flèche retour visible de l'écran actif, et ferme
   l'application depuis l'accueil. Jamais appelée hors d'une application
   empaquetée (voir le branchement conditionnel dans boot()), donc sans
   effet ni risque dans un simple onglet de navigateur. */
/* Ramène exactement à l'écran d'où la partie a été lancée — accueil,
   liste des niveaux, ou Ciel — au lieu de systématiquement retomber
   sur Niveaux même quand ce n'est pas par là qu'on est arrivé. */
function goToOrigin(){
  const dest = GameManager.cameFrom || "s-home";
  if (dest === "s-levels"){ UIManager.buildLevels(); UIManager.show("s-levels"); }
  else if (dest === "s-sky"){ SkyManager.show(); }
  else { UIManager.syncPlayProgress(); UIManager.show("s-home"); }
}

function androidBack(){
  /* Le retour Android ne faisait RIEN : cette ligne cherchait un écran
     « ov-ad » (l'ancienne pub simulée) qui n'existe plus. Le code plantait
     avant toute action. Les vraies pubs sont des écrans natifs Android qui
     gèrent eux-mêmes leur bouton retour. Trouvé le 2 oct. par un contrôle
     statique : le banc de test fabrique un élément pour N'IMPORTE QUEL id,
     il ne pouvait donc pas voir qu'un élément manquait. */
  const msg = document.getElementById("ov-msg");
  if (msg.classList.contains("on")){ msg.classList.remove("on"); return; }
  const active = document.querySelector(".screen.on");
  if (!active || active.id === "s-home"){
    const cap = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
    if (cap) cap.exitApp();
    return;
  }
  const back = active.querySelector(".iconbtn.nav-home, .iconbtn.nav-levels");
  if (back && typeof back.onclick === "function") back.onclick();
}

/* ------------------------------------------------------------------
   SkyManager — le Ciel : l'historique des niveaux résolus transformé
   en objet qu'on peut regarder, pas seulement en nombre qu'on compte.

   Chaque niveau résolu occupe une position déterministe (dérivée de son
   numéro, jamais du hasard du moment) : elle ne bouge plus jamais, et
   deux visites donnent toujours le même ciel. Les niveaux les plus
   avancés s'éloignent du centre — le ciel grandit avec la partie,
   littéralement. Toucher une étoile rejoue son niveau directement.
   ------------------------------------------------------------------ */
/* ============================================================
   SkyManager — le Ciel : constellations et système solaire
   ------------------------------------------------------------
   Rôle    : 32 constellations (171 étoiles réelles, données J2000)
             et le système solaire en orrery. Exploration au doigt.
   Expose  : init(), open(), layout(), draw(), plongerVers(),
             litCount(), estComplet().
   Dépend  : SaveManager, Renderer, GameManager, I18N.
   Pièges  : layout() REDESSINE toujours à la fin — le Ciel n'a pas
             de boucle de rendu permanente, et changer canvas.width
             efface le canevas : sans ce redessin, l'écran reste
             noir. Et borner() CENTRE quand le ciel est plus petit
             que l'écran, au lieu de le coller à un bord : sinon
             tout saute en haut à gauche au premier geste.
   ============================================================ */
const SkyManager = {
  cv:null, ctx:null, W:0, H:0, points:[], t0:0, selected:null,
  view:{ scale:1, ox:0, oy:0 }, pointers:new Map(), pinch:null, downInfo:null,

  init(){
    this.cv = document.getElementById("sky-canvas");
    this.ctx = this.cv.getContext("2d");
    this.cv.addEventListener("pointerdown", e => this.onDown(e));
    this.cv.addEventListener("pointermove", e => this.onMove(e));
    this.cv.addEventListener("pointerup",   e => this.onUp(e));
    this.cv.addEventListener("pointercancel", e => this.onUp(e));
    /* Sur mobile, l'événement `resize` se déclenche souvent AVANT que le
       navigateur ait fini d'ajuster ses dimensions — surtout à la
       rotation de l'écran. Un seul layout() au moment de l'événement
       peut donc mesurer des dimensions encore périmées. On repasse
       après coup, deux fois, pour rattraper le cas : la seconde et la
       troisième mesure trouvent les bonnes valeurs même si la première
       arrive trop tôt. `orientationchange` est écouté en plus de
       `resize` car certains navigateurs mobiles ne déclenchent pas les
       deux de façon fiable. */
    const relayout = ()=>{
      if (!document.getElementById("s-sky").classList.contains("on")) return;
      this.layout(false);
    };
    window.addEventListener("resize", relayout);
    window.addEventListener("orientationchange", relayout);
    /* Un ResizeObserver sur le canevas LUI-MÊME, en plus des événements
       de fenêtre. Après plusieurs allers-retours avec Fabien où le
       problème persistait malgré des corrections successives, c'est la
       seule approche qui ne dépende plus d'un diagnostic exact de la
       cause : il se déclenche dès que la taille réelle du canevas
       change, quelle qu'en soit la raison — barre d'adresse du
       navigateur, rotation, réagencement du flux CSS, changement de
       hauteur du texte d'aide en bas, ou n'importe quoi d'autre que je
       ne peux pas observer à distance. Les événements `resize` de la
       fenêtre, eux, peuvent manquer certains de ces cas ou arriver
       avant que les dimensions ne soient réellement à jour. */
    if (typeof ResizeObserver !== "undefined"){
      new ResizeObserver(()=>{
        if (!document.getElementById("s-sky").classList.contains("on")) return;
        if (this.cv.clientWidth !== this.W || this.cv.clientHeight !== this.H) this.layout(false);
      }).observe(this.cv);
    }
  },

  /** Combien d'étoiles réelles sont allumées, d'après le niveau le plus
      haut atteint. Le rythme (une étoile tous les cinq niveaux) est
      délibérément plus lent qu'un niveau résolu = une étoile : il doit
      rester un objectif de fond bien après la campagne, pas s'épuiser
      en une poignée de sessions. */
  /** La couleur d'une étoile allumée, selon le mode choisi.

      Demandé par Fabien : « je verrais bien une option constellations
      blanches, représentant la réalité du ciel réel ». Les deux modes
      cohabitent — la palette colorée reste par défaut, parce qu'elle
      relie chaque étoile à la pièce du puzzle qui l'a fait naître ;
      le mode réel s'adresse à qui veut voir le ciel tel qu'il est.

      En mode réel, les étoiles ne sont pas d'un blanc uniforme : une
      étoile brillante paraît franchement blanche, une étoile faible
      tire vers le bleu-gris, exactement comme à l'œil nu. La magnitude
      réelle (déjà dans les données J2000) sert d'échelle — plus elle
      est basse, plus l'étoile est lumineuse. */
  couleurEtoile(idx, mag){
    if (!SaveManager.data.cielReel) return COLORS[idx % COLORS.length];
    const m = typeof mag === "number" ? mag : 3;
    const k = Math.max(0, Math.min(1, (m + 1.5) / 5.5));   // 0 = très brillante, 1 = faible
    const r = Math.round(255 - k * 40);
    const g = Math.round(255 - k * 28);
    const b = Math.round(255 - k * 8);
    return "rgb(" + r + "," + g + "," + b + ")";
  },

  /* Le calcul des étoiles allumées, isolé ici pour qu'un SEUL endroit
     en décide. C'est ce qui manquait auparavant : checkWin() avait sa
     propre règle (le numéro du niveau divisible par 5), le Ciel en
     avait une autre — d'où deux comptes qui divergeaient. */
  /** L'appareil sait-il vraiment produire un canevas de cette taille ?
      On ne se fie pas aux dimensions déclarées : un navigateur peut
      accepter `width`/`height` puis rendre du vide. On dessine donc un
      pixel témoin dans un coin et on le relit. Test fait sur un canevas
      de la taille visée, puis libéré aussitôt. */
  canevasSupporte(w, h){
    try{
      const test = document.createElement("canvas");
      test.width = w; test.height = h;
      const g = test.getContext("2d");
      if (!g) return false;
      g.fillStyle = "#FFFFFF";
      g.fillRect(w - 2, h - 2, 1, 1);
      const px = g.getImageData(w - 2, h - 2, 1, 1).data;
      test.width = test.height = 1;            // libère la mémoire tout de suite
      return px[0] > 200;                      // le témoin est bien là
    }catch(e){ return false; }
  },
  etoilesPour(nbNiveauxResolus){
    return Math.min(SKY_STARS.length, Math.floor(nbNiveauxResolus / SKY_LEVELS_PER_STAR));
  },
  litCount(){
    /* Signalé par Fabien : une fois le jeu débloqué, tous les niveaux
       sont accessibles directement — rien n'empêche de sauter du
       niveau 40 au 45 puis au 50, sans jamais toucher aux niveaux
       intermédiaires. L'ancien calcul se basait sur `unlocked`, le
       niveau le plus haut jamais atteint : terminer directement le
       niveau 50 faisait bondir `unlocked` à 51, et allumait aussitôt
       dix étoiles — comme si les quarante-neuf niveaux précédents
       avaient été résolus, alors qu'un seul l'avait vraiment été.

       Corrigé en comptant les résolutions RÉELLES et DISTINCTES —
       `data.stars` ne contient une entrée pour un niveau que si ce
       niveau précis a été conclu au moins une fois (voir record()) —
       plutôt que de déduire un compte à partir d'un simple plafond.
       Sauter des niveaux ne rapporte donc plus que le nombre de
       niveaux réellement résolus, jamais plus. */
    return this.etoilesPour(Object.keys(SaveManager.data.stars).length);
  },
  estComplet(){ return this.litCount() >= SKY_STARS.length; },

  layout(reinitialiserVue = true){
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    /* Signalé par Fabien avec trois captures : portrait → paysage →
       portrait, le ciel restait complètement vide, jusqu'à taper
       l'écran. Ma dernière correction (ne plus jamais toucher la vue
       sur un redimensionnement) réglait le petit saut dû à la barre
       d'adresse du navigateur, mais une VRAIE rotation d'écran change
       les dimensions bien plus radicalement — largeur et hauteur se
       permutent presque entièrement. La vue restait calée pour
       l'ancienne orientation et tombait entièrement hors champ : plus
       aucune étoile visible, alors que le code fonctionnait, juste
       hors de portée. On distingue maintenant les deux cas par
       l'ampleur du changement, pas seulement par la présence d'un
       argument : un petit écart (barre d'adresse) préserve la vue
       comme avant ; un grand écart (rotation) la recalcule, comme une
       vraie ouverture. */
    const ancienW = this.W, ancienH = this.H;
    /* Le point du MONDE actuellement au centre de l'écran, mémorisé
       AVANT que les dimensions ne changent. Signalé par Fabien : la
       rotation recentrait bien, mais un simple toucher décalait tout
       vers la gauche. La cause était la même dans les deux cas — la
       vue restait ancrée sur les ANCIENNES dimensions — mais la
       rotation la masquait, puisqu'elle déclenchait un recentrage
       complet. Plutôt que de rattraper chaque cas particulier (barre
       d'adresse, rotation, changement mineur…), on conserve ici ce
       qui compte vraiment : ce que le joueur a sous les yeux, au
       centre. Après la mise à jour des dimensions, ce même point du
       monde est remis au centre du nouvel écran — quelle que soit la
       façon dont la largeur et la hauteur ont changé. */
    let centreMonde = null;
    if (ancienW > 0 && ancienH > 0 && this.view && this.view.scale > 0){
      centreMonde = {
        x: (ancienW/2 - this.view.ox) / this.view.scale,
        y: (ancienH/2 - this.view.oy) / this.view.scale,
      };
    }
    /* On mesure dans des variables LOCALES avant de valider.

       Le code écrasait this.W avec la valeur douteuse AVANT de renoncer :
       en arrière-plan, les dimensions valent zéro, donc this.W restait à
       zéro. Or draw() efface par clearRect(0, 0, this.W, this.H) — un
       rectangle nul n'efface rien, et tout s'empilait image après image.
       C'est le barbouillage constaté à la reprise. */
    const mW = this.cv.clientWidth, mH = this.cv.clientHeight;
    if (!mW || !mH) return;
    this.W = mW; this.H = mH;
    this.cv.width = this.W * dpr; this.cv.height = this.H * dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    /* Position de base (avant pincer-zoomer) : chaque constellation est
       ancrée par son ascension droite (horizontal) et sa déclinaison
       (vertical) — une vraie carte du ciel aplatie. L'échelle en degrés
       est commune à toutes : la Croix du Sud, la plus petite des 88
       constellations, reste visiblement plus petite que la Grande Ourse,
       comme dans le vrai ciel. */
    /* Échelle de base réduite pour onze constellations au lieu de quatre.
       Mesuré : aucune échelle unique ne sépare totalement toutes les
       paires — certaines sont réellement voisines dans le vrai ciel
       (Grande et Petite Ourse, Scorpion et Sagittaire), pas un défaut de
       calcul. Cette valeur est le compromis le plus large qui garde
       chaque étoile réellement touchable ; le pincer-zoomer sert
       précisément à démêler une zone chargée. */
    /* Ciel MOBILE : l'échelle est désormais réelle et fixe, la même
       quel que soit le nombre de constellations. Mesuré la dernière
       fois : aucune échelle unique ne pouvait séparer toutes les
       paires sans en écraser certaines, parce que certaines
       constellations sont réellement voisines dans le vrai ciel — les
       rapprocher artificiellement aurait trahi l'authenticité. La
       solution n'était donc pas un meilleur réglage, mais un canevas
       plus grand que l'écran : on explore le ciel en le faisant
       glisser, comme une vraie carte céleste, plutôt que de le voir
       entier d'un coup. */
    const DEG_PX = 7;
    const lit = this.litCount();

    this.points = [];
    CONSTELLATIONS.forEach(c=>{
      const ax = c.raMoy * 15 * DEG_PX;
      const ay = -c.decMoy * DEG_PX;
      c.pts.forEach((p, i)=>{
        const idx = SKY_STARS.findIndex(s => s.c === c && s.i === i);
        this.points.push({
          c, i, idx, nom: p.nom, mag: p.mag,
          x: ax + p.x * DEG_PX, y: ay - p.y * DEG_PX,
          lit: idx < lit,
          color: idx < lit ? this.couleurEtoile(idx, p.mag) : "#3A4A56",
        });
      });
    });

    /* Bornes de déplacement, sur les constellations seules pour l'instant
       — les planètes s'ajoutent ensuite, sous ce bloc. */
    let xs = this.points.map(p=>p.x), ys = this.points.map(p=>p.y);
    const basY = Math.max(...ys);

    /* Système solaire : un coin dédié, pas une position céleste réelle
       (voir la note au-dessus de PLANETS). Un vrai orrery — le Soleil
       au centre, chaque planète sur son propre anneau elliptique,
       distance compressée en logarithme selon la vraie distance —
       plutôt qu'une rangée de points, qui se lisait comme une liste,
       pas comme un système. La compression verticale de l'ellipse
       (0.40) simule une vue légèrement inclinée, sans complexité 3D
       réelle : un seul facteur, vérifié en rendu avant d'être codé. */
    /* Taille d'ensemble du système solaire : distances ET diamètres au
       même facteur, donc les proportions entre planètes restent exactes.

       Porté de 1 à 1,7 après comparaison en rendu. À la taille d'origine,
       les noms des planètes se chevauchaient et l'orrery ne pesait rien
       dans la composition ; il laissait le bas de l'affiche vide.

       Une variante plaçant le système SOUS LE TITRE a été rendue puis
       écartée : elle concurrence le titre, seul point d'entrée de
       l'affiche, et déplace le vide au lieu de le combler. */
    const ORRERY_ECHELLE = 1.7;
    const cxSol = (Math.min(...xs) + Math.max(...xs)) / 2;
    const cySol = basY + 260*ORRERY_ECHELLE;
    const COMPRESSION_ORBITE = 0.40;
    this.orbites = PLANETS.slice(1).map(p => p[5]*ORRERY_ECHELLE);
    this.centreSolaire = { x: cxSol, y: cySol };
    PLANETS.forEach((p, i)=>{
      const idx = SKY_STARS.findIndex(s => s.c === null && s.planete && s.i === i);
      let x = cxSol, y = cySol;
      if (i > 0){
        const angle = (-90 + (i - 1) * (360 / (PLANETS.length - 1))) * Math.PI / 180;
        x = cxSol + Math.cos(angle) * p[5] * ORRERY_ECHELLE;
        y = cySol + Math.sin(angle) * p[5] * ORRERY_ECHELLE * COMPRESSION_ORBITE;
      }
      this.points.push({
        c: null, i, idx, nom: p[0], planete: true, rayon: p[4]*ORRERY_ECHELLE,
        x, y,
        lit: idx < lit,
        color: idx < lit ? p[3] : "#3A4A56",
      });
    });

    /* Bornes de déplacement : tout l'ensemble des constellations, avec
       une marge confortable. Le ciel reste exploration bornée, pas une
       étendue vide sans fin où l'on pourrait se perdre. Le plus grand
       anneau d'orbite s'étend au-delà de toute planète qui y est posée
       (une planète n'occupe qu'un point de son anneau, pas tout le
       cercle) — les bornes doivent couvrir l'anneau entier, sinon son
       bord vide resterait inatteignable au glisser. */
    xs = this.points.map(p=>p.x); ys = this.points.map(p=>p.y);
    if (this.centreSolaire && this.orbites && this.orbites.length){
      const rMax = Math.max(...this.orbites);
      xs.push(this.centreSolaire.x - rMax, this.centreSolaire.x + rMax);
      ys.push(this.centreSolaire.y - rMax * .40, this.centreSolaire.y + rMax * .40);
    }
    this.bounds = {
      minX: Math.min(...xs) - 80, maxX: Math.max(...xs) + 80,
      minY: Math.min(...ys) - 80, maxY: Math.max(...ys) + 80,
    };
    /* L'échelle minimale du pincer-zoomer : calculée sur les vraies
       bornes, pas un chiffre fixe.

       Signalé par Fabien : le plancher figé à 0.6 ne montrait jamais
       plus de 24 % de la largeur du ciel, quel que soit le nombre de
       fois qu'on pinçait — vérifié par le calcul. Voir le ciel entier
       demandait une échelle de 0.147, cinq fois plus basse. Calculée
       ici à partir des bornes réelles, cette limite reste juste même
       si de nouvelles constellations agrandissent le ciel plus tard —
       pas un chiffre à retoucher à la main à chaque ajout. Sans danger
       pour la lisibilité : chaque étoile garde un plancher de 2 px
       (Renderer... pardon, SkyManager.draw()), donc même au dézoom
       maximal, rien ne devient invisible — juste petit. */
    const largeurMonde = this.bounds.maxX - this.bounds.minX;
    const hauteurMonde = this.bounds.maxY - this.bounds.minY;
    this.minScale = Math.min(.92 * this.W / largeurMonde, .92 * this.H / hauteurMonde);

    /* Position de départ : le ciel ENTIER, d'un coup — pas cadré sur
       une seule constellation qu'il faudrait ensuite dézoomer à la
       main pour dépasser.

       Deux allers-retours avec Fabien avant d'arriver ici. D'abord,
       centrer sur un seul point isolait 7 des 8 étoiles allumées hors
       champ — corrigé en cadrant sur la constellation en cours. Mais
       Fabien a fait remarquer, à juste titre, que ça inversait le bon
       sens : le joueur devait ENCORE dézoomer à la main, beaucoup,
       pour voir l'étendue de ce qui l'attend — l'effet inverse de
       l'accroche voulue. Entre-temps, l'échelle minimale du
       pincer-zoomer est devenue dynamique et montre le ciel entier
       sans rendre les étoiles invisibles (plancher de 2px) — la
       raison qui empêchait cette vue d'ensemble au départ n'existe
       donc plus. Le joueur voit maintenant tout, d'un coup, à
       l'ouverture ; zoomer sur une constellation précise devient un
       choix, plus une obligation.

       `reinitialiserVue` (vrai par défaut) couvre l'ouverture réelle
       du Ciel ; tout changement de dimensions passe par le recentrage
       du point du monde (voir plus bas), qui couvre rotation et barre
       d'adresse de la même façon, sans distinction de cas. */
    if (reinitialiserVue || !centreMonde){
      /* Ouverture réelle du Ciel : vue d'ensemble, tout visible d'un
         coup. */
      this.view = {
        scale: this.minScale,
        ox: this.W/2 - (this.bounds.minX + this.bounds.maxX) / 2 * this.minScale,
        oy: this.H/2 - (this.bounds.minY + this.bounds.maxY) / 2 * this.minScale,
      };
    } else {
      /* Changement de dimensions : on remet au centre du NOUVEL écran
         exactement le point du monde qui y était avant. Vrai pour une
         rotation comme pour la barre d'adresse qui se rétracte — plus
         besoin de deviner de quel type de changement il s'agit, la
         formule les couvre tous. Si le ciel entier tenait à l'écran
         avant, l'échelle est aussi réajustée pour qu'il y tienne
         encore : sinon, une rotation vers un écran plus étroit en
         laisserait une partie hors champ. */
      const tenaitEntierement = this.view.scale <= this.minScaleAncien * 1.02;
      if (tenaitEntierement) this.view.scale = this.minScale;
      this.view.ox = this.W/2 - centreMonde.x * this.view.scale;
      this.view.oy = this.H/2 - centreMonde.y * this.view.scale;
    }
    this.minScaleAncien = this.minScale;

    /* LA VRAIE CAUSE du problème signalé par Fabien pendant des heures,
       trouvée en partant de son observation décisive : « il faut
       tapoter l'écran pour faire réapparaître les constellations ».

       Le Ciel n'est PAS redessiné en continu : sa boucle de rendu
       s'arrête au bout de 1600 ms (le temps de l'animation d'entrée,
       voir la fin de open()). Passé ce délai, il ne se redessine que
       sur un geste — draw() est appelée par onMove() et par tapAt().
       Or `this.cv.width = ...` juste au-dessus EFFACE entièrement le
       canevas, par définition du Canvas HTML. Sans redessin
       immédiat, l'écran restait donc vide ou figé sur un état
       périmé, jusqu'au prochain geste du joueur. */
    this.draw(performance.now());
  },

  /** Coordonnées écran d'un point, une fois le pincer-zoomer appliqué. */
  toScreen(p){ return { x: this.view.ox + p.x * this.view.scale, y: this.view.oy + p.y * this.view.scale }; },

  draw(now){
    const ctx = this.ctx; if (!ctx || !this.W) return;
    ctx.clearRect(0, 0, this.W, this.H);
    const age = Math.min(1, (now - this.t0) / 900);

    /* Traits de constellation : seulement entre deux étoiles déjà
       allumées de la MÊME constellation — jamais vers une étoile encore
       éteinte, qui trahirait la forme avant l'heure. */
    ctx.save();
    ctx.strokeStyle = "rgba(90,120,135,.35)"; ctx.lineWidth = 1.2;
    CONSTELLATIONS.forEach(c=>{
      c.lines.forEach(([a,b])=>{
        const pa = this.points.find(p=>p.c===c && p.i===a), pb = this.points.find(p=>p.c===c && p.i===b);
        if (!pa || !pb || !pa.lit || !pb.lit) return;
        const sa = this.toScreen(pa), sb = this.toScreen(pb);
        ctx.beginPath(); ctx.moveTo(sa.x, sa.y); ctx.lineTo(sb.x, sb.y); ctx.stroke();
      });
    });
    ctx.restore();

    /* Anneaux d'orbite : de fines ellipses, une par planète, presque
       invisibles — elles se sentent plus qu'elles ne se voient, comme
       dans un vrai schéma d'orrery. Un anneau apparaît dès que sa
       planète est visible (même éteinte, en aperçu), pour qu'on
       devine tout le système avant de l'avoir entièrement révélé. */
    if (this.centreSolaire && this.orbites){
      ctx.save();
      ctx.strokeStyle = "rgba(120,150,150,.22)"; ctx.lineWidth = 1;
      const c = this.centreSolaire, s = this.view.scale;
      this.orbites.forEach(rayon=>{
        const cx = this.view.ox + c.x * s, cy = this.view.oy + c.y * s;
        ctx.beginPath();
        ctx.ellipse(cx, cy, rayon * s, rayon * .40 * s, 0, 0, 6.2832);
        ctx.stroke();
      });
      ctx.restore();
    }

    this.points.forEach((p, i)=>{
      /* Révélation en cascade, dans l'ordre des niveaux : le ciel se
         construit sous les yeux au lieu d'apparaître d'un bloc. */
      const delay = Math.min(0.7, i * 0.012);
      const local = Math.max(0, Math.min(1, (age - delay) / (1 - delay || 1)));
      if (local <= 0) return;
      const sp = this.toScreen(p);

      if (p.planete){
        /* Une planète est un disque plein à sa taille RELATIVE réelle
           (échelle logarithmique du vrai diamètre) — jamais un point
           scintillant comme une étoile, pour qu'on la reconnaisse au
           premier regard comme un objet différent, pas une étoile de
           plus dans la liste. */
        const r = Math.max(2, p.rayon * this.view.scale) * local;
        ctx.save();
        ctx.globalAlpha = local * (p.lit ? 1 : .5);

        /* Saturne, seule planète du système dont les anneaux se voient à
           l'œil nu depuis la Terre — un demi-anneau derrière le disque,
           l'autre devant, pour que ça se lise vraiment comme un anneau
           et non comme un simple ovale décoratif. */
        const saturne = p.nom === "Saturne";
        if (saturne && p.lit){
          ctx.save();
          ctx.translate(sp.x, sp.y); ctx.rotate(-.35);
          ctx.scale(1, .38);
          ctx.strokeStyle = shade(p.color, .25); ctx.lineWidth = Math.max(1, r * .22);
          ctx.beginPath(); ctx.arc(0, 0, r * 1.85, Math.PI * .08, Math.PI * .92); ctx.stroke();
          ctx.restore();
        }

        if (p.lit) Renderer.blob(ctx, sp.x, sp.y, r * 2.4, p.color, .35);
        const g = ctx.createRadialGradient(sp.x - r*.3, sp.y - r*.3, 0, sp.x, sp.y, r);
        g.addColorStop(0, "rgba(255,255,255,.55)");
        g.addColorStop(.35, p.color);
        g.addColorStop(1, shade(p.color, -.35));
        ctx.beginPath(); ctx.fillStyle = p.lit ? g : p.color;
        ctx.arc(sp.x, sp.y, r, 0, 6.2832); ctx.fill();

        /* Géante gazeuse : bandes horizontales, découpées au disque —
           sans ça, Jupiter n'est qu'un caillou orange plus gros que
           Mars. Vérifié en rendu Python avant d'écrire ce code. */
        if (p.lit && PLANETES_GEANTES.has(p.nom)){
          ctx.save();
          ctx.beginPath(); ctx.arc(sp.x, sp.y, r, 0, 6.2832); ctx.clip();
          const nb = 5;
          for (let i = -nb; i <= nb; i++){
            const y = sp.y + i * (r / nb) * .85, h = (r / nb) * .9;
            ctx.fillStyle = shade(p.color, i % 2 === 0 ? .12 : -.1);
            ctx.globalAlpha = .35;
            ctx.fillRect(sp.x - r * 1.3, y - h/2, r * 2.6, h);
          }
          ctx.restore();
        }

        if (saturne && p.lit){
          ctx.save();
          ctx.translate(sp.x, sp.y); ctx.rotate(-.35);
          ctx.scale(1, .38);
          ctx.strokeStyle = shade(p.color, .35); ctx.lineWidth = Math.max(1, r * .22);
          ctx.beginPath(); ctx.arc(0, 0, r * 1.85, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
          ctx.restore();
        }

        ctx.restore();
        return;
      }

      const s = p.lit ? 6 : 3;
      const glow = p.lit ? 12 : 4;
      ctx.save();
      ctx.globalAlpha = local * (p.lit ? 1 : .55);
      Renderer.blob(ctx, sp.x, sp.y, glow * 2.6 * this.view.scale, p.color, p.lit ? .5 : .18);
      ctx.beginPath();
      ctx.fillStyle = p.color;
      ctx.arc(sp.x, sp.y, Math.max(2, s * .55 * this.view.scale) * local, 0, 6.2832);
      ctx.fill();
      ctx.restore();
    });

    /* Le nom de chaque constellation, écrit sous elle — demandé par
       Fabien. N'apparaît qu'au rapprochement (échelle > 0.55) : à la
       vue d'ensemble, trente-deux noms superposés seraient illisibles
       et masqueraient les étoiles elles-mêmes. Il fond progressivement
       entre 0.55 et 0.85 plutôt que d'apparaître d'un coup, et ne
       s'affiche que si au moins une étoile de la constellation est
       allumée — sinon il révélerait le nom d'une forme que le joueur
       n'a pas encore gagnée. */
    if (this.view.scale > .55){
      const opaciteNom = Math.min(1, (this.view.scale - .55) / .30);
      ctx.save();
      ctx.font = "600 11px ui-monospace, Menlo, Consolas, monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      const parConstellation = new Map();
      this.points.forEach(p=>{
        if (!p.c) return;
        let e = parConstellation.get(p.c);
        if (!e){ e = { minX:Infinity, maxX:-Infinity, maxY:-Infinity, allume:false }; parConstellation.set(p.c, e); }
        const sp = this.toScreen(p);
        e.minX = Math.min(e.minX, sp.x); e.maxX = Math.max(e.maxX, sp.x);
        e.maxY = Math.max(e.maxY, sp.y);
        if (p.lit) e.allume = true;
      });
      parConstellation.forEach((e, c)=>{
        if (!e.allume) return;
        const x = (e.minX + e.maxX) / 2, y = e.maxY + 14;
        if (x < -60 || x > this.W + 60 || y < -20 || y > this.H + 20) return;   // hors écran : rien à dessiner
        const nom = T("csn_" + c.id).replace(/\s*(complet|complète|complete|completo|completa|vollständig)(e|s|es)?\.?$/i, "");
        ctx.globalAlpha = opaciteNom * .55;
        ctx.fillStyle = "#0A1016";
        const larg = ctx.measureText(nom).width;
        ctx.fillRect(x - larg/2 - 5, y - 2, larg + 10, 15);
        ctx.globalAlpha = opaciteNom * .8;
        ctx.fillStyle = "#9FD8C8";
        ctx.fillText(nom, x, y);
      });
      ctx.restore();
    }

    /* L'étiquette de l'étoile — ou de la planète — en cours de sélection.
       Pour une planète, le nom réel prime : « Jupiter » veut dire bien
       plus que « Niveau 445 » pour un joueur qui découvre le système
       solaire. Pour une étoile, le niveau reste l'information utile. */
    if (this.selected && this.selected.lit){
      const p = this.selected, sp = this.toScreen(p);
      /* Depuis que l'étoile ne dépend plus d'un niveau précis mais du
         NOMBRE de niveaux résolus, afficher « Niveau 65 » ici était
         devenu un mensonge — et surtout, ça poussait à jouer le niveau
         65 en croyant décrocher l'étoile, exactement le malentendu
         signalé par Fabien. L'étiquette dit désormais la vraie
         condition : le nombre de niveaux qu'il a fallu résoudre. */
      const niveau = (p.idx + 1) * SKY_LEVELS_PER_STAR;
      ctx.save();
      Renderer.ring(ctx, sp.x, sp.y, Math.max(15, (p.rayon||0) + 8), 5, p.color, .85);

      const text = p.planete
        ? p.nom + "   ·   " + T("sky_solved").replace("%n", niveau)
        : T("sky_solved").replace("%n", niveau);
      ctx.font = "600 15px ui-monospace, Menlo, Consolas, monospace";
      ctx.textBaseline = "middle";
      const tw = ctx.measureText(text).width;
      const padX = 14, padY = 9, boxW = tw + padX*2, boxH = 15 + padY*2;
      let bx = Math.max(8, Math.min(this.W - boxW - 8, sp.x - boxW/2));
      let by = sp.y - 34 - (p.rayon||0) - boxH;
      if (by < 8) by = sp.y + 34 + (p.rayon||0);

      const box = new Path2D();
      rr(box, bx, by, boxW, boxH, 10);
      ctx.fillStyle = "rgba(6,11,15,.92)"; ctx.fill(box);
      ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.lineWidth = 1; ctx.stroke(box);

      ctx.fillStyle = "#EAFFF7"; ctx.textAlign = "left";
      ctx.fillText(text, bx + padX, by + boxH/2);
      ctx.restore();
    }
  },

  /** Une constellation vient-elle de se compléter ? Comparé à ce qui
      était déjà enregistré, pour ne fêter chaque forme qu'une seule
      fois. Le nom se révèle uniquement une fois la figure entière
      dessinée — jamais avant, aucun indice donné en cours de route. */
  celebrerConstellationsCompletes(){
    const lit = this.litCount();
    CONSTELLATIONS.forEach(c=>{
      const idxMax = Math.max(...c.pts.map((_, i) => SKY_STARS.findIndex(s => s.c === c && s.i === i)));
      if (idxMax >= lit) return;                      // pas encore complète
      if (SaveManager.data.skyDone[c.id]) return;      // déjà fêtée
      SaveManager.data.skyDone[c.id] = true; SaveManager.save();
      const ax = this.points.find(p=>p.c===c);
      if (!ax) return;
      const sp = this.toScreen(ax);
      Audio_.win(true);
      [0, 260].forEach(delay => setTimeout(()=>
        Renderer.emit(sp.x, sp.y, "#FFD25E", { life:1200, a:.85, w: 40, max: Math.max(this.W, this.H) }),
      delay));
      UIManager.toast(T("csn_" + c.id));
    });
    /* Le système solaire entier, une fois les neuf corps révélés — même
       mécanisme que pour une constellation complète. */
    const idxMaxPlanetes = Math.max(...PLANETS.map((_, i) =>
      SKY_STARS.findIndex(s => s.c === null && s.planete && s.i === i)));
    if (idxMaxPlanetes < lit && !SaveManager.data.skyDone.sys){
      SaveManager.data.skyDone.sys = true; SaveManager.save();
      const ax = this.points.find(p => p.planete);
      if (ax){
        const sp = this.toScreen(ax);
        Audio_.win(true);
        [0, 260].forEach(delay => setTimeout(()=>
          Renderer.emit(sp.x, sp.y, "#FFD25E", { life:1200, a:.85, w: 40, max: Math.max(this.W, this.H) }),
        delay));
        UIManager.toast(T("csn_sys"));
      }
    }
  },

  /** Un seul doigt : glisse la vue dès que le mouvement dépasse le seuil
      du tap, sélectionne sinon. Deux doigts : pincer-zoomer et
      glisser-déplacer, comme avant — les deux gestes cohabitent, l'un
      n'empêche pas l'autre.

      Signalé par Fabien : le ciel ne bougeait qu'à deux doigts, un geste
      que rien n'indique — le premier réflexe naturel d'un joueur est de
      glisser avec UN seul doigt, et rien ne se passait. Le pincer-zoomer
      à deux doigts reste utile pour zoomer, mais l'exploration de base
      doit répondre au geste le plus évident. */
  dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); },
  milieu(a, b){ return { x:(a.x+b.x)/2, y:(a.y+b.y)/2 }; },
  /** Le ciel reste une exploration délimitée, pas une étendue vide sans
      fin où l'on pourrait dériver et se perdre — même formule pour le
      pincer-zoomer et le glisser à un doigt, écrite une seule fois.

      LA VRAIE CAUSE du bug qui a résisté à tant de correctifs, trouvée
      grâce à l'observation décisive de Fabien : « à l'ouverture le
      glisser ne fonctionne pas, mais dès que je zoome sur une
      constellation, il fonctionne ».

      À l'ouverture, le ciel entier tient à l'écran — il est donc PLUS
      PETIT que l'écran (359×209 px pour un écran de 390×780). Dans ce
      cas, les deux bornes se croisent, et l'ancienne formule
      `Math.min(borneHaute, Math.max(borneBasse, ox))` retournait
      systématiquement `borneHaute` — c'est-à-dire le bord haut-gauche
      du monde collé au bord de l'écran. Mesuré : un saut de 285 px vers
      le haut, exactement « l'ensemble de l'image envoyée en haut de
      l'écran ». Et comme le résultat ne dépendait plus du tout de la
      position du doigt, le glisser paraissait mort. Une fois zoomé au
      point que le monde dépasse l'écran, les bornes reprennent leur
      ordre normal et tout refonctionnait — d'où l'observation de
      Fabien, qui pointait droit sur la cause.

      Correction : quand le monde est plus petit que l'écran dans une
      dimension, on le CENTRE dans cette dimension au lieu de le coller
      contre un bord. Chaque axe est traité séparément : le ciel peut
      très bien dépasser en largeur tout en tenant en hauteur. */
  borner(){
    if (!this.bounds) return;
    const b = this.bounds, s = this.view.scale;
    if ((b.maxX - b.minX) * s <= this.W){
      this.view.ox = this.W/2 - (b.minX + b.maxX) / 2 * s;
    } else {
      this.view.ox = Math.min(-b.minX * s, Math.max(this.W - b.maxX * s, this.view.ox));
    }
    if ((b.maxY - b.minY) * s <= this.H){
      this.view.oy = this.H/2 - (b.minY + b.maxY) / 2 * s;
    } else {
      this.view.oy = Math.min(-b.minY * s, Math.max(this.H - b.maxY * s, this.view.oy));
    }
  },

  onDown(e){
    if (this.transition) return;   // plongée en cours : un doigt posé ne doit pas la faire dérailler
    /* Le rectangle du canevas n'est mesuré qu'une fois, au tout début
       du geste — pas à chaque doigt qui se pose, pas à chaque
       mouvement. Si la page bouge légèrement PENDANT le geste (barre
       d'adresse du navigateur qui se réduit au toucher, justement le
       cas signalé par Fabien), une mesure refaite en cours de route
       capterait ce mouvement de page comme s'il venait du doigt,
       provoquant un saut qui n'a rien à voir avec le geste lui-même. */
    if (this.pointers.size === 0) this.rectFige = this.cv.getBoundingClientRect();
    const r = this.rectFige;
    this.pointers.set(e.pointerId, { x: e.clientX - r.left, y: e.clientY - r.top });
    this.cv.setPointerCapture(e.pointerId);
    if (this.pointers.size === 2){
      /* Signalé par Fabien, avec deux captures montrant le ciel avoir
         sauté vers le haut au tout premier écartement : en pratique,
         deux doigts ne touchent presque jamais l'écran exactement au
         même instant. Le premier doigt seul déclenchait déjà un début
         de glisser (voir onMove) avant même que le second n'arrive —
         et ce glisser accidentel restait collé une fois le pincement
         commencé, puisque celui-ci partait de la position COURANTE de
         la vue plutôt que de celle d'avant tout le geste. On annule
         ici ce glisser involontaire, pour que le pincement démarre
         toujours d'un état propre, quel que soit le petit mouvement du
         premier doigt pendant que le second se pose. */
      if (this.downInfo){
        this.view.ox = this.downInfo.panOx;
        this.view.oy = this.downInfo.panOy;
      }
      const [a, b] = [...this.pointers.values()];
      this.pinch = { dist: this.dist(a,b), scale: this.view.scale, ox: this.view.ox, oy: this.view.oy, mid: this.milieu(a,b) };
      this.downInfo = null;                            // un 2e doigt annule toute intention de tap
    } else if (this.pointers.size === 1){
      this.downInfo = { ...this.pointers.get(e.pointerId), moved:false, panOx: this.view.ox, panOy: this.view.oy };
    }
  },
  onMove(e){
    if (!this.pointers.has(e.pointerId)) return;
    const r = this.rectFige || this.cv.getBoundingClientRect();
    const pos = { x: e.clientX - r.left, y: e.clientY - r.top };
    this.pointers.set(e.pointerId, pos);

    if (this.pointers.size === 2 && this.pinch){
      const [a, b] = [...this.pointers.values()];
      /* Deuxième version de cette formule. La première (au carré sur le
         RAPPORT des écarts) réagissait bien au geste ample, mais restait
         sensible à l'écart de DÉPART des doigts — un pincement qui
         commence doigts rapprochés (15-25px, très courant en pratique)
         transformait un simple mouvement de 10px en un saut de 100 à
         278 % dès la première image. Vérifié par le calcul avant de
         corriger : ce n'était pas le geste de Fabien qui posait
         problème, c'était cette formule. Ici, l'amplification porte sur
         le déplacement ABSOLU en pixels, pas sur un rapport — la même
         variation produit le même effet quel que soit l'écart de départ.
         Toute la plage (0.135 à 4, soit 29,6×) reste atteignable en un
         seul geste raisonnable (40px → 185px), sans sursaut au début. */
      const DIST_REF_ZOOM = 150, K_ZOOM = 3.0;  // 3.5 → 3.0 : Fabien l'a trouvé presque trop puissant
      const deltaDist = this.dist(a,b) - this.pinch.dist;
      const facteurAmplifie = Math.exp(K_ZOOM * deltaDist / DIST_REF_ZOOM);
      const nouvelleEchelle = Math.max(this.minScale || .15, Math.min(4, this.pinch.scale * facteurAmplifie));
      const mid = this.milieu(a,b);
      /* Le point du ciel sous les doigts reste sous les doigts : zoomer
         ne fait pas sauter la vue ailleurs. */
      this.view.scale = nouvelleEchelle;
      this.view.ox = mid.x - (this.pinch.mid.x - this.pinch.ox) * (nouvelleEchelle / this.pinch.scale);
      this.view.oy = mid.y - (this.pinch.mid.y - this.pinch.oy) * (nouvelleEchelle / this.pinch.scale);
      this.borner();
      this.draw(performance.now());
    } else if (this.downInfo && this.pointers.size === 1){
      const dx = pos.x - this.downInfo.x, dy = pos.y - this.downInfo.y;
      if (!this.downInfo.moved && Math.hypot(dx, dy) > 8){
        /* La référence du glisser est prise ICI, au démarrage réel du
           mouvement — plus à la pose du doigt. Signalé par Fabien : le
           glisser ne fonctionnait pas et l'écran se décalait au simple
           toucher. Cause trouvée : poser un doigt fait souvent
           disparaître la barre d'adresse du navigateur, ce qui
           déclenche un redimensionnement et donc un recentrage de la
           vue. Or `panOx` avait été capturé AVANT ce recentrage : au
           premier mouvement, `view.ox = panOx + dx` ramenait la vue à
           sa position d'avant le recentrage, annulant la correction et
           produisant exactement le saut observé. En prenant la
           référence au moment où le glisser commence vraiment, elle
           reflète toujours l'état courant de la vue. */
        this.downInfo.moved = true;
        this.downInfo.x = pos.x; this.downInfo.y = pos.y;
        this.downInfo.panOx = this.view.ox; this.downInfo.panOy = this.view.oy;
        return;
      }
      if (this.downInfo.moved){
        this.view.ox = this.downInfo.panOx + (pos.x - this.downInfo.x);
        this.view.oy = this.downInfo.panOy + (pos.y - this.downInfo.y);
        this.borner();
        this.draw(performance.now());
      }
    }
  },
  onUp(e){
    const avaitDeuxDoigts = this.pointers.size >= 2;
    this.pointers.delete(e.pointerId);
    if (this.pointers.size < 2) this.pinch = null;
    if (this.pointers.size > 0) return;                // il reste un doigt : rien à conclure encore

    if (!avaitDeuxDoigts && this.downInfo && !this.downInfo.moved) this.tapAt(this.downInfo.x, this.downInfo.y);
    this.downInfo = null;
  },

  /** Plongée vers l'étoile avant de lancer son niveau — le basculement
      était brut jusqu'ici : un écran remplaçait l'autre sans lien.
      L'animation zoome vers l'étoile choisie, la vue se resserre et
      blanchit, puis le niveau démarre au moment où l'écran est
      saturé — la coupure devient invisible, et le passage du Ciel au
      puzzle se lit comme une continuité plutôt qu'un saut.

      Le geste reste interruptible dans les faits : la durée est courte
      (620 ms), et rien n'est enregistré avant le lancement — si
      l'animation était coupée par une sortie d'écran, le pire cas est
      un Ciel qui reste zoomé, corrigé au prochain layout(). */
  /** Exporte le Ciel en image haute résolution, à imprimer.

      Demandé par Fabien : « une fois le ciel complet, une option
      téléchargement pour imprimer sa réussite en haute résolution ».
      Réutilise draw() sur un canevas hors écran, avec une vue calculée
      pour cadrer TOUT le ciel — pas une capture de ce qu'on a à
      l'écran, mais le ciel entier, quel que soit le zoom courant.

      3000 px de large : assez pour une impression A3 nette (environ
      250 points par pouce), sans peser au point de faire échouer la
      conversion en image sur un téléphone modeste. */
  exporter(format, eco, pro){
    /* Une vraie affiche, pas une capture d'écran agrandie.

       Première version : le ciel recadré, sans plus. En le RENDANT
       pour de vrai avant de le proposer (rendu Python fidèle aux mêmes
       formules), trois défauts sont apparus — beaucoup de noir mort,
       aucun texte, et des points de 4 px invisibles à l'impression.
       Refaite ici en A3 paysage à 300 points par pouce (4961×3508),
       avec titre, progression, noms des constellations et pied de page.

       Les étoiles sont dimensionnées selon leur MAGNITUDE RÉELLE, comme
       dans un atlas céleste : Sirius doit se voir plus grosse qu'une
       étoile de magnitude 4. À l'écran cette nuance passerait inaperçue ;
       imprimée en 42 cm, elle fait toute la différence. */
    /* Deux formats au choix, demandés par Fabien : l'A3 pour qui veut
       l'accrocher, l'A4 pour un tirage courant — et parce qu'une image
       de 4961 px peut dépasser la mémoire d'un téléphone modeste, où
       l'A4 passera sans problème. Tout est proportionnel au format :
       sans ça, les titres calibrés pour l'A3 seraient démesurés sur
       une page deux fois plus petite. */
    /* Audit : l'A3 fait 4961x3508 = 17,4 mégapixels, au-dessus de la
       limite de canevas de Safari iOS sur les appareils plus anciens
       (16,7 Mpx). Le try/catch plus bas ne protégeait pas de ce cas :
       iOS ne lève AUCUNE erreur, il produit silencieusement une image
       vide — le joueur téléchargeait un fichier blanc en croyant que
       tout s'était bien passé. On mesure donc la capacité réelle de
       l'appareil AVANT de dessiner, et on retombe sur l'A4 (8,7 Mpx)
       plutôt que de produire du vide. */
    /* FOND PERDU (option imprimeur). Un imprimeur professionnel coupe la
       feuille APRÈS impression, avec une tolérance de coupe. Sans débord,
       la moindre dérive laisse un liseré blanc sur le bord d'une affiche
       au fond sombre. La norme est de 3 mm au-delà du format fini, soit
       35 pixels à 300 points par pouce.

       Le fond est peint sur TOUTE la surface, puis le dessin est décalé
       de la saignée : la composition reste identique par rapport au
       format fini, seul le fond dépasse. */
    const SAIGNEE = pro ? 35 : 0;
    let A3 = format !== "A4";
    if (A3 && !this.canevasSupporte(4961 + 2*SAIGNEE, 3508 + 2*SAIGNEE)){
      A3 = false;
      UIManager.toast(T("sky_a3_trop_grand"));
    }
    const LARGEUR = A3 ? 4961 : 3508, HAUTEUR = A3 ? 3508 : 2480;   // paysage, 300 ppp
    const k = LARGEUR / 4961;                       // facteur d'échelle du format
    const MARGE = 170*k, BAND_HAUT = 430*k, BAND_BAS = 150*k;
    const b = this.bounds;

    const sauve = { cv: this.cv, ctx: this.ctx, W: this.W, H: this.H, view: this.view, t0: this.t0 };
    try{
      const hors = document.createElement("canvas");
      hors.width = LARGEUR + 2*SAIGNEE; hors.height = HAUTEUR + 2*SAIGNEE;
      /* Deuxième filet : même à une taille acceptée, un appareil à court
         de mémoire peut renvoyer un canevas inutilisable. */
      if (!hors.getContext("2d")) throw new Error("canevas indisponible");
      const g = hors.getContext("2d");
      /* Deux palettes. La sombre est la version principale — c'est un
         ciel. La claire ("éco") existe pour l'impression domestique :
         un aplat noir de 42 cm vide une cartouche et gondole le papier.
         Ni l'une ni l'autre n'utilise de noir ou de blanc absolus :
         le noir pur bouche les détails à l'impression, le blanc pur
         éblouit. */
      const P = eco
        ? { fond:"#F7F8F6", trait:"rgba(70,92,104,.42)", eteinte:"rgba(90,112,128,.30)",
            orbite:"rgba(80,104,112,.30)", titre:"#1A2228", sous:"#5A7078",
            nom:"#54707E", pied:"#8A9AA2" }
        /* Le trait de la version SOMBRE passe de .30 à .45. Mélangé au
           fond quasi noir, il donnait un gris-bleu très sombre sur du
           presque-noir : lisible à l'écran grâce au rétroéclairage,
           invisible sur papier. On s'arrête à .45 et non .55 : au-delà,
           les liaisons pèsent autant que les étoiles et la hiérarchie
           s'inverse — or ce sont les étoiles que le joueur a allumées.
           La version claire n'est PAS retouchée : de l'encre sombre sur
           du papier clair ressort déjà. */
        : { fond:"#080C11", trait:"rgba(104,134,152,.45)", eteinte:"rgba(120,150,170,.22)",
            /* .18 sur fond quasi noir ne survit pas au papier. Monté à
               .30, soit toujours nettement en dessous du .45 des
               liaisons. */
            orbite:"rgba(118,146,152,.30)", titre:"#E8F4F0", sous:"#78A09B",
            nom:"#96B2BE", pied:"#4C6670" };
      g.fillStyle = P.fond;
      g.fillRect(0, 0, LARGEUR + 2*SAIGNEE, HAUTEUR + 2*SAIGNEE);
      /* À partir d'ici, tout se dessine dans le repère du format FINI :
         aucune autre ligne de cette fonction n'a besoin de connaître la
         saignée. */
      g.translate(SAIGNEE, SAIGNEE);

      const zoneW = LARGEUR - 2*MARGE, zoneH = HAUTEUR - BAND_HAUT - BAND_BAS - MARGE;
      const ech = Math.min(zoneW / (b.maxX - b.minX), zoneH / (b.maxY - b.minY));
      const oX = MARGE + (zoneW - (b.maxX - b.minX)*ech)/2 - b.minX*ech;
      const oY = BAND_HAUT + (zoneH - (b.maxY - b.minY)*ech)/2 - b.minY*ech;
      const px = x => oX + x*ech, py = y => oY + y*ech;

      /* Traits de constellation. */
      g.save();
      /* PRÉPARATION POUR LE TIRAGE, et non pour l'écran.

         Mesuré sur le fichier réel : à 1,5 px, un trait fait 0,13 mm en
         A4 et 0,18 mm en A3. Un imprimeur demande 0,25 mm au minimum
         pour un filet CLAIR sur fond SOMBRE, car l'encre s'étale et le
         referme. Simulé puis regardé : à cette finesse, les liaisons de
         Persée, du Cocher et des Gémeaux disparaissent sur papier et il
         ne reste que des points épars.

         3,5 px = 0,30 mm à 300 points par pouce. Le plancher vaut pour
         les DEUX palettes : sur la version claire, le contraste est déjà
         bon, c'est la seule finesse qui posait problème. */
      g.strokeStyle = P.trait; g.lineWidth = Math.max(3.5, 1.1*ech);
      CONSTELLATIONS.forEach(c=>{
        c.lines.forEach(([a, bb])=>{
          const pa = this.points.find(p=>p.c===c && p.i===a);
          const pb = this.points.find(p=>p.c===c && p.i===bb);
          if (!pa || !pb || !pa.lit || !pb.lit) return;
          g.beginPath(); g.moveTo(px(pa.x), py(pa.y)); g.lineTo(px(pb.x), py(pb.y)); g.stroke();
        });
      });
      g.restore();

      /* Étoiles ENCORE ÉTEINTES, en tout premier : de très petits points
         sombres, à peine perceptibles. Elles ne sont pas du décor —
         elles montrent ce qui reste à gagner, et donnent au ciel sa
         profondeur au lieu d'un vide plat. Aucune étoile n'est
         inventée pour remplir : ce sont les vraies positions, simplement
         pas encore allumées. */
      this.points.filter(p => !p.lit && !p.planete).forEach(p=>{
        const m = typeof p.mag === "number" ? p.mag : 3;
        g.beginPath();
        g.fillStyle = P.eteinte;
        g.arc(px(p.x), py(p.y), Math.max(2, (5 - m*.6)*ech*.42), 0, 6.2832);
        g.fill();
      });

      /* Étoiles ALLUMÉES : halo discret puis cœur net, taille selon la
         magnitude réelle. Halo volontairement faible (.30 → .16) et
         resserré : un gros halo passe mal à l'impression, où il
         devient une tache grise plutôt qu'une lueur. */
      this.points.filter(p => p.lit && !p.planete).forEach(p=>{
        const m = typeof p.mag === "number" ? p.mag : 3;
        const x = px(p.x), y = py(p.y);
        /* Sur fond clair, une étoile blanche serait invisible : on
           garde sa teinte mais assombrie, pour qu'elle reste lisible
           tout en conservant son identité. */
        const teinte = eco ? shade(p.color.startsWith("rgb") ? "#3A4A56" : p.color, -.45) : p.color;
        if (!eco) Renderer.blob(g, x, y, Math.max(5, (16 - m*1.7)) * ech, p.color, .16);
        g.beginPath(); g.fillStyle = teinte;
        /* Sur fond clair il n'y a pas de halo pour soutenir le point :
           les étoiles sont donc légèrement grossies, sinon elles se
           perdent sur le papier — vérifié en rendu avant de livrer. */
        const grossi = eco ? 1.35 : 1;
        g.arc(x, y, Math.max(3.5*ech*.55, (7.5 - m*1.15)*ech*.55) * grossi, 0, 6.2832);
        g.fill();
      });

      /* Les rectangles déjà occupés par un nom, partagés entre planètes
         et constellations : les deux familles de noms doivent s'éviter
         mutuellement, pas seulement chacune dans son coin. */
      /* Obstacles a eviter par les etiquettes. Chaque boite porte sa
         propre hauteur : avant, la collision etait testee avec une
         hauteur figee, ce qui rendait impossible d'y mettre autre chose
         que du texte.

         On y met d'abord les ASTRES eux-memes. C'est la correction du
         defaut vu sur l'appareil : « Mercure » etait ecrit EN PLEIN sur
         le disque du Soleil, parce que la liste ne connaissait que les
         autres etiquettes, jamais les corps celestes. */
      const boites = [];
      const heurte = (x, y, l, h) => boites.some(o =>
        !(x + l < o.x || o.x + o.l < x || y + h < o.y || o.y + o.h < y));

      /* Système solaire : anneaux puis corps. */
      if (this.centreSolaire && this.orbites){
        g.save();
        /* Les orbites subissent le même sort que les liaisons : à 1,5 px
           elles font 0,13 mm et s'effacent sur papier. On les monte à
           3 px (0,25 mm), volontairement MOINS que les liaisons à 3,5 :
           un anneau d'orbite doit rester en retrait, il porte le regard
           sans réclamer l'attention. */
        g.strokeStyle = P.orbite; g.lineWidth = Math.max(3.0, 1.0*ech);
        this.orbites.forEach(r=>{
          g.beginPath();
          g.ellipse(px(this.centreSolaire.x), py(this.centreSolaire.y), r*ech, r*.40*ech, 0, 0, 6.2832);
          g.stroke();
        });
        g.restore();
        this.points.filter(p => p.planete && p.lit).forEach(p=>{
          g.beginPath();
          g.fillStyle = eco ? shade(p.color, -.40) : p.color;   // lisible sur fond clair
          g.arc(px(p.x), py(p.y), Math.max(4, p.rayon*ech), 0, 6.2832);
          g.fill();
        });
        /* Les noms des planètes — signalé par Fabien, ils manquaient.
           Même mécanisme anti-chevauchement que pour les
           constellations : au centre de l'orrery, les orbites internes
           sont si serrées que Soleil, Mercure et Vénus se percutaient
           (vu en rendu avant de livrer). Le Soleil est nommé
           au-dessus, les autres en dessous, puis chacun est décalé
           jusqu'à trouver sa place. */
        g.save();
        const tPl = Math.round(38*k);
        g.font = tPl + "px ui-monospace, Menlo, Consolas, monospace";
        g.fillStyle = P.nom; g.textAlign = "left"; g.textBaseline = "top";
        const hPl = tPl * 1.3;
        /* Les disques deviennent des obstacles avant qu'aucun nom ne
           soit place. */
        const astres = this.points.filter(p => p.planete && p.lit);
        astres.forEach(p=>{
          const r = Math.max(4, p.rayon*ech);
          boites.push({ x: px(p.x)-r, y: py(p.y)-r, l: 2*r, h: 2*r });
        });
        astres.forEach(p=>{
          const r = Math.max(4, p.rayon*ech);
          const larg = g.measureText(p.nom).width;
          /* Chaque nom se place SOUS son corps -- y compris le Soleil,
             qui etait seul a etre nomme au-dessus : incoherent a l'oeil,
             signale sur l'appareil. S'il ne tient pas, on essaie plus
             bas, puis au-dessus, puis de plus en plus loin. */
          let x = px(p.x) - larg/2, y = 0, place = false;
          for (let d = 0; d < 10 && !place; d++){
            for (const dy of [ r + 14*k + d*hPl, -(r + 14*k + d*hPl) - hPl ]){
              const yy = py(p.y) + dy;
              if (!heurte(x, yy, larg, hPl)){ y = yy; place = true; break; }
            }
          }
          if (!place) y = py(p.y) + r + 14*k;
          boites.push({ x, y, l: larg, h: hPl });
          g.fillText(p.nom, x, y);
        });
        g.restore();
      }

      /* Les ÉTOILES ALLUMÉES deviennent à leur tour des obstacles.

         Sans cela, seize noms de constellations se posaient sur un astre
         — « Hercule », « Flèche », « Petit Renard » entre autres, mesuré
         puis vu à l'image. Un nom traversé par une étoile passe encore à
         l'écran ; sur un tirage de 42 cm, c'est une faute.

         Le rayon reprend EXACTEMENT la formule de dessin ci-dessus, sans
         le halo : recopier une formule approchée aurait laissé des
         chevauchements d'un ou deux millimètres, les plus vilains. */
      this.points.filter(p => p.lit && !p.planete).forEach(p=>{
        const m = typeof p.mag === "number" ? p.mag : 3;
        const r = Math.max(3.5*ech*.55, (7.5 - m*1.15)*ech*.55) * (eco ? 1.35 : 1);
        boites.push({ x: px(p.x)-r, y: py(p.y)-r, l: 2*r, h: 2*r });
      });

      /* Noms des constellations, décalés tant qu'ils se chevauchent :
         deux noms superposés sur une affiche imprimée sont un défaut
         qu'on ne peut plus corriger après coup. */
      g.save();
      const tNom = Math.round(46*k);
      g.font = tNom + "px ui-monospace, Menlo, Consolas, monospace";
      g.fillStyle = P.nom; g.textBaseline = "top";
      const hNom = tNom * 1.35;
      const parConst = new Map();
      this.points.forEach(p=>{
        if (!p.c || !p.lit) return;
        let e = parConst.get(p.c);
        if (!e){ e = { minX:1e9, maxX:-1e9, maxY:-1e9 }; parConst.set(p.c, e); }
        e.minX = Math.min(e.minX, p.x); e.maxX = Math.max(e.maxX, p.x); e.maxY = Math.max(e.maxY, p.y);
      });
      [...parConst.entries()].sort((u, v) => u[1].maxY - v[1].maxY).forEach(([c, e])=>{
        const nom = T("csn_" + c.id).replace(/\s*(complet|complète|complete|completo|completa|vollständig)(e|s|es)?\.?$/i, "");
        const larg = g.measureText(nom).width;
        /* Annotation décalée en diagonale, pas collée sous l'étoile la
           plus basse : sur une carte astronomique, le nom accompagne la
           figure sans la toucher. */
        const x0 = px((e.minX + e.maxX)/2) - larg/2 + 18*ech;
        const y0 = py(e.maxY) + 40*ech;
        /* On descend d'abord, comme avant. Mais dans les zones denses --
           Cocher, Taureau, Couronne boréale -- descendre ne suffit pas :
           chaque palier retombe sur une autre étoile. On essaie donc
           aussi vers le haut, puis latéralement, à distance croissante.
           Mesuré : 16 noms posés sur un astre avec la seule descente,
           4 en ajoutant les étoiles aux obstacles, 0 avec ces directions. */
        let x = x0, y = y0, place = false;
        /* Quatre directions, pas huit. Mesuré : en ajoutant les diagonales,
           les chevauchements passaient de 2 à 4. Le placement est glouton
           et dépend de l'ordre — un nom qui se dégage en diagonale occupe
           une place dont le suivant avait besoin. Plus de liberté ne donne
           pas un meilleur résultat. */
        for (let i = 0; i < 20 && !place; i++){
          const d = i * hNom * .92, e2 = larg*.65 + d*.5;
          const essais = [ [x0, y0 + d], [x0, y0 - d - hNom],
                           [x0 + e2, y0], [x0 - e2, y0] ];
          for (const [ex, ey] of essais){
            if (!heurte(ex, ey, larg, hNom)){ x = ex; y = ey; place = true; break; }
          }
        }
        boites.push({ x, y, l: larg, h: hNom });
        g.fillText(nom, x, y);
      });
      g.restore();

      /* Titre, progression, pied de page. */
      g.save();
      g.textAlign = "center"; g.textBaseline = "top";
      g.font = "700 " + Math.round(150*k) + "px ui-monospace, Menlo, Consolas, monospace";
      g.fillStyle = P.titre;
      g.fillText(T("sky_poster_title"), LARGEUR/2, 150*k);
      g.font = Math.round(58*k) + "px ui-monospace, Menlo, Consolas, monospace";
      g.fillStyle = P.sous;
      /* Quatre mesures, pas deux. Les étoiles et les niveaux disent
         COMBIEN ; les diamants et les points disent COMMENT. Une affiche
         de fin de parcours qui tait la moitié du parcours est incomplète.

         %g et %r : les seuls symboles de remplacement encore libres —
         %c, %d, %n, %p, %s et %t servent déjà ailleurs dans la couche de
         traduction, et un symbole réutilisé y a déjà causé des dégâts.

         Séparateur de milliers par espace fine insécable : elle ne coupe
         jamais un nombre en fin de ligne, et reste juste dans les six
         langues. */
      const espacer = (n)=> String(n).replace(/\B(?=(\d{3})+(?!\d))/g, "\u202F");
      /* Le pluriel n'obéit pas à la même règle selon la langue : le
         français écrit « 0 point » au SINGULIER, l'anglais, l'espagnol,
         le portugais, l'allemand et l'italien écrivent « 0 points » au
         PLURIEL. Une règle unique aurait été fausse dans cinq langues
         sur six, ou dans la sixième.

         Chaque forme est stockée « singulier|pluriel » dans la même
         entrée : une seule clé par notion, pas deux à maintenir. */
      const pluriel = (cle, n)=>{
        const f = T(cle).split("|");
        const sing = (n === 1) || (n === 0 && I18N.lang === "fr");
        return sing ? f[0] : (f[1] || f[0]);
      };
      const st = SaveManager.data.stars || {};
      const diamants = Object.keys(st).reduce((s,k)=> s + (st[k]||0), 0);
      const nbEtoiles = this.litCount();
      const nbNiveaux = Object.keys(st).length;
      const nbPoints = Math.max(0, Math.round(SaveManager.data.score || 0));
      g.fillText(T("sky_poster_sub")
                   .replace("%s", espacer(nbEtoiles))
                   .replace("%e", pluriel("sky_pl_star", nbEtoiles))
                   .replace("%n", espacer(nbNiveaux))
                   .replace("%v", pluriel("sky_pl_lvl", nbNiveaux))
                   .replace("%g", espacer(diamants))
                   .replace("%r", espacer(nbPoints))
                   .replace("%w", pluriel("sky_pl_pt", nbPoints)),
                 LARGEUR/2, 332*k);
      g.font = Math.round(40*k) + "px ui-monospace, Menlo, Consolas, monospace";
      g.fillStyle = P.pied;
      g.fillText(T("sky_poster_foot"), LARGEUR/2, HAUTEUR - BAND_BAS + 40*k);
      g.restore();

      const nomFichier = "branoxy-mon-ciel-" + (A3 ? "A3" : "A4")
                       + (eco ? "-eco" : "") + (pro ? "-pro-3mm" : "") + ".png";

      /* SORTIE DU FICHIER. Trois fautes corrigées ici, les mêmes que sur
         l'export des relevés :

         1. Le lien n'était pas ajouté à la page. Android ignore purement
            et simplement un clic sur un lien détaché, SANS lever d'erreur.
         2. L'adresse était une « data: ». Un A3 de 17 mégapixels encodé
            ainsi pèse plusieurs dizaines de méga-octets de texte, au-delà
            de ce que certains navigateurs acceptent en téléchargement.
            Un objet Blob passe partout et ne double pas la mémoire.
         3. Le message de succès s'affichait juste après le clic, sans
            rien vérifier. Il ne pouvait donc pas être faux : il ne
            testait rien.

         Et pour une IMAGE sur un téléphone, le partage natif vaut mieux
         qu'un téléchargement : le joueur envoie son ciel ou l'enregistre
         dans sa galerie, au lieu d'aller le chercher dans un dossier. */
      const telecharger = (blob)=>{
        try{
          const url = URL.createObjectURL(blob);
          const lien = document.createElement("a");
          lien.href = url;
          lien.download = nomFichier;
          lien.style.display = "none";
          document.body.appendChild(lien);
          lien.click();
          setTimeout(()=>{ document.body.removeChild(lien); URL.revokeObjectURL(url); }, 600);
          UIManager.toast(T("sky_saved"));
        }catch(e){ UIManager.message(T("sky_save_err")); }
      };
      const sortir = (blob)=>{
        /* Une image vide ou quasi vide ne doit jamais être proposée. */
        if (!blob || blob.size < 5000){ UIManager.message(T("sky_save_err")); return; }
        /* SIGNALÉ PAR FABIEN (25 sept., appareil réel, joueur débloqué) :
           les boutons A4/A3 ne faisaient RIEN, sans le moindre message.
           Cause trouvée en lisant le code, pas en devinant : cette
           fonction ne s'appuyait que sur `navigator.share`, une API de
           NAVIGATEUR — absente ou inerte dans la WebView Android que
           Capacitor utilise pour empaqueter le jeu. Le repli qui suit
           (`telecharger`, un clic sur un lien) ne vaut guère mieux :
           Android ignore un clic sur un lien `blob:`, sans lever
           d'erreur non plus — silence total, dans les deux cas.

           Les DEUX plugins qu'il fallait sont installés dans le projet
           depuis le tout premier robot GitHub (@capacitor/filesystem,
           @capacitor/share) — jamais appelés nulle part avant ce jour.
           Ordre de préférence, du plus fiable au plus large :
           1. Filesystem + Share, l'API native, dans une vraie appli.
           2. Web Share, pour un navigateur de bureau qui le permet.
           3. Le lien `<a download>`, en tout dernier recours. */
        const cap = window.Capacitor && window.Capacitor.Plugins;
        if (cap && cap.Filesystem && cap.Share){
          const lecteur = new FileReader();
          lecteur.onerror = ()=> UIManager.message(T("sky_save_err"));
          lecteur.onload = ()=>{
            cap.Filesystem.writeFile({ path: nomFichier, data: lecteur.result, directory: "CACHE" })
              .then(res => cap.Share.share({ url: res.uri, title: T("sky_poster_title"), dialogTitle: T("sky_poster_title") }))
              .then(()=> UIManager.toast(T("sky_saved")))
              .catch(err=>{
                /* Le joueur a fermé la feuille de partage sans choisir :
                   ce n'est pas un échec, le fichier existe déjà dans le
                   cache. On ne montre rien, comme pour AbortError plus
                   bas. Chaque plate-forme formule ce refus autrement,
                   d'où une recherche large plutôt qu'un seul message. */
                const msg = String((err && err.message) || "").toLowerCase();
                if (msg.includes("cancel") || msg.includes("annul")) return;
                UIManager.message(T("sky_save_err"));
              });
          };
          lecteur.readAsDataURL(blob);
          return;
        }
        if (navigator.share && navigator.canShare){
          try{
            const f = new File([blob], nomFichier, { type: "image/png" });
            if (navigator.canShare({ files: [f] })){
              navigator.share({ files: [f], title: T("sky_poster_title") })
                .catch(err=>{
                  /* AbortError = le joueur a fermé la feuille de partage.
                     Ce n'est pas un échec : on ne montre rien et on ne
                     déclenche pas un téléchargement qu'il n'a pas demandé. */
                  if (err && err.name === "AbortError") return;
                  telecharger(blob);
                });
              return;
            }
          }catch(e){ /* on retombe sur le téléchargement */ }
        }
        telecharger(blob);
      };

      if (hors.toBlob){
        hors.toBlob(sortir, "image/png");
      }else{
        /* Repli pour un navigateur sans toBlob : on repasse par une
           adresse « data: », mais convertie en Blob avant l'envoi. */
        const d = hors.toDataURL("image/png");
        if (!d || d.length < 5000) throw new Error("image vide");
        const bin = atob(d.split(",")[1]);
        const oct = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) oct[i] = bin.charCodeAt(i);
        sortir(new Blob([oct], { type: "image/png" }));
      }
    }catch(e){
      /* Un téléphone peut refuser une image de cette taille (mémoire).
         On le dit, plutôt que de laisser croire à un téléchargement
         silencieux qui n'a jamais eu lieu. */
      UIManager.message(T("sky_save_err"));
    }finally{
      this.cv = sauve.cv; this.ctx = sauve.ctx;
      this.W = sauve.W; this.H = sauve.H; this.view = sauve.view; this.t0 = sauve.t0;
      this.draw(performance.now());
    }
  },

  plongerVers(p){
    if (this.transition) return;                       // déjà en cours : ne pas cumuler
    const niveau = (p.idx + 1) * SKY_LEVELS_PER_STAR;
    /* 2800 ms, pas 620 — signalé par Fabien : « beaucoup trop rapide,
       une fraction de seconde ». Une plongée vers une étoile doit se
       vivre, pas se subir : à cette durée on a le temps de voir la
       constellation grandir et de comprendre où l'on va. */
    const DUREE = 2800;
    const depart = { scale: this.view.scale, ox: this.view.ox, oy: this.view.oy };
    const cible = Math.min(4, Math.max(this.view.scale * 3.2, 2.2));
    const t0 = performance.now();
    this.transition = true;
    this.selected = null;
    Audio_.tap && Audio_.tap();
    const pas = now => {
      /* Le joueur a quitté le Ciel entre-temps (bouton retour) : on
