    if (this.achatEnCours) return;
    const n = Natif.achat();
    if (!n){ UIManager.message(T("buy_unavailable")); return; }
    this.achatEnCours = true;
    try{
      const t = await n.purchaseProduct({ productIdentifier: PRODUIT_DEBLOCAGE, productType: "inapp", quantity: 1 });
      /* Pas d'état renvoyé = la promesse n'aboutit que sur un succès.
         Un état renvoyé qui n'est pas « acheté » = paiement en attente. */
      if (t && t.purchaseState !== undefined && !this.estAchete(t)){
        UIManager.message(T("buy_pending"));
      } else {
        this.debloquer();
        UIManager.message(T("buy_ok"));
      }
    }catch(e){
      const m = Natif.texte(e);
      if (/owned/i.test(m)){ await this.restaurer(false); }           // déjà acheté : on le retrouve
      else if (/cancel|annul|USER_CANCELED/i.test(m)){ /* le joueur a renoncé : rien à dire */ }
      else { UIManager.message(T("buy_fail")); this.note("erreur", "achat : " + m.slice(0, 40)); }
    }finally{ this.achatEnCours = false; }
  },

  /** Retrouver un achat déjà fait (réinstallation, autre téléphone).
      Ne RETIRE jamais rien : un échec de requête ne prouve pas l'absence. */
  async restaurer(silencieux){
    const n = Natif.achat();
    if (!n){ if (!silencieux) UIManager.message(T("buy_unavailable")); return false; }
    try{
      const r = await n.getPurchases({ productType: "inapp" });
      const liste = (r && r.purchases) || [];
      const achat = liste.find(p => p && p.productIdentifier === PRODUIT_DEBLOCAGE && this.estAchete(p));
      if (achat){
        /* Un achat non « acquitté » est remboursé par Google au bout de 3 jours. */
        if (achat.isAcknowledged === false && achat.purchaseToken){
          try{ await n.acknowledgePurchase({ purchaseToken: achat.purchaseToken }); }catch(e){}
        }
        const nouveau = !SaveManager.data.allUnlocked;
        if (nouveau) this.debloquer();
        if (!silencieux) UIManager.message(T("restore_ok"));
        return true;
      }
      if (!silencieux) UIManager.message(T("restore_none"));
    }catch(e){
      if (!silencieux) UIManager.message(T("buy_fail"));
      this.note("erreur", "restauration : " + Natif.texte(e).slice(0, 40));
    }
    return false;
  },

  /** Le mur : atteint au niveau 150, ou en tentant de sauter dessus
      depuis la liste des niveaux. */
  showWall(){
    if (!BOUTIQUE_OUVERTE || !Natif.achat()){ UIManager.message(T("wall_soon")); return; }
    UIManager.message(T("wall_msg"));
    UIManager.show("s-shop");
  },

  /* ---------- PUBLICITÉ ---------- */

  idPub(type){ return (PUB_TEST ? PUB_IDS.test : PUB_IDS.reel)[type]; },

  /** Aucune annonce n'est DEMANDÉE sans consentement établi (RGPD, Europe).
      Trou trouvé le 1er oct. sur le téléphone de Fabien : l'indice et
      l'interstitiel préparaient leur annonce « à la demande » sans
      vérifier ce point — seul le préchargement du lancement le faisait.
      Le cas typique est l'absence de message RGPD dans AdMob : Google ne
      peut alors pas recueillir le consentement, et on ne doit rien demander. */
  pubAutorisee(){ return this.etat.consent === true; },

  /** Consentement (RGPD) : obligatoire en Europe avant toute annonce. */
  async consentement(){
    const a = Natif.pub();
    try{
      let info = await a.requestConsentInfo();
      if (info && info.isConsentFormAvailable && info.status === "REQUIRED") info = await a.showConsentForm();
      const ok = !info || info.canRequestAds !== false;
      this.note("consent", ok);
      return ok;
    }catch(e){
      this.note("consent", false);
      this.note("erreur", "consentement : " + Natif.texte(e).slice(0, 40));
      return false;
    }
  },

  async initPub(){
    const a = Natif.pub();
    if (!a || this.pubInit || this.sansPub()) return;
    this.pubInit = true;
    try{
      await a.initialize();
      if (await this.consentement()){ this.preparerInterstitiel(); this.preparerRecompense(); }
    }catch(e){
      this.pubInit = false;
      this.note("erreur", "pub : " + Natif.texte(e).slice(0, 40));
    }
    this.majDiag();
  },

  preparerInterstitiel(){
    const a = Natif.pub();
    if (!a || !this.pubAutorisee()) return Promise.resolve(false);
    if (this.interPret) return Promise.resolve(true);
    if (this.interPromesse) return this.interPromesse;
    this.interPromesse = Promise.resolve(a.prepareInterstitial({ adId: this.idPub("interstitiel") }))
      .then(()=>{ this.interPret = true; this.note("inter", "annonce chargée"); return true; })
      .catch(e=>{ this.interPret = false; this.note("inter", "chargement refusé : " + Natif.texte(e).slice(0, 40)); return false; })
      .then(v=>{ this.interPromesse = null; return v; });
    return this.interPromesse;
  },

  preparerRecompense(){
    const a = Natif.pub();
    if (!a || !this.pubAutorisee()) return Promise.resolve(false);
    if (this.recoPret) return Promise.resolve(true);
    if (this.recoPromesse) return this.recoPromesse;
    this.recoPromesse = Promise.resolve(a.prepareRewardVideoAd({ adId: this.idPub("recompense") }))
      .then(()=>{ this.recoPret = true; return true; })
      .catch(()=>{ this.recoPret = false; return false; })
      .then(v=>{ this.recoPromesse = null; return v; });
    return this.recoPromesse;
  },

  /** Pose un écouteur du plugin ; le retire dès que l'affaire est finie,
      même si le plugin répond après coup. */
  ecouter(a, nom, rappel, registre, estFini){
    Promise.resolve(a.addListener(nom, rappel)).then(h=>{
      if (estFini()) { try{ h && h.remove && h.remove(); }catch(e){} }
      else registre.push(h);
    }).catch(()=>{});
  },
  retirer(registre){
    registre.forEach(h=>{ try{ h && h.remove && h.remove(); }catch(e){} });
    registre.length = 0;
  },

  maybeInterstitial(after){
    const d = SaveManager.data;
    const a = Natif.pub();
    /* Chaque sortie sans annonce DIT sa raison (ligne de diagnostic des
       Paramètres) : avant, cinq conditions sortaient en silence et, le
       1er oct., « pas de pub tous les 3 niveaux » restait sans explication. */
    const saute = r => { this.note("inter", r); return after(); };
    if (!BOUTIQUE_OUVERTE || !a)                             return saute("kit absent");
    if (this.sansPub())                                      return saute("jeu débloqué : aucune pub");
    if (GameManager.level.n < this.FIRST_AD_LEVEL)           return saute("avant le niveau " + this.FIRST_AD_LEVEL);
    if (d.wins % this.INTERSTITIAL_EVERY !== 0)              return saute("victoire " + d.wins + " : prochaine à " + (d.wins + this.INTERSTITIAL_EVERY - d.wins % this.INTERSTITIAL_EVERY));
    if (performance.now() - this.lastAd < this.MIN_GAP_MS)   return saute("moins de 2 min depuis la dernière");
    /* Jamais d'attente devant un joueur qui vient de gagner : si l'annonce
       n'est pas déjà chargée, on passe et on la prépare pour la prochaine. */
    if (!this.pubAutorisee())                                return saute("consentement absent");
    if (!this.interPret){ this.preparerInterstitiel(); return saute("annonce pas encore chargée"); }
    this.lastAd = performance.now();
    this.interPret = false;
    this.note("inter", "annonce lancée (victoire " + d.wins + ")");
    let fini = false; const registre = [];
    const fin = ()=>{
      if (fini) return; fini = true; clearTimeout(garde);
      this.retirer(registre);
      Audio_.resume();      // la musique reprend après la pub (si le joueur l'a laissée active)
      this.preparerInterstitiel();
      after();
    };
    const garde = setTimeout(fin, this.DELAI_SECURITE_MS);
    this.ecouter(a, "interstitialAdDismissed",    fin, registre, ()=>fini);
    this.ecouter(a, "interstitialAdFailedToShow", fin, registre, ()=>fini);
    /* Signalé par Fabien le 10 oct. : la musique de Branoxy continuait
       sous le son de la pub et les deux se mélangeaient. On coupe le son
       du jeu pendant toute l'annonce. */
    Audio_.suspend();
    Promise.resolve(a.showInterstitial()).catch(fin);
  },

  /** Demande d'abord, toujours : une publicité ne se lance jamais sans
      que le joueur l'ait choisie. */
  rewardedHint(onReward){
    /* Sans consentement, pas d'annonce possible : l'indice est simplement
       donné, sans question qui ne mènerait à rien. */
    if (!BOUTIQUE_OUVERTE || this.sansPub() || !Natif.pub() || !this.pubAutorisee()){ onReward(); return; }
    /* Le bouton sûr dit « Plus tard » : il affichait le libellé par défaut
       de confirm(), « Non, garder », sans aucun sens ici (capture du 1er oct.). */
    UIManager.confirm(T("ad_hint"), T("ad_watch"), ()=> this.lancerRecompense(onReward), "", T("ad_later"));
  },

  assurerRecompense(){
    if (this.recoPret) return Promise.resolve(true);
    UIManager.toast(T("ad_loading"));
    return new Promise(res=>{
      let fini = false;
      const fin = v => { if (!fini){ fini = true; res(v); } };
      setTimeout(()=> fin(false), this.DELAI_CHARGEMENT_MS);
      this.preparerRecompense().then(()=> fin(this.recoPret));
    });
  },

  async lancerRecompense(onReward){
    const a = Natif.pub();
    GameManager.geler();                 // de l'appui sur « Regarder » à la fermeture
    if (!this.pubAutorisee() || !(await this.assurerRecompense())){
      GameManager.degeler();
      /* Aucune annonce à proposer (hors ligne, pas de remplissage) : on
         le dit et l'indice est offert — un bouton qui ne répond pas, ou
         un indice refusé sans raison, serait pire. */
      UIManager.message(T("ad_unavailable"));
      onReward();
      return;
    }
    this.recoPret = false;
    let fini = false, gagne = false, echec = false; const registre = [];
    const fin = ()=>{
      if (fini) return; fini = true; clearTimeout(garde);
      this.retirer(registre);
      GameManager.degeler();
      Audio_.resume();
      this.preparerRecompense();
      if (echec){ UIManager.message(T("ad_unavailable")); onReward(); }
      else if (gagne) onReward();
      else UIManager.message(T("ad_closed_early"));
    };
    const garde = setTimeout(fin, this.DELAI_SECURITE_MS);
    this.ecouter(a, "onRewardedVideoAdReward",       ()=>{ gagne = true; }, registre, ()=>fini);
    this.ecouter(a, "onRewardedVideoAdDismissed",    fin, registre, ()=>fini);
    this.ecouter(a, "onRewardedVideoAdFailedToShow", ()=>{ echec = true; fin(); }, registre, ()=>fini);
    Audio_.suspend();     // même correctif que l'interstitiel : pas de musique sous la pub
    Promise.resolve(a.showRewardVideoAd())
      .then(r=>{ if (r && (r.amount > 0 || r.type)) gagne = true; })
      .catch(()=>{ echec = true; fin(); });
  },

  /** Réglages publicitaires (RGPD) : revoir son choix après coup. */
  async prefsPub(){
    const a = Natif.pub();
    if (!a) return;
    try{ await a.requestConsentInfo(); await a.showPrivacyOptionsForm(); }
    catch(e){ UIManager.message(T("ad_priv_none")); }
  }
};

/* ------------------------------------------------------------------
   GameManager — état d'une partie et règles
   ------------------------------------------------------------------ */
/* ============================================================
   GameManager — état et règles d'une partie
   ------------------------------------------------------------
   Rôle    : niveau en cours, placements, historique, indices,
             chronomètre, pause, victoire et notation.
   Expose  : start(n), place(), turn(), undo(), giveHint(),
             checkWin(), pause(), resume(), isSolved().
   Dépend  : LevelManager, SaveManager, Renderer, UIManager, Audio_.
   Pièges  : start() est le POINT D'ENTRÉE UNIQUE de tout niveau —
             c'est là qu'est appliqué le mur du niveau 150, pour
             qu'aucun appelant ne puisse l'oublier. Et le compteur
             d'indices vit dans la SAUVEGARDE, pas seulement en
             mémoire : sinon un rechargement de page l'effacerait
             et permettrait de contourner la pénalité.
   ============================================================ */
const GameManager = {
  level:null, state:null, running:false, t0:0, elapsed:0, paused:false, pausedAt:0,
  history:[], errors:0, hints:0, repositions:0,
  /* D'où on est venu pour arriver en jeu : "Jouer" (accueil), une
     tuile dans Niveaux, ou une étoile dans le Ciel. Le retour doit
     ramener précisément là, pas systématiquement vers Niveaux même
     quand on n'y est jamais passé — sinon on atterrit sur un écran
     qu'on n'a jamais visité, ce qui ne peut que sembler étrange. */
  cameFrom:"s-home",

  start(n){
    if (DEMO_WEB && n > DEMO_MAX){ UIManager.demoWall(); return; }
    /* Le mur : au-delà du niveau 150, la suite (générée à l'infini)
       demande l'achat. Contrôlé ICI, au point d'entrée unique de tout
       niveau — plutôt que dans chacun des quatre endroits qui appellent
       start() — pour qu'aucun ne puisse l'oublier ou le contourner. */
    if (n > LevelManager.TOTAL && !SaveManager.data.allUnlocked){
      MonetizationManager.showWall();
      return;
    }
    /* Astuce signalée par Fabien, en deux temps. D'abord : prendre un
       indice révèle où une pièce se pose — le joueur le VOIT, sa
       mémoire ne s'efface pas — et « Recommencer » remettait pourtant
       le compteur à zéro. Corrigé une première fois en le conservant
       en mémoire d'un niveau à l'autre tant qu'on ne change pas de
       niveau. Mais Fabien a retrouvé la faille : indice, retour,
       PAGE RECHARGÉE, recommencer de mémoire — la mémoire de
       GameManager s'efface au rechargement, la mémoire du joueur non.
       Le compteur vit donc maintenant dans la sauvegarde elle-même
       (SaveManager.data.hintsEnCours), pas seulement dans l'objet en
       mémoire — un niveau généré étant déterministe (build(n) redonne
       toujours la même solution), seule une vraie victoire (de
       n'importe quelle qualité) efface son entrée. */
    this.hints = SaveManager.data.hintsEnCours[n] || 0;
    this.level  = LevelManager.build(n);
    /* `targetCells` : le motif ramené à des cases ENTIÈRES. Vérifié sur
       300 niveaux — une case coupée a toujours ses deux moitiés dans le
       motif, donc le contour du motif ne comporte jamais de demi-case.
       La victoire se vérifie ainsi case par case, géométriquement. */
    const targetCells = new Set();
    this.level.target.forEach(k=>{ const p = k.split(","); targetCells.add(p[0]+","+p[1]); });
    this.state  = { target: this.level.target, targetCells, occupied: new Map(),
                    cols: this.level.cols, rows: this.level.rows,
                  };
    this.history = []; this.errors = 0; this.repositions = 0;
    this.elapsed = 0; this.t0 = performance.now(); this.running = true; this.paused = false; this.gele = false;
    /* Signalé par Fabien le 4 oct. (captures 08:52-08:53) : pause au niveau 25,
       retour, puis niveau 1 → l'écran « En pause » du niveau 25 restait
       par-dessus (avec son temps 0:12), « Reprendre » ne faisait rien
       (paused était déjà false) et les boutons restaient grisés. Un niveau
       qui démarre efface donc TOUT reste visuel d'une pause précédente,
       quel que soit le chemin de sortie (flèche, retour Android, accueil). */
    this.effacerPause();
    this.lastProgress = this.t0; this.nudging = false;
    Renderer.waves = [];
    Renderer.layout();
    /* PIÈCES FIGÉES : une phrase, la toute première fois seulement.

       Une pièce qui refuse de tourner sans explication passe pour une
       panne. Mais un tutoriel imposé au démarrage est un motif
       d'abandon connu sur mobile — on explique donc au moment exact où
       la règle apparaît, une seule fois, et on ne revient jamais
       dessus. Le drapeau vit dans la sauvegarde : rechargez la page,
       le message ne réapparaît pas. */
    /* Abandons : c'est le signal le plus parlant de tous. Un niveau
       ouvert puis quitté sans victoire dit bien plus qu'une durée
       moyenne — c'est là que le joueur décroche. On incrémente à
       l'ouverture et on annule à la victoire, plutôt que d'essayer
       d'intercepter toutes les façons de quitter (retour, onglet
       fermé, appel entrant), dont certaines ne préviennent jamais. */
    {
      const st = SaveManager.data.stats[n] || (SaveManager.data.stats[n] = { s:0, i:0, e:0, m:0 });
      st.o = (st.o || 0) + 1;                 // ouvertures
      SaveManager.save();
    }
    if (!SaveManager.data.vuFigees && this.level.pieces.some(p => p.fige)){
      SaveManager.data.vuFigees = true;
      SaveManager.save();
      setTimeout(()=> UIManager.message(T("figee_intro")), 620);
    }
    /* GESTE D'ACCUEIL : un disque de contact anime glisse sur la toute
       premiere piece qu'un nouveau joueur voit, une seule fois dans
       toute la vie de l'application.

       Pas de tutoriel textuel : le rapport de la communaute de testeurs
       signalait l'absence de visite guidee, mais un texte imposé au
       démarrage est un motif d'abandon connu sur mobile, et le niveau 1
       enseigne déjà les règles par sa simplicité (3 pièces, aucune
       facette, aucune pièce figée — la configuration la plus dépouillée
       de toute la campagne). Ce qui manquait n'était pas une règle à
       expliquer, mais le geste de départ lui-même : qu'on peut glisser
       une pièce avec le doigt. D'où une DÉMONSTRATION, pas un COURS.

       Repris du langage visuel des captures d'écran tactiles d'Android
       — un disque avec un halo — après deux essais de silhouette de
       main jugés illisibles à cette taille. Le disque est net dès le
       premier essai, à l'inverse de la main. */
    if (!SaveManager.data.vuGeste && n === 1){
      SaveManager.data.vuGeste = true;
      SaveManager.save();
      Renderer.gesteAccueil = { debut: performance.now() + 500, piece: this.level.pieces[0] };
    }
    /* Onde d'ouverture : elle balaie le plateau et annonce la règle du jeu. */
    Renderer.emit(Renderer.board.ox + this.level.cols * Renderer.board.cell / 2,
                  Renderer.board.oy + this.level.rows * Renderer.board.cell / 2,
                  "#6BE6C1", { life:1000, w: Renderer.board.cell * .8, a:.7 });
    UIManager.showGame();
  },

  place(piece, oc, or, silent){
    if (!PieceManager.canPlace(this.state, piece, oc, or)) return false;
    PieceManager.at(piece, oc, or).forEach(p => this.state.occupied.set(PieceManager.keyOf(p), piece.id));
    piece.placed = true; piece.pos = { c: oc, r: or };
    /* Instant de la pose : les coins partagés avec les voisines
       s'affûtent progressivement au lieu de changer d'un coup. */
    piece.settledAt = performance.now();
    if (!silent){
      Audio_.place(); buzz(12); Renderer.emitFromPiece(piece, oc, or);
      /* Garer une pièce hors du motif n'est pas un progrès : sans cette
         distinction, un joueur qui déplace des pièces sans avancer ne
         paraissait jamais bloqué, et l'appel discret à l'indice après
         45 s ne s'allumait plus jamais. */
      const dansLeMotif = PieceManager.at(piece, oc, or)
        .every(p => this.state.targetCells.has(p.c + "," + p.r));
      if (dansLeMotif) this.lastProgress = performance.now();
    }
    return true;
  },

  remove(piece){
    if (!piece.placed) return;
    PieceManager.at(piece, piece.pos.c, piece.pos.r).forEach(p => this.state.occupied.delete(PieceManager.keyOf(p)));
    piece.placed = false; piece.pos = null;
  },

  turn(piece){
    /* Garde-fou (audit) : pivoter une pièce POSÉE ferait tourner ses
       cases sans mettre à jour la grille d'occupation — la grille
       garderait des cases fantômes et le niveau deviendrait insoluble.
       Aucun chemin ne le fait aujourd'hui (l'interface ne pivote que
       les pièces de la réserve, et giveHint retire la pièce avant de
       la tourner), mais rien ne le garantissait : c'était une
       convention respectée par les appelants, pas une règle. Renvoie
       false pour que les boucles `while (rot !== 0)` puissent sortir
       au lieu de tourner à l'infini. */
    if (piece.placed) return false;
    if (piece.fige) return false;      // pièce figée : rotation interdite (voir craft)
    piece.cells = PieceManager.rotate(piece.cells);
    piece.rot = (piece.rot + 1) % 4;
    return true;
  },

  push(action){ this.history.push(action); if (this.history.length > 60) this.history.shift(); },

  /** Annule la dernière action. Renvoie false s'il n'y avait rien à
      annuler — l'appelant peut alors le dire au joueur, plutôt que de
      laisser le bouton paraître cassé. */
  undo(){
    const a = this.history.pop();
    if (!a) return false;
    const p = this.level.pieces[a.id];
    if (a.type === "place"){ this.remove(p); }
    if (a.type === "remove"){ this.place(p, a.pos.c, a.pos.r, true); }
    if (a.type === "rotate"){ for (let i = 0; i < 3; i++) this.turn(p); }
    if (a.type === "rotate-board"){
      /* Symétrique de tournerSurPlace() : retirer, tourner 3 fois pour
         revenir à l'orientation de départ, reposer au même endroit.
         La pose doit réussir puisqu'elle a déjà réussi une fois avec
         cette même forme à ce même endroit — sinon l'action n'aurait
         pas été enregistrée dans l'historique. */
      this.remove(p);
      for (let i = 0; i < 3; i++) this.turn(p);
      this.place(p, a.pos.c, a.pos.r, true);
    }
    if (a.type === "move"){ this.remove(p); this.place(p, a.pos.c, a.pos.r, true); }
    if (a.type === "hint"){ this.restore(a.snap); }
    Audio_.turn(); Renderer.layout();
    /* Annuler peut REPOSER une pièce — annuler un retrait, ou annuler un
       indice — et donc compléter le motif. Sans ce contrôle, le joueur
       gagnait et il ne se passait rien : vérifié sur 21 niveaux, la
       victoire n'était détectée dans aucun cas. */
    this.checkWin();
    return true;
  },

  /** Ce que les pièces couvrent réellement, case par case. */
  coverage(){
    const cells = new Map();   // "c,r" → { whole, tris }
    this.state.occupied.forEach((id, k)=>{
      const p = k.split(",");
      const key = p[0] + "," + p[1];
      let e = cells.get(key);
      if (!e){ e = { whole:false, tris:new Set() }; cells.set(key, e); }
      if (p.length < 3) e.whole = true; else e.tris.add(p[2]);
    });
    return cells;
  },
  /** Une case est-elle entièrement recouverte ? Soit par une case pleine,
      soit par deux facettes complémentaires qui la reconstituent. */
  cellFull(e){
    if (!e) return false;
    if (e.whole) return true;
    return [...e.tris].some(t => e.tris.has(PieceManager.COMPLEMENT[t]));
  },
  /** Gagné quand le motif est exactement couvert : chaque case pleine, et
      rien qui déborde en dehors. Le simple décompte de cases ne suffit
      plus, maintenant qu'une pièce peut être garée hors du motif ou
      qu'une case peut se remplir de deux façons différentes. */
  isSolved(){
    const cov = this.coverage();
    for (const key of cov.keys()) if (!this.state.targetCells.has(key)) return false;
    for (const key of this.state.targetCells) if (!this.cellFull(cov.get(key))) return false;
    return true;
  },
  /** Un emplacement du motif est-il recouvert ? Sert au rendu des cases
      encore vides : une case pleine posée par-dessus une case coupée la
      recouvre bel et bien, même si les clés ne se correspondent pas. */
  isCovered(key){
    const p = key.split(",");
    const cellKey = p[0] + "," + p[1];
    const e = this.coverage().get(cellKey);
    if (!e) return false;
    if (e.whole) return true;
    return p.length < 3 ? this.cellFull(e) : e.tris.has(p[2]);
  },

  /** Photographie complète de l'état des pièces — sert aux actions qui
      en déplacent plusieurs d'un coup (l'indice), pour pouvoir revenir
      exactement en arrière plutôt que de renoncer à annuler. */
  snapshot(){
    return this.level.pieces.map(p => ({
      id: p.id, placed: p.placed, pos: p.pos ? { ...p.pos } : null, rot: p.rot
    }));
  },
  restore(snap){
    this.level.pieces.forEach(p => { if (p.placed) this.remove(p); });
    snap.forEach(s => {
      const p = this.level.pieces[s.id];
      while (p.rot !== s.rot) this.turn(p);
      if (s.placed && s.pos) this.place(p, s.pos.c, s.pos.r, true);
    });
  },

  /** Indice : pose une pièce à sa place, en retirant ce qui gêne. */
  giveHint(){
    const p = this.level.pieces.find(x => !x.placed) || this.level.pieces.find(x =>
      !x.pos || x.pos.c !== x.solution.c || x.pos.r !== x.solution.r);
    if (!p) return;
    /* L'indice déplace plusieurs pièces d'un coup : on photographie
       l'état avant, pour qu'il reste annulable. Auparavant il effaçait
       tout l'historique — après un indice, le bouton Annuler ne faisait
       plus rien du tout, sans le moindre signe. */
    const avant = this.snapshot();
    this.remove(p);
    /* Sortie garantie : turn() peut refuser (pièce figée), auquel cas
       la pièce est déjà dans sa seule orientation possible. */
    let garde = 0;
    while (p.rot !== 0 && garde++ < 4){ if (!this.turn(p)) break; }
    const cells = PieceManager.at(p, p.solution.c, p.solution.r);
    cells.forEach(cell=>{
      /* Toutes les pièces qui empiètent réellement, pas seulement celles
         qui occupent la même clé : depuis qu'une pièce peut se garer
         librement, une case pleine peut bloquer une facette sans porter
         la même clé qu'elle. */
      PieceManager.blockingKeys(cell).forEach(k=>{
        const owner = this.state.occupied.get(k);
        if (owner !== undefined) this.remove(this.level.pieces[owner]);
      });
    });
    this.place(p, p.solution.c, p.solution.r);
    this.hints++;
    /* Écrit dans la sauvegarde à chaque indice, pas seulement en
       mémoire — c'est ce qui fait survivre le compteur à un
       rechargement complet de la page, pas seulement à un
       « Recommencer ». */
    SaveManager.data.hintsEnCours[this.level.n] = this.hints;
    SaveManager.save();
    /* Dès le premier indice, ce niveau ne rapportera plus ni étoile ni
       point (voir checkWin — règle demandée : favoriser nettement le
       joueur qui n'utilise aucun indice). Mais à partir du DEUXIÈME,
       l'indice coûte aussi réellement : une ponction directe sur le
       score total déjà accumulé, qui grandit à chaque indice
       supplémentaire — 1 unité au 2e, 2 au 3e, 3 au 4e, ainsi de suite.
       L'unité elle-même suit la taille du niveau (8 % de sa base de
       points), pour qu'un indice sur un grand niveau coûte plus cher
       qu'un indice sur un petit — mesuré sur toute la campagne : de 4
       points (niveau 1) à 12 points (niveau 150) l'unité. */
    if (this.hints >= 2){
      const base = this.level.pieces.length * 10 + this.level.target.size;
      const unite = Math.round(base * .08);
      const cout = (this.hints - 1) * unite;
      SaveManager.data.score = Math.max(0, SaveManager.data.score - cout);
      SaveManager.save();
      UIManager.toast(T("hint_cost_msg").replace("%n", cout));
      /* Le score affiché en jeu doit refléter la ponction tout de
         suite : c'est précisément au moment où il baisse que le joueur
         a besoin de le voir. */
      UIManager.majLigneJeu();
    }
    this.push({ type:"hint", id:p.id, snap: avant });
    Renderer.layout();
    this.checkWin();
  },

  /* Le seuil des 3 étoiles exigeait autrefois « moins de 3 erreurs » —
     une erreur étant un lâcher hors du motif. Depuis que les pièces se
     posent librement, une erreur n'est presque plus possible : le
     critère ne filtrait plus rien. Il est remplacé par le nombre de
     REPRISES : une pièce qu'on repose ailleurs après l'avoir posée. Ça
     mesure l'hésitation réelle, ce qui était l'intention d'origine, et
     ça reste vrai quelle que soit la règle de placement. Aucune
     pénalité pour explorer : trois repositionnements restent gratuits. */
  stars(seconds){
    /* Plus de pénalité d'indice ici : vérifié, checkWin() n'appelle
       cette fonction QUE si aucun indice n'a servi (sinon la note est
       zéro d'office). Le terme HINT_PENALTY valait donc toujours zéro —
       du code mort qui laissait croire à une règle qui n'existait plus.
       Retiré plutôt que laissé en place, pour que ce qu'on lit ici
       corresponde à ce qui se passe vraiment. */
    if (this.repositions <= 3 && seconds <= this.level.parTime) return 3;
    if (seconds <= this.level.parTime * 2.2)                    return 2;
    return 1;
  },

  /** Met le chronomètre en attente — au clic sur son propre affichage,
      ou automatiquement quand l'app passe en arrière-plan (un appel,
      un verrouillage d'écran) : sans ça, le temps continuait à courir
      pendant l'absence, pénalisant un joueur pour avoir simplement
      reposé son téléphone. Bloque aussi le plateau : le recouvrement
      couvre le canevas et intercepte le tactile avant qu'il l'atteigne. */
  pause(){
    if (!this.running || this.paused || !this.level) return;
    this.paused = true;
    this.pausedAt = performance.now();
    document.getElementById("pause-time").textContent = fmt(Math.floor(this.elapsed / 1000));
    document.getElementById("ov-pause").classList.add("on");
    document.querySelector(".gamebar").classList.add("paused");
    /* Signalé par Fabien : la musique continuait pendant la pause. Elle
       se coupait bien quand on quittait le jeu ou passait en arrière-
       plan — ces deux cas-là étaient traités — mais pas sur une pause
       demandée, qui est pourtant le moment où l'on souhaite le plus
       souvent le silence. On réutilise exactement le même chemin que
       le passage en arrière-plan, déjà éprouvé. Les sons décodés
       restent en cache, donc la reprise est immédiate — seule la
       boucle en cours repart de son début. */
    Audio_.suspend();
  },
  /** Décale le départ du chronomètre de la durée exacte de la pause,
      pour que le temps repris exclue vraiment l'absence — pas une
      simple remise en marche qui aurait compté la pause elle-même. */
  /** Retire l'écran de pause et rend les boutons du jeu actifs. */
  effacerPause(){
    document.getElementById("ov-pause").classList.remove("on");
    const barre = document.querySelector(".gamebar");
    if (barre) barre.classList.remove("paused");
  },
  resume(){
    /* Défense en profondeur : si l'écran de pause est affiché alors que le
       jeu ne se croit pas en pause, « Reprendre » le retire quand même —
       un bouton visible ne doit jamais rester sans effet. */
    if (!this.paused){ this.effacerPause(); return; }
    Audio_.resume();      // reprend exactement où la pause l'avait laissée
    const duree = performance.now() - this.pausedAt;
    this.t0 += duree;
    this.lastProgress += duree;
    this.paused = false;
    document.getElementById("ov-pause").classList.remove("on");
    document.querySelector(".gamebar").classList.remove("paused");
  },

  /** Gel SILENCIEUX du chronomètre, sans écran de pause : pendant une
      publicité demandée par le joueur pour un indice. Signalé par Fabien
      le 1er oct. : le temps continuait de courir pendant l'annonce, qui
      coûtait donc des diamants en plus de durer. degeler() décale le
      départ de la durée exacte du gel, comme resume(). */
  gele: false, geleAt: 0,
  geler(){
    if (this.gele) return;
    this.gele = true;
    this.geleAt = performance.now();
  },
  degeler(){
    if (!this.gele) return;
    const duree = performance.now() - this.geleAt;
    this.t0 += duree;
    this.lastProgress += duree;
    this.gele = false;
  },

  checkWin(){
    if (!this.isSolved() || !this.running) return;
    this.running = false;
    const seconds = Math.round(this.elapsed / 1000);
    const milestone = LevelManager.isMilestone(this.level.n);
    /* Ce niveau fait-il apparaître une nouvelle étoile dans le Ciel ?

       Deuxième signalement de Fabien, avec capture : après le premier
       correctif (le Ciel comptait enfin les niveaux réellement
       résolus), il a joué les niveaux 65 puis 80 — deux niveaux — et
       vu DEUX étoiles s'envoler. La cause : ce test-ci avait gardé sa
       propre règle, indépendante du Ciel, fondée sur le seul numéro du
       niveau (`n % 5 === 0`). 65 et 80 étant tous deux des multiples
       de 5, chacun offrait son étoile — alors que le Ciel, lui, n'en
       comptait aucune de plus. Deux systèmes qui se contredisaient.

       Désormais une seule règle, celle du Ciel : une étoile n'apparaît
       que lorsque le nombre de niveaux DISTINCTS réellement résolus
       franchit un nouveau palier de cinq. Jouer uniquement les niveaux
       « ronds » (5, 10, 65, 80…) ne rapporte donc plus rien de
       particulier : il faut cinq vrais niveaux de plus, quels qu'ils
       soient, et refaire un niveau déjà résolu ne compte pas. */
    const nbResolus = Object.keys(SaveManager.data.stars).length;
    const niveauInedit = SaveManager.data.stars[this.level.n] === undefined;
    const etoilesAvant = SkyManager.etoilesPour(nbResolus);
    const etoilesApres = SkyManager.etoilesPour(nbResolus + (niveauInedit ? 1 : 0));
    const nouvelleEtoile = etoilesApres > etoilesAvant;
    /* L'étoile qui s'envole est précisément celle qui vient de
       s'allumer dans le Ciel — plus jamais une autre. */
    const skyIdx = nouvelleEtoile ? etoilesApres - 1 : -1;

    /* La nappe part maintenant : elle dure 500 ms et se termine donc
       avant l'envol de l'étoile, prévu au plus tôt à 600 ms. */
    Renderer.eclatAt = performance.now();
    Audio_.win(milestone);
    buzz(nouvelleEtoile ? [16,45,16,45,16,45,25,140] : milestone ? [20,50,20,50,34] : [18,60,18]);
    /* Toutes les pieces s'allument l'une apres l'autre. */
    this.level.pieces.forEach((p, i) => setTimeout(()=>{
      if (p.pos) Renderer.emitFromPiece(p, p.pos.c, p.pos.r,
        { life:950, a:1, w: Renderer.board.cell * .7 });
    }, i * 75));
    const B = Renderer.board, cx = B.ox + this.level.cols * B.cell / 2, cy = B.oy + this.level.rows * B.cell / 2;
    /* Sur un jalon, deux ondes dorées supplémentaires partent du centre
       du plateau — rien à lire, juste un peu plus de lumière que
       d'habitude. C'est tout le message. */
    if (milestone){
      [0, 260].forEach(delay => setTimeout(()=>
        Renderer.emit(cx, cy, "#FFD25E", { life:1200, a:.85, w: B.cell * 1.1, max: Math.max(Renderer.W, Renderer.H) }),
      delay));
    }
    if (nouvelleEtoile){
      const delai = Math.min(600, this.level.pieces.length * 75 + 120);
      /* Le popup des étoiles et du score apparaît à 36 % de la scène
         (voir #win-pop en CSS). Un envol lancé du centre du plateau
         tombait pile dans cette zone — les deux se percutaient à
         l'écran. Point de départ remonté nettement au-dessus, quitte à
         ne plus être le centre géométrique exact du plateau. */
      const cyEnvol = Math.min(Renderer.H * 0.27, B.oy + this.level.rows * B.cell * 0.22);
      const corps = SKY_STARS[skyIdx];
      /* Bug trouvé en ajoutant les planètes : au-delà des étoiles, la
         couleur suivait encore le cycle générique COLORS[idx%8], sans
         rapport avec la vraie couleur de la planète — Jupiter s'envolait
         en rose au lieu de son propre orange. Et la forme scintillante
         d'une étoile n'a pas de sens pour un monde : ce doit être une
         sphère, pas un point à branches. */
      const estPlanete = corps && corps.planete;
      const couleur = estPlanete ? PLANETS[corps.i][3] : COLORS[skyIdx % COLORS.length];
      const geante = estPlanete && PLANETES_GEANTES.has(PLANETS[corps.i][0]);
      setTimeout(()=>{
        Renderer.launchStar(cx, cyEnvol, couleur, estPlanete, geante);
        Audio_.starRise();
      }, delai);
    }

    /* Dès qu'un indice a été pris sur ce niveau — même un seul — plus
       aucune étoile ni point pour lui : favoriser nettement le joueur
       qui n'en utilise aucun, sans zone grise ni calcul partiel. Le
       vrai coût des indices vient d'ailleurs désormais (la ponction
       croissante sur le score total, dans giveHint) — ici, c'est
       simplement : avec indice, rien à gagner sur ce niveau précis.
       La progression continue normalement : le niveau reste débloqué,
       seule la récompense de performance est nulle. */
    const indiceUtilise = this.hints > 0;
    const stars = indiceUtilise ? 0 : this.stars(seconds);
    const brut = indiceUtilise ? 0 : SaveManager.points(this.level, seconds);
    /* Rejeu : seul le progrès rapporte (voir SaveManager.pointsAcquis).
       Calculé AVANT record(), qui met à jour meilleur temps et diamants. */
    const acquis = SaveManager.pointsAcquis(this.level);
    const gained = Math.max(0, brut - acquis);
    let dejaAcquis = false;
    if (!indiceUtilise && gained === 0 && SaveManager.completed(this.level.n)){
      /* Le message ne promet que ce que la règle tient. Vu sur capture de
         Fabien : niveau 4 fini en 0:09, maximum déjà atteint, et le popup
         disait « battez votre temps » — plus vite ne rapportait rien.
         Le plafond vient de points() lui-même (temps nul), jamais d'une
         constante recopiée qui pourrait diverger. */
      const plafond = SaveManager.points(this.level, 0);
      dejaAcquis = Math.max(acquis, brut) < plafond ? "mieux" : "max";
    }
    if (brut > acquis) SaveManager.data.pts[this.level.n] = brut;
    SaveManager.record(this.level.n, stars, seconds, gained);
    /* La tentative est conclue, quelle que soit sa note — plus rien à
       protéger contre un rechargement pour CE niveau tant qu'il n'est
       pas retenté. Sans ce nettoyage, un niveau une fois pris aux
       indices resterait bloqué à zéro pour toujours, même après une
       vraie résolution honnête ultérieure. */
    delete SaveManager.data.hintsEnCours[this.level.n];
    SaveManager.save();
    /* Le popup recouvre le plateau : il attend la fin de la nappe au lieu
       d'un délai fixe. Dérivé de la constante, pour qu'un changement de
       durée ne réintroduise pas le recouvrement en silence. */
    setTimeout(()=> MonetizationManager.maybeInterstitial(()=> UIManager.winPop(stars, gained, dejaAcquis)),
               Renderer.ECLAT_MS - 30);
  }
};

/* ------------------------------------------------------------------
   Couleurs utilitaires
   ------------------------------------------------------------------ */
function rgbOf(hex){ const n = parseInt(hex.slice(1), 16); return [n>>16 & 255, n>>8 & 255, n & 255]; }
function hexa(hex, a){ const c = rgbOf(hex); return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")"; }
function shade(hex, amt){
  const c = rgbOf(hex), t = amt > 0 ? 255 : 0, k = Math.abs(amt);
  return "rgb(" + c.map(v => Math.round(v + (t - v) * k)).join(",") + ")";
}
/* Coins arrondis : disponibles partout depuis Chrome 99 / Safari 16, avec repli. */
const HAS_ROUND = typeof Path2D !== "undefined" && typeof Path2D.prototype.roundRect === "function";
function rr(path, x, y, w, h, r){
  if (!(w > 0) || !(h > 0)) return;                       /* rien à tracer */
  const k = Math.max(0, Math.min(r, w/2, h/2, 40));       /* rayon toujours valide */
  HAS_ROUND ? path.roundRect(x, y, w, h, k) : path.rect(x, y, w, h);
}

/* ------------------------------------------------------------------
   Renderer — plateau, réserve, glisser-déposer et système de lumière

   Principe repris de Station Verte : le décor est sombre et la lumière
   vient des événements. Ici, chaque pièce posée devient une lampe, et
   chaque geste envoie une onde qui balaie le plateau. Le niveau
   s'éclaire donc à mesure qu'il se remplit.

   La lumière est calculée sur un canevas au quart de la résolution puis
   agrandie : l'agrandissement fait office de flou, pour un coût nul.
   ------------------------------------------------------------------ */
/* ============================================================
   Renderer — dessin du plateau
   ------------------------------------------------------------
   Rôle    : plateau, pièces, réserve, lumière, ondes, animations.
   Expose  : init(), layout(), draw(), piece(), outline(),
             roundedLoop(), blob(), ring(), emit(), launchStar().
   Dépend  : PieceManager, GameManager, THEMES.
   Pièges  : piece() est la SEULE fonction qui dessine une pièce —
             l'accueil l'appelle aussi, pour que l'aperçu soit
             exactement ce que le jeu montre, jamais une imitation.
             Les pièces sont dessinées à coins VIFS partout
             (sharp:true) : tout arrondi serait une régression.
   ============================================================ */
/* ------------------------------------------------------------------
   VERRE — moteur WebGL2 des pièces (PALIER 1 : plomberie)
   ------------------------------------------------------------------
   Rôle    : rendre le corps d'une pièce sur le processeur graphique.
   Dépend  : PieceManager (dimensions).
   Piège   : ce module peut échouer à TOUT moment — contexte refusé,
             nuanceur qui ne compile pas, contexte perdu quand le
             téléphone reprend la main. Chaque échec doit ramener au
             rendu actuel, jamais à un écran noir. `actif` est la seule
             chose que l'appelant doit regarder.

   Palier 1 volontairement NU : couleur plate, aucune lumière, aucun
   relief. L'objectif n'est pas d'être joli mais de prouver que le
   contexte s'ouvre, que la géométrie tombe au bon endroit et que le
   repli fonctionne. Le relief actuel reste en place tant que ce palier
   n'est pas validé sur un vrai téléphone.

   Écrit sans pouvoir être exécuté ici : mon environnement n'a pas de
   navigateur, donc ni contexte GL, ni compilation de nuanceur, ni
   image. La vérification se fait sur l'appareil.
   ------------------------------------------------------------------ */
const Verre = {
  actif: false,
  essaye: false,
  raison: "",              // pourquoi c'est indisponible, utile en test
  manquants: "",           // uniformes introuvables, remontés dans le diagnostic
  verifie: false,          // le résultat a-t-il été relu au moins une fois ?
  cv: null, gl: null, prog: null, buf: null, tex: null,

  /* CACHE. Le rendu d'une pièce ne dépend que de sa forme, de la taille
     de case et de sa couleur — jamais de sa position. Il est donc
     calculé une fois puis réutilisé.

     Son absence était un vrai défaut : `rendre()` refaisait tout le
     relief À CHAQUE IMAGE, pour chaque pièce dessinée. Tant que ce
     calcul restait léger le jeu l'absorbait ; la taille en gemme, elle,
     coûte bien plus cher, et le déplacement d'une pièce est devenu
     poussif. Le rendu processeur, lui, cachait depuis toujours.

     On garde le CANEVAS fini, pas seulement la carte de relief : cela
     évite aussi de renvoyer près d'un mégaoctet de texture au
     processeur graphique à chaque image. */
  cache: new Map(),
  MAX: 48,

  /* Microstructure de cristal, embarquée en Data URL : le jeu doit rester
     UN seul fichier, aucune ressource externe. 18 Ko en WebP. Le 512 a été

  /* Le chargement d'une image est ASYNCHRONE. Piège réel : les premières
     pièces seraient dessinées puis MISES EN CACHE sans la texture, et le
     resteraient toute la partie. On vide donc le cache à l'arrivée de
     l'image, sinon l'effet n'apparaîtrait qu'après un changement de
     taille d'écran. */
  chargerGrain(gl){
    if (this.grainDemande) return;
    this.grainDemande = true;
    const img = new Image();
    img.onload = ()=>{
      try{
        const t = gl.createTexture();
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, t);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, img);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.generateMipmap(gl.TEXTURE_2D);
        gl.activeTexture(gl.TEXTURE0);
        this.grainTex = t; this.grainPret = true;
        this.vider();
      }catch(e){ this.grainPret = false; }
    };
    /* Si l'image échoue, on ne casse rien : les pièces sortent sans
       inclusions, c'est-à-dire le rendu validé avant cette étape. */
    img.onerror = ()=>{ this.grainPret = false; };
    img.src = this.GRAIN_SRC;
  },
  aPos: -1, uRes: null, uCol: null, uCarte: null, uDispersion: null,
  uGrain: null, uTaille: null, uCellPx: null,
  uInclusion: null, uInclEchelle: null, uInclParal: null,
  uInclMoy: null, uInclEcart: null,
  /* Proportions de la taille, en fraction d'une case. Chacune a été
     réglée en simulant le rendu hors ligne et en REGARDANT l'image, sur
     quinze formes différentes — pas sur une seule pièce.

     BOMBE   : courbure douce sur la pièce entière. C'est elle qui donne
               le volume. Sans elle, une table plane donne une couleur
               plane, quelle que soit la qualité du biseau.
     BISEAU  : largeur de l'arête extérieure, BORNÉE. C'est le garde-fou
               le plus important du lot : quand le biseau pouvait
               s'élargir jusqu'à la demi-épaisseur, une case isolée
               devenait un toit à quatre pans et un bras d'une case une
               gouttière. Vu à l'image, corrigé ici.

     TABLE_L : largeur de la seconde marche, celle de la table.
     TABLE_H : sa hauteur, volontairement faible.

               biseaux se rencontrent et la paroi devient presque
               verticale : la normale bascule à l'horizontale et l'éclat
               sature en tache pâle. Une taille réelle n'a pas de paroi
               verticale ; on plafonne donc la géométrie plutôt que de
               rattraper la couleur ensuite. */
  /* BOMBE ramenée de 0.30 à 0.14 et BOMBE_L de 0.55 à 0.28.

     Motif, et il n'a rien d'esthétique : sur un bras d'une case de large,
     une bombure de 0.55 case couvre TOUTE la demi-largeur. La pièce
     n'avait plus de table du tout, c'était un coussin — pente moyenne
     mesurée à 0.56, presque partout. D'où des bras en tube et, dans
     chaque angle rentrant, un gros reflet pâle arrondi.

     Diagnostic obtenu en coupant les termes lumineux un par un : la tache
     restait dans les six cas. Ce n'était donc pas de la lumière, mais de
     la géométrie. Pente moyenne désormais 0.35. */
  BOMBE: 0.14,
  /* Largeur sur laquelle la bombure monte, en fraction de case. C'est le
     MÊME bornage que sur le biseau, et je ne l'avais pas appliqué ici :
     sans lui la bombure grimpe jusqu'au centre de la pièce, ce qui
     fabrique un toit à quatre pans dès qu'une pièce dépasse deux cases —
     de grandes diagonales en travers, vues sur l'appareil. Bornée, elle
     ne travaille que près du bord et le coeur reste une table. */
  BOMBE_L: 0.28,
  BISEAU: 0.16,
  PROF: 0.20,
  TABLE_L: 0.16,
  TABLE_H: 0.075,
  PENTE_MAX: 0.85,

     frange devient un arc-en-ciel de mauvais goût ; en dessous de 0,02
     elle ne se voit plus. */

     pierre. Reglees en simulant le rendu hors ligne et en regardant les
     images, sur un plateau a la taille reelle d'un telephone.
     INCLUSION    : intensite. Au-dela de ~1.2 la pierre devient sale.
     INCL_ECHELLE : cotes d'une tuile, en cases. Assez large pour qu'aucune
                    piece n'atteigne le raccord de la texture.
     INCL_PARAL   : decalage par la normale. C'est lui qui place les
                    inclusions DANS la matiere et non sur la surface. */

  INCL_ECHELLE: 5.07,
  INCL_PARAL: 0.22,

     ici evite de recentrer la carte a chaque pixel. */

  INCL_ECART: 0.09222,

precision highp float;
in vec2 pos;                 // position en pixels, origine en haut à gauche
uniform vec2 res;            // taille du tampon, en pixels
out vec2 uv;
void main(){
  vec2 z = pos / res;                    // 0..1
  uv = z;
  gl_Position = vec4(z.x * 2.0 - 1.0, 1.0 - z.y * 2.0, 0.0, 1.0);
}`,

  /* PIERRE TAILLÉE — éclairage physique sur carte de normales.

     Le relief n'est plus reconstruit ici. Il arrive tout fait dans la
     texture : le processeur envoie la NORMALE de la surface, déjà
     calculée à partir des deux champs de distance. Trois raisons :

     1. Une hauteur transmise sur 8 bits se dérive mal — la pente en
        sort en escalier, donc l'éclairage aussi. Une normale sur 8 bits,
        en revanche, est exactement ce que fait une carte de normales
        depuis vingt ans.
     2. Quatre lectures de texture par pixel disparaissent.
     3. Le plafond de pente et le bornage du biseau se règlent sur le
        processeur, là où on peut les vérifier.

     Ce nuanceur ne fait donc plus qu'une chose : de la lumière. Mais de
     la vraie — GGX, Fresnel de Schlick, environnement, dispersion,
     compression sur la luminance seule.

     Canaux : R,G = normale (x,y) ramenée dans 0..1, B = épaisseur
     traversée, A = couverture. */
  FRAGMENT: `#version 300 es
precision highp float;
uniform vec4 col;
uniform sampler2D carte;      // RG = normale, B = épaisseur, A = couverture
uniform float dispersion;     // écart d'indice entre le rouge et le bleu
uniform sampler2D grain;      // microstructure vue à travers la pierre
uniform vec2 taille;          // dimensions de la pièce, en pixels
uniform float cellPx;         // côté d'une case, en pixels
uniform float inclusion, inclEchelle, inclParal, inclMoy, inclEcart;
in vec2 uv;
out vec4 sortie;

/* sRGB vers linéaire. Sans cette conversion, tout le calcul se fait sur
   des valeurs d'affichage et la couleur part au gris dès qu'un reflet
   arrive : c'est le défaut qu'on a vu à l'image. */
vec3 versLineaire(vec3 c){
  return mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)),
             step(vec3(0.04045), c));
}

/* Environnement de studio, SOMBRE et légèrement teinté par la pierre.
   Un ciel gris se réfléchirait sur la tranche et donnerait ce liseré
   gris qui fait "chrome" : une gemme colorée ne renvoie pas du gris. */
vec3 boite(vec3 d, vec3 axe, float taille, float force, vec3 teinte){
  float k = clamp((dot(d, normalize(axe)) - (1.0 - taille)) / taille, 0.0, 1.0);
  k = k * k * (3.0 - 2.0 * k);
  return k * k * k * force * teinte;
}
vec3 environnement(vec3 d, vec3 cle, vec3 pierre){
  float up = -d.y;
  vec3 ciel  = vec3(0.10, 0.14, 0.22);
  vec3 horiz = vec3(0.035, 0.042, 0.058);
  vec3 sol   = vec3(0.007, 0.009, 0.013);
  float t = clamp((up + 0.15) / 0.9, 0.0, 1.0);
  vec3 e = (up > 0.0) ? mix(horiz, ciel, t)
                      : sol + (horiz - sol) * clamp(1.0 + up * 3.0, 0.0, 1.0);
  e += boite(d, cle, 0.26, 3.0, vec3(1.0, 0.97, 0.92));
  e += boite(d, vec3(-cle.x, cle.y, 0.66), 0.18, 1.0, vec3(0.62, 0.78, 1.0));
  vec3 tp = pierre / max(max(pierre.r, max(pierre.g, pierre.b)), 1e-3);
  return e * (0.45 + 0.55 * tp);
}

/* GGX : la distribution qui donne un éclat serré avec une retombée
   douce. Un Blinn-Phong à exposant élevé produit un point dur ; c'est
   ce qui faisait "plastique verni". */
float ggx(vec3 n, vec3 v, vec3 l, float rug){
  vec3 h = normalize(l + v);
  float a = max(rug * rug, 1e-3);
  float NoH = clamp(dot(n, h), 0.0, 1.0);
  float NoL = clamp(dot(n, l), 0.0, 1.0);
  float NoV = clamp(dot(n, v), 1e-4, 1.0);
  float d = NoH * NoH * (a * a - 1.0) + 1.0;
  float D = a * a / max(3.14159265 * d * d, 1e-7);
  float k = a * 0.5;
  float G = (NoL / max(NoL * (1.0 - k) + k, 1e-6))
          * (NoV / max(NoV * (1.0 - k) + k, 1e-6));
  return D * G / max(4.0 * NoL * NoV, 1e-6) * NoL;
}

float schlick(float F0, float cosT){
  return F0 + (1.0 - F0) * pow(clamp(1.0 - cosT, 0.0, 1.0), 5.0);
}

/* Compression sur la LUMINANCE seule.

   ACES appliqué aux trois canaux séparément écrase le canal dominant et
   presque pas les autres : un bleu saturé voit ses trois canaux se
   rapprocher, donc il grise. C'était la cause exacte de la
   désaturation observée. On comprime la luminance, puis on réapplique
   les rapports d'origine. Seules les très hautes lumières blanchissent,
   comme le fait un vrai éclat. */
vec3 comprimer(vec3 c){
  float l = max(dot(c, vec3(0.2126, 0.7152, 0.0722)), 1e-6);
  float lt = clamp((l * (2.51 * l + 0.03)) / (l * (4.43 * l + 0.59) + 0.14),
                   0.0, 1.0);
  vec3 o = c * (lt / l);
  float k = clamp((lt - 0.75) / 0.25, 0.0, 1.0) * 0.35;
  return clamp(mix(o, vec3(lt), k), 0.0, 1.0);
}

void main(){
  vec4 m = texture(carte, uv);
  if (m.a < 0.5) discard;                       // hors de la pièce

  vec2 nxy = m.rg * 2.0 - 1.0;
  float nz = sqrt(max(1.0 - dot(nxy, nxy), 1e-4));
  vec3 n = normalize(vec3(nxy, nz));
  float ep = m.b;                               // épaisseur traversée

  vec3 base = versLineaire(col.rgb);
  vec3 v = vec3(0.0, 0.0, 1.0);
  vec3 cle = normalize(vec3(-0.42, -0.78, 0.46));
  vec3 opp = normalize(vec3(0.42, 0.78, 0.72));
  vec3 froi = normalize(vec3(0.72, -0.10, 0.68));

  float NoV = clamp(n.z, 1e-4, 1.0);

  /* DISPERSION. Chaque canal est réfléchi avec un indice légèrement
     différent, donc dans une direction légèrement différente : les
     arêtes prennent une frange chaude d'un côté, froide de l'autre.
     C'est la signature d'une vraie pierre, et elle ne coûte que deux
     évaluations d'environnement de plus. */
  vec3 couleur = vec3(0.0);
  for (int i = 0; i < 3; i++){
    float dec = (i == 0) ? -dispersion : ((i == 2) ? dispersion : 0.0);
    float ior = 1.76 + dec;
    float F0 = (ior - 1.0) / (ior + 1.0);
    F0 = F0 * F0;
    vec3 nn = normalize(vec3(n.xy * (1.0 + dec * 1.4), n.z));
    vec3 r = normalize(2.0 * clamp(nn.z, 1e-4, 1.0) * nn - v);
    vec3 e = environnement(r, cle, base) * schlick(F0, NoV);
    couleur[i] = e[i];
  }

  float F0m = (1.76 - 1.0) / (1.76 + 1.0);
  F0m = F0m * F0m;
  float Fm = schlick(F0m, NoV);

  /* CORPS. Une clé, plus deux remplissages dont un OPPOSÉ à la clé :
     sans lui, une facette détournée tombe à zéro et la diagonale d'une
     demi-case se lit comme une balafre noire. Vu à l'image.

     L'assombrissement passe par la SATURATION, pas par du gris : dans
     une pierre, l'ombre est là où la lumière a traversé le plus de
     matière, donc là où la couleur est la plus profonde. */
  float nl = clamp(dot(n, cle), 0.0, 1.0);
  float no = clamp(dot(n, opp), 0.0, 1.0);
  float nc = clamp(dot(n, froi), 0.0, 1.0);
  float intensite = 0.12 + 1.60 * nl + 0.30 * no + 0.24 * nc;
  float p = 1.0 + 1.9 * clamp(1.0 - intensite, 0.0, 1.0);
  vec3 corps = pow(base, vec3(p)) * (0.55 + 0.45 * ep) * intensite;
  couleur += (1.0 - Fm) * corps * 1.95;

     C'est le contraste entre les deux qui lit comme une pierre ; un
     seul lobe lit comme du vernis. */
  /* Intensités divisées par deux environ : sur l'appareil, le blanc
     mangeait la couleur des pièces. */
  couleur += min(ggx(n, v, cle,  0.085), 2.0) *  4.5 * vec3(1.0, 0.98, 0.94);
  couleur += min(ggx(n, v, cle,  0.038), 2.0) * 10.0 * vec3(1.0, 0.99, 0.97);
  couleur += min(ggx(n, v, froi, 0.050), 2.0) *  5.0 * vec3(0.70, 0.82, 1.0);
  couleur += min(ggx(n, v, opp,  0.200), 2.0) *  2.0 * vec3(0.55, 0.60, 0.75);

  /* Fresnel de tranche, TEINTÉ par la pierre. Achromatique, il
     redonnerait le liseré gris qu'on cherche justement à supprimer. */
  float bord = pow(1.0 - NoV, 3.0) * 0.24;
  couleur += bord * (base * 0.72 + vec3(0.55, 0.68, 0.95) * 0.28) * 3.2;

  vec3 res = comprimer(min(couleur, vec3(10.0)));
  res = pow(res, vec3(1.0 / 2.2));

  /* --------------------------------------------------------------------
     Ce qui suit n'est PAS de la physique, et c'est assume.

     Tout ce qui precede simule : indices, Fresnel, absorption. Le
     resultat est correct et un peu mort. Les jeux dont les gemmes sont
     belles ne simulent pas, ils dessinent : Unity, sur son propre exemple
     de jeu de gemmes, place une lumiere FICTIVE et fabrique ses reflets.
     Les deux etages ci-dessous font pareil, et ce sont eux qui ont
     emporte la validation a l'image.
     -------------------------------------------------------------------- */

  vec2 pix = uv * taille;                 // coordonnees locales a la piece

  /* INCLUSIONS. La texture n'est pas posee sur la surface : elle est vue
     A TRAVERS, decalee par la normale. Elle donne l'impression de
     regarder dedans, et plus la pierre est epaisse, plus on voit loin. */
  if (inclusion > 0.001){
    float echelle = cellPx * inclEchelle;
    vec2 c = (pix + n.xy * inclParal * cellPx * (0.3 + ep)) / echelle;
    float t = (texture(grain, c).r - inclMoy) / inclEcart;
    res *= 1.0 + t * inclusion * 0.16 * (0.25 + ep);
  }

  /* La barre de miroitement fabriquée qui se trouvait ici est RETIRÉE.
     Je l'avais ajoutée d'après l'exemple Unity, et annoncée comme à peine
     visible. Sur l'appareil elle produisait de larges lavis blancs en
     travers des pièces. Une source d'écran vaut mieux qu'un raisonnement :
     supprimée, pas attenuée. */

  /* Dernier filet : une composante invalide se propagerait en noir sur
     toute la pièce. On la remplace par la couleur demandée plutôt que
     de laisser l'écran mentir. Ce garde-fou a déjà servi. */
  if (!(res.r == res.r) || !(res.g == res.g) || !(res.b == res.b)) res = col.rgb;
  sortie = vec4(res, col.a);
}`,

  _compiler(gl, type, source){
    const s = gl.createShader(type);
    gl.shaderSource(s, source);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
      const log = gl.getShaderInfoLog(s) || "compilation refusée";
      gl.deleteShader(s);
      throw new Error(log);
    }
    return s;
  },

  init(){
    if (this.essaye) return this.actif;
    this.essaye = true;
    try{
      const cv = document.createElement("canvas");
      cv.width = 8; cv.height = 8;
      const gl = cv.getContext("webgl2", {
        alpha: true, premultipliedAlpha: false, antialias: true,
        depth: false, stencil: false, preserveDrawingBuffer: true
      });
      if (!gl) throw new Error("WebGL2 indisponible");

      const vs = this._compiler(gl, gl.VERTEX_SHADER, this.SOMMET);
      const fs = this._compiler(gl, gl.FRAGMENT_SHADER, this.FRAGMENT);
      const p = gl.createProgram();
      gl.attachShader(p, vs); gl.attachShader(p, fs); gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS))
        throw new Error(gl.getProgramInfoLog(p) || "édition de liens refusée");
      gl.deleteShader(vs); gl.deleteShader(fs);

      this.aPos = gl.getAttribLocation(p, "pos");
      this.uRes = gl.getUniformLocation(p, "res");
      this.uCol = gl.getUniformLocation(p, "col");
      this.uCarte = gl.getUniformLocation(p, "carte");
      this.uDispersion = gl.getUniformLocation(p, "dispersion");
      this.uGrain = gl.getUniformLocation(p, "grain");
      this.uTaille = gl.getUniformLocation(p, "taille");
      this.uCellPx = gl.getUniformLocation(p, "cellPx");
      this.uInclusion = gl.getUniformLocation(p, "inclusion");
      this.uInclEchelle = gl.getUniformLocation(p, "inclEchelle");
      this.uInclParal = gl.getUniformLocation(p, "inclParal");
      this.uInclMoy = gl.getUniformLocation(p, "inclMoy");
      this.uInclEcart = gl.getUniformLocation(p, "inclEcart");
      const manquants = [];
      if (this.aPos < 0) manquants.push("pos");
      if (!this.uRes) manquants.push("res");
      if (!this.uCol) manquants.push("col");
      if (!this.uCarte) manquants.push("carte");
      if (!this.uDispersion) manquants.push("dispersion");
      /* Les quatre premières sont vitales ; « dispersion » a une valeur
         par défaut dans le nuanceur, mais son absence doit rester
         VISIBLE dans le diagnostic plutôt que d'être avalée. */
      if (manquants.length) this.manquants = manquants.join(", ");
      if (this.aPos < 0 || !this.uRes || !this.uCol || !this.uCarte)
        throw new Error("variables du nuanceur introuvables : " + this.manquants);

      this.buf = gl.createBuffer();
      this.tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, this.tex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);

         Sans cet écouteur, le moteur restait éteint pour le reste de la
         partie alors qu'il pouvait repartir : le joueur perdait le beau
         rendu en rallumant son téléphone. On repart de zéro, car les

      cv.addEventListener("webglcontextrestored", ()=>{
        this.actif = false; this.essaye = false; this.verifie = false;

           que le contexte était perdu, `rendre()` renvoyait null, et ces

           concernées resteraient au rendu processeur pour le reste de la

  /** Triangulation d'une pièce, en pixels, marge comprise.
      Une case entière donne deux triangles, une facette un seul —
      exactement la géométrie que le rendu 2D dessine déjà. */
  triangles(cells, cell, M){
    const t = [];
    for (const c of cells){
      const x = M + c.c * cell, y = M + c.r * cell, e = cell;
      if (!c.t){
        t.push(x,y, x+e,y, x+e,y+e,  x,y, x+e,y+e, x,y+e);
      } else if (c.t === "TL"){ t.push(x,y, x+e,y, x,y+e); }
      else if (c.t === "TR"){ t.push(x,y, x+e,y, x+e,y+e); }
      else if (c.t === "BR"){ t.push(x+e,y, x+e,y+e, x,y+e); }
      else if (c.t === "BL"){ t.push(x,y, x+e,y+e, x,y+e); }
    }
    return new Float32Array(t);
  },

  /** Rend le corps d'une pièce et renvoie le canevas, ou null si
      quoi que ce soit cloche — l'appelant reprend alors le rendu 2D. */
  /** Carte de relief : deux canaux tirés du champ de distance exact.
      R = hauteur du biseau (0 sur l'arête, 1 au sommet de la couronne),
      G = épaisseur traversée, qui densifie la couleur au cœur. */
  /** Maximum glissant, séparable et en temps linéaire (file monotone).
      Sert à estimer l'épaisseur locale de la pièce. */
  _maxGlissant(src, w, h, r){
    const tmp = new Float32Array(w*h), out = new Float32Array(w*h);
    const file = new Int32Array(Math.max(w, h));
    const passe = (lire, ecrire, n, m) => {
      for (let l = 0; l < m; l++){
        let deb = 0, fin = 0;
        for (let i = 0; i < n + r; i++){
          if (i < n){
            const v = lire(l, i);
            while (fin > deb && lire(l, file[fin-1]) <= v) fin--;
            file[fin++] = i;
          }
          const c = i - r;
          if (c >= 0){
            while (file[deb] < c - r) deb++;
            ecrire(l, c, lire(l, file[deb]));
          }
        }
      }
    };
    passe((y,x)=>src[y*w+x], (y,x,v)=>{ tmp[y*w+x] = v; }, w, h);
    passe((x,y)=>tmp[y*w+x], (x,y,v)=>{ out[y*w+x] = v; }, h, w);
    return out;
  },

  /** Moyenne glissante séparable, en temps linéaire.
      Sert à adoucir les arêtes de la taille avant de dériver la
      normale : sans elle, chaque marche produit une pente d'un seul
      pixel, donc un liseré crénelé.

      Écrite en boucles directes sur les tableaux typés, SANS fonctions
      passées en argument. Mesuré : la version à base de fermetures
      coûtait 18 ms pour 234 000 pixels, soit 70 ns par pixel pour une
      addition — le moteur JavaScript ne peut pas intégrer un appel
      indirect dans une boucle serrée. */
  _moyenneGlissante(src, w, h, r){
    const tmp = new Float32Array(w*h), out = new Float32Array(w*h);
    for (let y = 0; y < h; y++){
      const o = y*w;
      let somme = 0;
      for (let i = 0; i <= r && i < w; i++) somme += src[o+i];
      for (let x = 0; x < w; x++){
        const g = x-r < 0 ? 0 : x-r, d = x+r > w-1 ? w-1 : x+r;
        tmp[o+x] = somme / (d-g+1);
        const s = x-r, e = x+r+1;
        if (s >= 0) somme -= src[o+s];
        if (e < w)  somme += src[o+e];
      }
    }
    for (let x = 0; x < w; x++){
      let somme = 0;
      for (let i = 0; i <= r && i < h; i++) somme += tmp[i*w+x];
      for (let y = 0; y < h; y++){
        const g = y-r < 0 ? 0 : y-r, d = y+r > h-1 ? h-1 : y+r;
        out[y*w+x] = somme / (d-g+1);
        const s = y-r, e = y+r+1;
        if (s >= 0) somme -= tmp[s*w+x];
        if (e < h)  somme += tmp[e*w+x];
      }
    }
    return out;
  },

  /** Demi-épaisseur locale de la pièce, calculée en RÉSOLUTION RÉDUITE.

      C'est une grandeur lisse : elle dit « quelle largeur de matière y
      a-t-il autour de ce point », et elle ne varie pas d'un pixel à
      l'autre. La calculer à pleine résolution était du gaspillage —
      mesuré, elle pesait à elle seule un tiers du temps de construction.

      Sur une grille quatre fois plus grossière, le maximum glissant et
      le lissage coûtent seize fois moins. Le rééchantillonnage vers la
      pleine résolution est fait au plus proche : l'erreur maximale est
      de quelques pixels sur une valeur qui sert de PLAFOND, jamais de
      seuil visible. */
  _epaisseurLocale(dch, w, h, cell){
    const P = 4;
    const wp = Math.max(2, Math.ceil(w/P)), hp = Math.max(2, Math.ceil(h/P));
    const petit = new Float32Array(wp*hp);
    for (let y = 0; y < h; y++){
      const yp = (y/P)|0, o = yp*wp;
      for (let x = 0; x < w; x++){
        const i = o + ((x/P)|0), v = dch[y*w+x];
        if (v > petit[i]) petit[i] = v;
      }
    }
    let loc = this._maxGlissant(petit, wp, hp,
                Math.max(1, Math.round(cell * 0.55 / P)));
    loc = this._moyenneGlissante(loc, wp, hp,
                Math.max(1, Math.round(cell * 0.15 / P)));
    const plein = new Float32Array(w*h);
    for (let y = 0; y < h; y++){
      const o = ((y/P)|0)*wp, l = y*w;
      for (let x = 0; x < w; x++) plein[l+x] = loc[o + ((x/P)|0)];
    }
    /* Le rehaussement au plus proche laisse des marches de P pixels.
       Elles sont invisibles sur l'epaisseur elle-meme, mais elle DIVISE
       la hauteur : les marches ressortent alors en escalier le long des
       biseaux diagonaux. Défaut bien réel, vu sur l'appareil — et que ma
       première vérification avait manqué parce que je réduisais l'image
       avant de la regarder. Un lissage de la largeur d'un bloc les efface
       pour un coût linéaire. */
    return this._moyenneGlissante(plein, w, h, P);
  },

  /** CARTE DE NORMALES envoyée au processeur graphique.

      C'est ici que se fabrique la taille. Deux échelles de relief
      s'additionnent AVANT qu'on dérive la normale : il n'y a donc
      qu'une seule surface, pas deux effets superposés.

      GRANDE ÉCHELLE — une bombure douce, calculée sur la distance
      EUCLIDIENNE. Elle suit la forme et reste ronde : c'est elle qui
      donne le volume. Sans elle, la table est un plan, et un plan a une
      couleur plate quelle que soit la finesse du biseau.

      PETITE ÉCHELLE — un biseau puis une marche de table, calculés sur
      la distance de TCHEBYCHEV. Elle suit les côtés droits, donc les
      marches se rejoignent en onglet à 45° : la géométrie d'une taille
      en degrés, et non des courbes de niveau.

      Les deux largeurs sont BORNÉES par l'épaisseur locale de la pièce.
      C'est le garde-fou décisif : sans lui, sur une case isolée le
      biseau atteint le centre et la pierre devient un toit à quatre
      pans ; sur un bras d'une case, une gouttière.

      Sorties : R,G = normale (x,y), B = épaisseur traversée,
                A = couverture. */
  reliefDe(cells, cell, sharp){
    const c = Gemme.champ(cells, cell, sharp);
    if (!c || !c.cheb) return null;
    const w = c.w, h = c.h, n = w*h;
    const deu = c.dist, dch = c.cheb;

    /* Demi-épaisseur locale : jusqu'où la taille a le droit de monter. */
    const loc = this._epaisseurLocale(dch, w, h, cell);

    const bombe  = cell * this.BOMBE;
    const bombeL = cell * this.BOMBE_L;
    const largeur = cell * this.BISEAU;
    const prof   = cell * this.PROF;
    const tableL = cell * this.TABLE_L;
    const tableH = cell * this.TABLE_H;

    const z = new Float32Array(n), ep = new Float32Array(n);
    for (let i = 0; i < n; i++){
      if (!c.masque[i]){ z[i] = 0; ep[i] = 0; continue; }
      const li = Math.max(loc[i], 3);

      /* Épaisseur traversée : elle sert à la couleur, elle garde donc
         toute la demi-épaisseur pour référence. */
      const td = Math.min(deu[i] / Math.max(li * 1.05, 3), 1);
      ep[i] = td;
      /* Montée de la bombure : bornée, elle. */
      const tb0 = Math.min(deu[i] / Math.min(bombeL, Math.max(li * 1.05, 3)), 1);
      /* Profil de la bombure. La racine carrée montait encore au coeur de
         la pièce : or c'est là que passe l'axe médian, la ligne où deux
         bords se disputent le point le plus proche. La direction de la
         pente y bascule d'un coup, ce qui dessine une grande diagonale en
         travers des pièces larges — visible sur l'appareil.
         Ce profil-ci arrive à plat (sa pente s'annule en td=1) : les deux
         versants se rejoignent sans arête, la diagonale disparaît, et le
         volume est conservé. */
      let hz = bombe * (tb0 * tb0 * (3 - 2 * tb0));

      const lb = Math.min(largeur, Math.max(li * 0.55, 3));
      const tb = Math.min(dch[i] / lb, 1);
      const f = Math.min(tb * 2.2, 1);
      hz += prof * (f*f*(3-2*f));

      const lt = Math.min(tableL, Math.max(li * 0.45, 3));
      const tt = Math.max(0, Math.min((dch[i] - lb) / Math.max(lt, 1), 1));
      const g = Math.min(tt * 2.4, 1);
      hz += tableH * (g*g*(3-2*g));

      z[i] = hz;
    }

    /* Adoucissement : deux passages de rayon 1 approchent une gaussienne
       d'écart-type voisin de 1,15 pixel. Assez pour tuer l'escalier des
       marches, trop peu pour arrondir la silhouette. */
    let zl = this._moyenneGlissante(z, w, h, 1);
    zl = this._moyenneGlissante(zl, w, h, 1);

    const px = new Uint8Array(n * 4);
    const PMAX = this.PENTE_MAX;
    for (let y = 0; y < h; y++){
      for (let x = 0; x < w; x++){
        const i = y*w + x, o = i*4;
        if (!c.masque[i]){ px[o+3] = 0; continue; }
        const xg = Math.min(w-1, x+1), xd = Math.max(0, x-1);
        const yb = Math.min(h-1, y+1), yh = Math.max(0, y-1);
        let gx = (zl[y*w + xg] - zl[y*w + xd]) * 0.5;
        let gy = (zl[yb*w + x] - zl[yh*w + x]) * 0.5;

        /* Plafond de pente : dans un angle rentrant, deux biseaux se
           rencontrent et la paroi devient presque verticale. La normale
           bascule à l'horizontale, l'éclat sature et la dispersion
           sépare les canaux — d'où les taches pâles vues à l'image.
           On corrige la géométrie, pas la couleur. */
        const g = Math.hypot(gx, gy);
        if (g > PMAX){ const k = PMAX / g; gx *= k; gy *= k; }

        const nn = Math.hypot(gx, gy, 1);
        px[o]   = Math.round(((-gx / nn) * 0.5 + 0.5) * 255);
        px[o+1] = Math.round(((-gy / nn) * 0.5 + 0.5) * 255);
        px[o+2] = Math.round(Math.min(Math.max(ep[i], 0), 1) * 255);
        px[o+3] = 255;
      }
    }
    return { px, w, h, M: c.M };
  },

  /** Rendu mis en cache. C'est ce que l'affichage doit appeler.
      `rendre()` reste le calcul brut, volontairement séparé pour
      pouvoir être mesuré et testé seul. */
  obtenir(cells, cell, color, sharp){
    const k = color + "|" + Math.round(cell) + "|" + (sharp ? "v" : "a") + "|"
            + cells.map(c => c.c + "," + c.r + (c.t || "")).join(";");
    if (this.cache.has(k)) return this.cache.get(k);
    const g = this.rendre(cells, cell, color, sharp);
    let entree = null;
    if (g && g.cv){
      /* Copie dans un canevas à part : `this.cv` est unique et sera
         réutilisé par la pièce suivante. Sans cette copie, toutes les
         entrées du cache pointeraient vers la même image. */
      try{
        const cv = document.createElement("canvas");
        cv.width = g.cv.width; cv.height = g.cv.height;
        cv.getContext("2d").drawImage(g.cv, 0, 0);
        entree = { cv, M: g.M };
      }catch(e){ entree = null; }
    }
    if (this.cache.size >= this.MAX)
      this.cache.delete(this.cache.keys().next().value);
    this.cache.set(k, entree);
    return entree;
  },

  vider(){ this.cache.clear(); },

  rendre(cells, cell, color, sharp){
    if (!this.actif && !this.init()) return null;
    if (!this.actif) return null;
    try{
      const gl = this.gl, M = 2;
      const carte = this.reliefDe(cells, cell, sharp);
      if (!carte) return null;
      const w = carte.w, h = carte.h;
      if (w < 4 || h < 4 || w > 4096 || h > 4096) return null;
      if (this.cv.width !== w || this.cv.height !== h){
        this.cv.width = w; this.cv.height = h;
      }
      const tri = this.triangles(cells, cell, M);
      gl.viewport(0, 0, w, h);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.useProgram(this.prog);
      gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
      gl.bufferData(gl.ARRAY_BUFFER, tri, gl.STREAM_DRAW);
      gl.enableVertexAttribArray(this.aPos);
      gl.vertexAttribPointer(this.aPos, 2, gl.FLOAT, false, 0, 0);
      gl.uniform2f(this.uRes, w, h);
      const r = parseInt(color.substr(1,2),16) / 255,
            v = parseInt(color.substr(3,2),16) / 255,
            b = parseInt(color.substr(5,2),16) / 255;
      gl.uniform4f(this.uCol, r, v, b, 1);

      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, this.tex);
      gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, carte.px);
      gl.uniform1i(this.uCarte, 0);
      if (this.uDispersion) gl.uniform1f(this.uDispersion, this.DISPERSION);
      if (this.uTaille) gl.uniform2f(this.uTaille, w, h);
      if (this.uCellPx) gl.uniform1f(this.uCellPx, cell);
      /* La texture n'est demandée qu'au premier rendu réel : inutile de
         décoder 18 Ko si le moteur ne sert jamais. */
      this.chargerGrain(gl);
      if (this.grainPret && this.uGrain){
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, this.grainTex);
        gl.uniform1i(this.uGrain, 1);
        gl.activeTexture(gl.TEXTURE0);
      }
      if (this.uInclusion)
        gl.uniform1f(this.uInclusion, this.grainPret ? this.INCLUSION : 0.0);
      if (this.uInclEchelle) gl.uniform1f(this.uInclEchelle, this.INCL_ECHELLE);
      if (this.uInclParal) gl.uniform1f(this.uInclParal, this.INCL_PARAL);
      if (this.uInclMoy) gl.uniform1f(this.uInclMoy, this.INCL_MOY);
      if (this.uInclEcart) gl.uniform1f(this.uInclEcart, this.INCL_ECART);

      gl.drawArrays(gl.TRIANGLES, 0, tri.length / 2);
      if (gl.getError() !== gl.NO_ERROR) return null;

      /* CONTRÔLE DU RÉSULTAT. Je ne peux pas exécuter de nuanceur dans
         mon environnement : une faute de calcul ne se voit que sur
         l'appareil, et elle s'est vue — les pièces sont apparues noires
         chez Fabien. Le moteur relit donc quelques pixels de ce qu'il
         vient de produire et les compare à la couleur demandée.

         Les points sont choisis DANS LE MASQUE, pas au centre de la
         boîte englobante. C'est une correction importante : sur un L,
         un T ou un U, le centre de la boîte est VIDE. Un contrôle qui
         y échantillonne ne lit que du transparent, conclut à un rendu
         raté et éteint WebGL2 pour toute la partie — alors que rien
         n'est cassé. Le remède serait pire que le mal. */
      if (!this.verifie){
        this.verifie = true;
        const ech = new Uint8Array(4);
        let vus = 0, somme = 0;
        for (let k = 1; k <= 7 && vus < 5; k++){
          const idx = Math.floor(w * h * k / 8);
          const px = idx % w, py = Math.floor(idx / w);
          if (carte.px[(py*w + px)*4 + 3] < 128) continue;   // hors pièce
          gl.readPixels(px, h - 1 - py, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, ech);
          if (ech[3] < 40) continue;
          vus++; somme += (ech[0] + ech[1] + ech[2]) / 3;
        }
        /* Aucun point lisible : on ne CONCLUT RIEN. Une pièce minuscule
           ou très ajourée ne doit pas condamner le moteur. */
        if (vus > 0){
          const moyenne = somme / vus;
          const voulue = (r + v + b) / 3 * 255;
          if (moyenne < Math.max(4, voulue * 0.10)){
            this.actif = false;
            this.raison = "rendu invalide (pièce trop sombre : "
              + Math.round(moyenne) + " au lieu d'environ "
              + Math.round(voulue) + ") — retour au rendu processeur";
            return null;
          }
        }
      }
      return { cv: this.cv, M };
    }catch(e){
      this.actif = false; this.raison = (e && e.message) || "erreur de rendu";
      return null;
    }
  }
};

/* ------------------------------------------------------------------
   GEMME — relief des pièces par champ de distance
   ------------------------------------------------------------------
   Rôle    : donner aux pièces un vrai relief de pierre taillée.
   Dépend  : PieceManager (silhouette), Renderer.shape.
   Piège   : le résultat est MIS EN CACHE. Il ne dépend que de la
             forme, de la taille de case et de la couleur — jamais de
             la position. Recalculer à chaque image serait du gaspillage.

   Pourquoi un champ de distance, et pas un simple dégradé : un flou de
   la silhouette est radial, il ignore la forme et arrondit tout. Les
   pièces devenaient des galets et on ne lisait plus les L ni les T.
   Un champ de distance mesure la vraie distance au contour le plus
   proche ; sa PENTE donne une normale de surface qui épouse l'arête,
   y compris dans les angles rentrants. C'est ce que fait une carte de
   normales en 3D, obtenu ici par le calcul, sans aucune géométrie et
   sans le moindre octet ajouté au fichier.

   Le WebGL a été envisagé puis écarté : l'éclairage étant figé une
   fois pour toutes, le GPU n'apportait que des risques (perte de
   contexte, repli à prévoir, appareils modestes) pour un résultat
   identique. Il redeviendrait utile pour un reflet qui suit
   l'inclinaison du téléphone, ou une réfraction du fond.
   ------------------------------------------------------------------ */
const Gemme = {
  cache: new Map(),
  MAX: 48,                     // borne mémoire : au-delà, on oublie les plus anciennes
  BISEAU: 0.34,                // taille profonde, choisie par Fabien sur maquette

  vider(){ this.cache.clear(); this.champs.clear(); },

  cle(cells, cell, color){
    return color + "|" + Math.round(cell) + "|"
      + cells.map(c => c.c + "," + c.r + (c.t || "")).join(";");
  },

  /** Transformée de distance exacte, algorithme de Felzenszwalb : une
      passe par ligne puis une par colonne, chacune en temps linéaire.
      Bien plus rapide qu'un balayage naïf, et surtout EXACTE — une
      approximation ferait onduler les arêtes. */
  _edt1d(f, n, d, v, z){
    let k = 0; v[0] = 0; z[0] = -1e20; z[1] = 1e20;
    for (let q = 1; q < n; q++){
      let s = ((f[q] + q*q) - (f[v[k]] + v[k]*v[k])) / (2*q - 2*v[k]);
      while (s <= z[k]){
        k--;
        s = ((f[q] + q*q) - (f[v[k]] + v[k]*v[k])) / (2*q - 2*v[k]);
      }
      k++; v[k] = q; z[k] = s; z[k+1] = 1e20;
    }
    k = 0;
    for (let q = 0; q < n; q++){
      while (z[k+1] < q) k++;
      d[q] = (q - v[k])*(q - v[k]) + f[v[k]];
    }
  },
  _distance(masque, w, h){
    const INF = 1e20;
    const f = new Float64Array(Math.max(w, h));
    const d = new Float64Array(Math.max(w, h));
    const v = new Int32Array(Math.max(w, h));
    const z = new Float64Array(Math.max(w, h) + 1);
    const carre = new Float64Array(w * h);
    for (let i = 0; i < w*h; i++) carre[i] = masque[i] ? INF : 0;
    for (let y = 0; y < h; y++){                       // par ligne
      for (let x = 0; x < w; x++) f[x] = carre[y*w + x];
      this._edt1d(f, w, d, v, z);
      for (let x = 0; x < w; x++) carre[y*w + x] = d[x];
    }
    for (let x = 0; x < w; x++){                       // par colonne
      for (let y = 0; y < h; y++) f[y] = carre[y*w + x];
      this._edt1d(f, h, d, v, z);
      for (let y = 0; y < h; y++) carre[y*w + x] = d[y];
    }
    const dist = new Float32Array(w * h);
    for (let i = 0; i < w*h; i++) dist[i] = Math.sqrt(carre[i]);
    return dist;
  },

  /** Distance de TCHEBYCHEV au contour (métrique de l'échiquier).
